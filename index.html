}
// Revoke all object URLs in a map. Idempotent. Mutates the map (clears entries).
function revokeUrlMap(urlMap) {
  if (!urlMap) return;
  for (const k of Object.keys(urlMap)) {
    if (urlMap[k]) {
      try { URL.revokeObjectURL(urlMap[k]); } catch (e) {}
    }
    delete urlMap[k];
  }
}
// Compute simple deltas between two check-ins. Null-safe.
// Returns { days, weight_delta, waist_delta } — any field may be null if missing.
function computeCheckinDelta(left, right) {
  if (!left || !right) return null;
  const days = daysBetween(left.date, right.date);
  const weight_delta = (left.weight_kg != null && right.weight_kg != null)
    ? right.weight_kg - left.weight_kg : null;
  const waist_delta = (left.waist_cm != null && right.waist_cm != null)
    ? right.waist_cm - left.waist_cm : null;
  return { days, weight_delta, waist_delta };
}
// Pick default { leftId, rightId } for a compare mode. Returns null if insufficient.
// Input: checkIns sorted oldest-first (we sort internally to be safe).
function pickCompareDefaults(checkIns, mode) {
  if (!checkIns || checkIns.length < 2) return null;
  const sorted = checkIns.slice().sort((a, b) => a.date.localeCompare(b.date));
  const latest = sorted[sorted.length - 1];
  if (mode === 'start-latest') {
    return { leftId: sorted[0].id, rightId: latest.id };
  }
  if (mode === 'prev-latest') {
    return { leftId: sorted[sorted.length - 2].id, rightId: latest.id };
  }
  // custom: default both to latest; user picks
  return { leftId: latest.id, rightId: latest.id };
}

// ====================================================================
// v1.10.35 — T-013d: Recomp Insight helpers (pure · testable · null-safe)
// ====================================================================
const INSIGHT_THRESHOLDS = {
  MIN_DAYS_FOR_INSIGHT: 7,
  MIN_DAYS_FOR_CONFIRMED: 14,
  MIN_DAYS_FOR_REVIEW_NEEDED: 21,
  MEANINGFUL_WEIGHT_DROP_KG: 0.5,
  MIN_WEEKLY_DROP_KG: 0.15,
  FLAT_WEIGHT_BAND_KG: 0.3,
  WAIST_FLAT_BAND_CM: 1.0,
  KCAL_PER_KG_FAT: 7700,
  MIN_DEFICIT_FOR_CONFIRMED: 200,
  RECOMP_GAP_THRESHOLD_KG: 0.5,
  RECOMP_MIN_TRAINING_COUNT: 4,
  DEFAULT_INSIGHT_WINDOW_DAYS: 21
};

// Average weight at one end of the window (uses ±3-day local mean if available, else nearest single point)
function _localWeightMean(weights, anchorDate) {
  if (!weights || weights.length === 0) return null;
  const anchor = keyToDate(anchorDate);
  const windowMs = 3 * 86400000;
  const near = weights.filter(w => Math.abs(keyToDate(w.date) - anchor) <= windowMs);
  if (near.length > 0) {
    return near.reduce((s, w) => s + w.weight_kg, 0) / near.length;
  }
  // Fall back to nearest single point
  let best = null, bestDiff = Infinity;
  for (const w of weights) {
    const d = Math.abs(keyToDate(w.date) - anchor);
    if (d < bestDiff) { bestDiff = d; best = w; }
  }
  return best ? best.weight_kg : null;
}

function computeWeightTrend(user, endDate, windowDays) {
  const out = { has_data: false, data_points: 0, latest_kg: null, oldest_kg: null,
                days_span: 0, change_kg: null, change_per_week_kg: null, direction: 'flat' };
  if (!user) return out;
  const weights = (user.weights || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (weights.length === 0) return out;
  const end = endDate || todayKey();
  const start = dateToKey(addDays(keyToDate(end), -(windowDays - 1)));
  const inWindow = weights.filter(w => w.date >= start && w.date <= end);
  if (inWindow.length < 2) {
    // If user only has 1 point in window, still surface it as latest with no change
    if (inWindow.length === 1) {
      out.has_data = true;
      out.data_points = 1;
      out.latest_kg = inWindow[0].weight_kg;
      out.oldest_kg = inWindow[0].weight_kg;
    }
    return out;
  }
  const oldest = inWindow[0], latest = inWindow[inWindow.length - 1];
  const oldest_mean = _localWeightMean(weights, oldest.date);
  const latest_mean = _localWeightMean(weights, latest.date);
  const change = latest_mean - oldest_mean;
  const days = daysBetween(oldest.date, latest.date);
  const change_per_week = days > 0 ? change * 7 / days : 0;
  let direction = 'flat';
  if (change <= -INSIGHT_THRESHOLDS.FLAT_WEIGHT_BAND_KG) direction = 'down';
  else if (change >= INSIGHT_THRESHOLDS.FLAT_WEIGHT_BAND_KG) direction = 'up';
  out.has_data = true;
  out.data_points = inWindow.length;
  out.latest_kg = latest_mean;
  out.oldest_kg = oldest_mean;
  out.days_span = days;
  out.change_kg = change;
  out.change_per_week_kg = change_per_week;
  out.direction = direction;
  return out;
}

function computeWaistTrend(user, endDate, windowDays) {
  const out = { has_data: false, data_points: 0, latest_cm: null, oldest_cm: null,
                days_span: 0, change_cm: null, direction: 'flat' };
  if (!user) return out;
  const waist = (user.waist || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (waist.length === 0) return out;
  const end = endDate || todayKey();
  const start = dateToKey(addDays(keyToDate(end), -(windowDays - 1)));
  const inWindow = waist.filter(w => w.date >= start && w.date <= end);
  if (inWindow.length < 1) return out;
  if (inWindow.length === 1) {
    out.has_data = true;
    out.data_points = 1;
    out.latest_cm = inWindow[0].waist_cm;
    out.oldest_cm = inWindow[0].waist_cm;
    return out;
  }
  const oldest = inWindow[0], latest = inWindow[inWindow.length - 1];
  const change = latest.waist_cm - oldest.waist_cm;
  const days = daysBetween(oldest.date, latest.date);
  let direction = 'flat';
  if (change <= -INSIGHT_THRESHOLDS.WAIST_FLAT_BAND_CM) direction = 'down';
  else if (change >= INSIGHT_THRESHOLDS.WAIST_FLAT_BAND_CM) direction = 'up';
  out.has_data = true;
  out.data_points = inWindow.length;
  out.latest_cm = latest.waist_cm;
  out.oldest_cm = oldest.waist_cm;
  out.days_span = days;
  out.change_cm = change;
  out.direction = direction;
  return out;
}

function computePredictedLossFromDeficit(user, windowDays, endDate) {
  const out = { has_data: false, avg_deficit_per_day_kcal: null, total_deficit_kcal: null,
                predicted_loss_kg: null, days_logged: 0, data_quality: 'low' };
  if (!user) return out;
  const end = endDate || todayKey();
  const keys = lastNDaysKeys(windowDays, end);
  const tdee = calcTDEE(user);
  const incExercise = activityIncludesExercise(user);
  let totalDeficit = 0, daysLogged = 0;
  for (const k of keys) {
    const { entries, totals } = dayTotals(user.id, k);
    if (entries.length > 0) {
      const burn = tdee + (incExercise ? 0 : sumActivitiesBurn(user.id, k));
      // deficit (positive) means ate less than burned
      const deficitDay = burn - totals.calories;
      totalDeficit += deficitDay;
      daysLogged++;
    }
  }
  if (daysLogged === 0) return out;
  const avg = totalDeficit / daysLogged;
  // Scale "what would have been lost" to full window length (treats unlogged days as average)
  const scaledTotal = avg * windowDays;
  const predictedLoss = scaledTotal / INSIGHT_THRESHOLDS.KCAL_PER_KG_FAT; // positive = loss
  let dq = 'low';
  if (daysLogged >= 14) dq = 'high';
  else if (daysLogged >= 7) dq = 'medium';
  out.has_data = true;
  out.avg_deficit_per_day_kcal = avg;
  out.total_deficit_kcal = scaledTotal;
  out.predicted_loss_kg = predictedLoss;
  out.days_logged = daysLogged;
  out.data_quality = dq;
  return out;
}

function computeCheckinSnapshot(user, windowDays, endDate) {
  const out = { checkin_count: 0, latest_checkin: null, days_since_last: null,
                has_photos: false, has_waist_in_checkins: false };
  if (!user || !user.checkIns || user.checkIns.length === 0) return out;
  const end = endDate || todayKey();
  const start = dateToKey(addDays(keyToDate(end), -(windowDays - 1)));
  const inWindow = user.checkIns.filter(c => c.date >= start && c.date <= end);
  const sorted = inWindow.slice().sort((a, b) => b.date.localeCompare(a.date));
  out.checkin_count = inWindow.length;
  if (sorted.length > 0) {
    out.latest_checkin = sorted[0];
    out.days_since_last = daysBetween(sorted[0].date, end);
    out.has_photos = sorted.some(c => c.photoIds && Object.values(c.photoIds).some(Boolean));
    out.has_waist_in_checkins = sorted.some(c => c.waist_cm != null);
  }
  return out;
}

function computeTrainingFrequency(user, windowDays, endDate) {
  const out = { training_count: 0, strength_count: 0, cardio_count: 0 };
  if (!user) return out;
  const end = endDate || todayKey();
  const keys = lastNDaysKeys(windowDays, end);
  const cardioTypes = ['running','cycling','swimming','walking','sports','fitness'];
  for (const k of keys) {
    const acts = (user.activities && user.activities[k]) || [];
    for (const a of acts) {
      out.training_count++;
      if (a.type === 'weights') out.strength_count++;
      else if (cardioTypes.includes(a.type)) out.cardio_count++;
    }
  }
  return out;
}

// Decision tree — first match wins. Returns { status, primary_signal, reasons: [...] }
function classifyBodyProgressStatus(input) {
  const { weightTrend, waistTrend, predictedLoss, checkinSnap, training, windowDays } = input;
  const T = INSIGHT_THRESHOLDS;
  const reasons = [];

  // 1. Not Enough Data
  if (!weightTrend.has_data || weightTrend.data_points < 2 || windowDays < T.MIN_DAYS_FOR_INSIGHT) {
    reasons.push('window สั้น หรือ weight data ไม่พอ');
    return { status: 'not-enough-data', primary_signal: 'insufficient', reasons };
  }
  if (checkinSnap.checkin_count === 0 && weightTrend.data_points < 3) {
    reasons.push('ไม่มี check-in และ weight ยังน้อย');
    return { status: 'not-enough-data', primary_signal: 'insufficient', reasons };
  }

  const windowReady = windowDays >= T.MIN_DAYS_FOR_REVIEW_NEEDED;
  const deficitOK = predictedLoss.has_data && predictedLoss.days_logged >= 7;
  const meaningfulWeightDrop = weightTrend.change_kg <= -T.MEANINGFUL_WEIGHT_DROP_KG;
  const meaningfulWeeklyDrop = weightTrend.change_per_week_kg <= -T.MIN_WEEKLY_DROP_KG;
  const weightFlat = Math.abs(weightTrend.change_kg) < T.FLAT_WEIGHT_BAND_KG;
  const waistDownOrFlat = !waistTrend.has_data || waistTrend.change_cm <= T.WAIST_FLAT_BAND_CM;
  const waistTrendingDown = waistTrend.has_data && waistTrend.change_cm < -T.WAIST_FLAT_BAND_CM;
  const waistFlatBand = waistTrend.has_data && Math.abs(waistTrend.change_cm) < T.WAIST_FLAT_BAND_CM;
  const waistGoingUp = waistTrend.has_data && waistTrend.change_cm > T.WAIST_FLAT_BAND_CM;

  // 2. Review Needed (long window, deficit logged, but no movement OR conflict)
  if (windowReady && deficitOK) {
    const noMovement = weightFlat && (!waistTrend.has_data || waistFlatBand || waistGoingUp);
    const strongConflict = weightTrend.direction === 'down' && waistGoingUp;
    if (noMovement) {
      reasons.push('window 21+ วัน · มีขาดดุล · น้ำหนัก+เอวไม่ขยับ');
      return { status: 'review-needed', primary_signal: 'no-movement', reasons };
    }
    if (strongConflict) {
      reasons.push('น้ำหนักลง แต่เอวเพิ่มขึ้น');
      return { status: 'review-needed', primary_signal: 'conflict', reasons };
    }
  }

  // 3. Water Noise Likely (short window, weight spike or flat, recent training)
  if (windowDays < T.MIN_DAYS_FOR_CONFIRMED) {
    const spikeOrFlat = weightTrend.change_kg > 0 || weightFlat;
    if (spikeOrFlat && waistDownOrFlat && training.training_count >= 3) {
      reasons.push('window สั้น · มี training ในช่วงนี้ · เอวไม่เพิ่ม');
      return { status: 'water-noise-likely', primary_signal: 'water', reasons };
    }
  }

  // 4. Fat Loss Confirmed
  if (windowDays >= T.MIN_DAYS_FOR_CONFIRMED
      && meaningfulWeightDrop
      && meaningfulWeeklyDrop
      && waistDownOrFlat
      && deficitOK
      && predictedLoss.avg_deficit_per_day_kcal >= T.MIN_DEFICIT_FOR_CONFIRMED) {
    reasons.push('window พอ · น้ำหนักลง · เอวลด/ทรง · ขาดดุลคงเส้น');
    return { status: 'fat-loss-confirmed', primary_signal: 'fat-loss', reasons };
  }

  // 5. Possible Recomp — requires waist data
  if (waistTrend.has_data && waistTrendingDown
      && predictedLoss.has_data
      && predictedLoss.predicted_loss_kg - Math.max(0, -weightTrend.change_kg) >= T.RECOMP_GAP_THRESHOLD_KG
      && training.training_count >= T.RECOMP_MIN_TRAINING_COUNT
      && predictedLoss.avg_deficit_per_day_kcal >= T.MIN_DEFICIT_FOR_CONFIRMED * 0.7) {
    reasons.push('น้ำหนักลงช้ากว่าที่แคลคาด · เอวยังลด · มี training');
    return { status: 'possible-recomp', primary_signal: 'recomp-tentative', reasons };
  }

  // 6. Progress In Motion — fallback when SOME direction exists
  if (Math.abs(weightTrend.change_kg) >= 0.2
      || (waistTrend.has_data && Math.abs(waistTrend.change_cm) >= 0.5)) {
    reasons.push('ทิศทางเริ่มเห็น แต่ window/data ยังไม่พอ');
    return { status: 'progress-in-motion', primary_signal: 'in-motion', reasons };
  }

  // Defensive fallback
  reasons.push('สัญญาณไม่ชัด · window ยังต้องการเวลา');
  return { status: 'not-enough-data', primary_signal: 'unclear', reasons };
}

// Confidence with downgrade rules.
function getInsightConfidence(input, status) {
  const { weightTrend, waistTrend, predictedLoss, checkinSnap, windowDays } = input;
  let level;
  const highOK = windowDays >= 21
    && checkinSnap.checkin_count >= 2
    && waistTrend.has_data && waistTrend.data_points >= 2
    && weightTrend.data_points >= 5
    && predictedLoss.has_data && predictedLoss.days_logged >= 10;
  const mediumOK = windowDays >= 14
    && weightTrend.data_points >= 3
    && predictedLoss.has_data && predictedLoss.days_logged >= 7
    && (waistTrend.has_data || checkinSnap.checkin_count >= 1);
  if (highOK) level = 'high';
  else if (mediumOK) level = 'medium';
  else level = 'low';
  // Downgrades
  if (status === 'possible-recomp' && level === 'high') level = 'medium';
  if (!waistTrend.has_data && level !== 'low') level = level === 'high' ? 'medium' : 'low';
  if (checkinSnap.checkin_count === 1 && level !== 'low') level = level === 'high' ? 'medium' : 'low';
  if (status === 'not-enough-data') level = 'low';
  return level;
}

// v1.10.38 — T-013d.3: resolve a user-selected BPC range into a concrete window.
// rangeSpec = { preset: '7d'|'14d'|'30d'|'90d'|'all'|'custom', startDate?, endDate? }
// Returns { startDate, endDate, windowDays, label }. Defensive on bad input
// (start>end, missing dates, future end) — falls back to 30-day rolling window.
function resolveInsightWindow(rangeSpec, user) {
  const today = todayKey();
  const fallback = () => {
    const win = 30;
    return {
      startDate: dateToKey(addDays(keyToDate(today), -(win - 1))),
      endDate: today,
      windowDays: win,
      label: '30 วันล่าสุด'
    };
  };
  const spec = rangeSpec || { preset: '30d' };
  const presetDays = { '7d': 7, '14d': 14, '30d': 30, '90d': 90 };
  if (spec.preset in presetDays) {
    const win = presetDays[spec.preset];
    return {
      startDate: dateToKey(addDays(keyToDate(today), -(win - 1))),
      endDate: today,
      windowDays: win,
      label: `${win} วันล่าสุด`
    };
  }
  if (spec.preset === 'all') {
    // Earliest user data point: min(first weight · first waist · first check-in · first activity)
    const candidates = [];
    if (user?.weights && user.weights.length) candidates.push(user.weights.slice().sort((a,b)=>a.date.localeCompare(b.date))[0].date);
    if (user?.waist && user.waist.length) candidates.push(user.waist.slice().sort((a,b)=>a.date.localeCompare(b.date))[0].date);
    if (user?.checkIns && user.checkIns.length) candidates.push(user.checkIns.slice().sort((a,b)=>a.date.localeCompare(b.date))[0].date);
    if (user?.activities) {
      const actKeys = Object.keys(user.activities).filter(k => (user.activities[k] || []).length > 0).sort();
      if (actKeys.length) candidates.push(actKeys[0]);
    }
    if (candidates.length === 0) return fallback();
    const start = candidates.sort()[0];
    const win = daysBetween(start, today) + 1;
    return {
      startDate: start,
      endDate: today,
      windowDays: win,
      label: `ทั้งหมด (${formatDateTH(start)} – ${formatDateTH(today)})`
    };
  }
  if (spec.preset === 'custom') {
    if (!spec.startDate || !spec.endDate) return fallback();
    // Clamp end to today; auto-swap if start > end
    let s = spec.startDate;
    let e = spec.endDate > today ? today : spec.endDate;
    if (s > e) { const t = s; s = e; e = t; }
    const win = daysBetween(s, e) + 1;
    if (win < 1) return fallback();
    return {
      startDate: s,
      endDate: e,
      windowDays: win,
      label: `${formatDateTH(s)} – ${formatDateTH(e)}`
    };
  }
  return fallback();
}

// v1.10.38 — T-013d.3: short human label for an insight window.
function formatInsightWindowLabel(startDate, endDate) {
  if (!startDate || !endDate) return '';
  return `${formatDateTH(startDate)} – ${formatDateTH(endDate)}`;
}

// Top-level bundle for the renderer.
// v1.10.38 — T-013d.3: refactored to accept an options object with optional
// { startDate, endDate, windowDays }. Back-compat: legacy positional calls
// computeBodyProgressInsight(user, endDate, windowDays) still supported via
// option-object detection. No-args call still returns the 21-day default.
function computeBodyProgressInsight(user, ...args) {
  // Detect legacy positional call: (user, endDateString, windowDaysNumber)
  let opts;
  if (args.length > 0 && typeof args[0] === 'string') {
    opts = { endDate: args[0], windowDays: args[1] };
  } else {
    opts = args[0] || {};
  }
  // Resolve concrete window
  let end, win, startKey, label;
  if (opts.startDate && opts.endDate) {
    startKey = opts.startDate;
    end = opts.endDate;
    win = daysBetween(startKey, end) + 1;
    if (win < 1) win = 1;
    label = formatInsightWindowLabel(startKey, end);
  } else {
    end = opts.endDate || todayKey();
    win = opts.windowDays || INSIGHT_THRESHOLDS.DEFAULT_INSIGHT_WINDOW_DAYS;
    startKey = dateToKey(addDays(keyToDate(end), -(win - 1)));
    label = `${win} วันล่าสุด`;
  }
  const weightTrend = computeWeightTrend(user, end, win);
  const waistTrend = computeWaistTrend(user, end, win);
  const predictedLoss = computePredictedLossFromDeficit(user, win, end);
  const checkinSnap = computeCheckinSnapshot(user, win, end);
  const training = computeTrainingFrequency(user, win, end);
  const input = { weightTrend, waistTrend, predictedLoss, checkinSnap, training, windowDays: win };
  const { status, primary_signal, reasons } = classifyBodyProgressStatus(input);
  const confidence = getInsightConfidence(input, status);
  return {
    window_days: win, end_date: end,
    window_start_date: startKey,
    window_end_date: end,
    window_label: label,
    weightTrend, waistTrend, predictedLoss, checkinSnap, training,
    status, primary_signal, confidence, reasons
  };
}

// v1.10.30 — T-012: waist circumference tracking. Mirrors weight helpers.
// Schema: u.waist = [{ date: 'YYYY-MM-DD', waist_cm: 82 }, ...]
function setWaist(user, key, cm) {
  user.waist = user.waist || [];
  const existing = user.waist.find(x => x.date === key);
  if (existing) existing.waist_cm = cm;
  else user.waist.push({ date: key, waist_cm: cm });
  user.waist.sort((a, b) => a.date.localeCompare(b.date));
}
function removeWaist(user, key) {
  if (!user.waist) return;
  user.waist = user.waist.filter(x => x.date !== key);
}
function sortedWaist(user, days = null) {
  const all = (user?.waist || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (days == null) return all;
  const cutoff = dateToKey(addDays(new Date(), -days + 1));
  return all.filter(w => w.date >= cutoff);
}
function latestWaist(user) {
  const all = sortedWaist(user);
  return all.length ? all[all.length - 1] : null;
}
function waistChangeOver(user, days) {
  const recent = sortedWaist(user, days);
  if (recent.length < 2) return null;
  return recent[recent.length - 1].waist_cm - recent[0].waist_cm;
}
function waistTrend(user, days = 14) {
  const recent = sortedWaist(user, days);
  if (recent.length < 2) return null;
  const { slope } = linearRegression(recent, 'waist_cm');
  return slope;
}
// waist:height ratio — body-composition signal (better than weight alone)
function waistHeightRatio(u, waist_cm) {
  const h = Number(u?.height) || 0;
  if (!h || !waist_cm) return null;
  return waist_cm / h;
}
// Returns { color: 'green'|'amber'|'red', text: string, ratio: number } or null
function waistHealthFlag(u, waist_cm) {
  const ratio = waistHeightRatio(u, waist_cm);
  if (ratio == null) return null;
  let color, text;
  if (ratio < 0.4) { color = 'amber'; text = '⚠️ ต่ำกว่า 0.4 — เอวเล็กผิดปกติ ปรึกษาแพทย์'; }
  else if (ratio < 0.5) { color = 'green'; text = '✅ สุขภาพดี (waist:height < 0.5)'; }
  else if (ratio < 0.55) { color = 'amber'; text = '⚠️ ความเสี่ยงเพิ่ม — ดูแลไขมันรอบเอว'; }
  else if (ratio < 0.6) { color = 'red'; text = '⚠️ ความเสี่ยงสูง — visceral fat สะสม'; }
  else { color = 'red'; text = '🔴 ความเสี่ยงสูงมาก — ปรึกษาแพทย์'; }
  // Asian gender-specific cutoff hint (secondary)
  let asianHint = '';
  if (u.gender === 'male' && waist_cm > 90) asianHint = ' · WHO Asian male > 90cm = abdominal obesity';
  else if (u.gender === 'female' && waist_cm > 80) asianHint = ' · WHO Asian female > 80cm = abdominal obesity';
  return { color, text: text + asianHint, ratio };
}

/* ========== STREAKS ========== */
function defaultStreakState() {
  return {
    freezeTokens: { available: 1, max: 1, lastReplenishDate: todayKey() },
    repairs: { monthYear: todayKey().slice(0, 7), used: 0, max: 2 },
    freezes: { logging: [], weight: [], inTarget: [], protein: [] },
    bests: { logging: 0, weight: 0, inTarget: 0, protein: 0 },
    celebrated: []
  };
}

function ensureStreakState(user) {
  if (!user) return null;
  if (!user.streakState) user.streakState = defaultStreakState();
  const ss = user.streakState;
  if (!ss.freezes) ss.freezes = { logging: [], weight: [], inTarget: [], protein: [] };
  ['logging','weight','inTarget','protein'].forEach(k => { if (!ss.freezes[k]) ss.freezes[k] = []; });
  if (!ss.bests) ss.bests = { logging: 0, weight: 0, inTarget: 0, protein: 0 };
  if (!ss.celebrated) ss.celebrated = [];
  if (!ss.freezeTokens) ss.freezeTokens = { available: 1, max: 1, lastReplenishDate: todayKey() };
  if (!ss.repairs) ss.repairs = { monthYear: todayKey().slice(0, 7), used: 0, max: 2 };
  // Reset repair month
  const m = todayKey().slice(0, 7);
  if (ss.repairs.monthYear !== m) ss.repairs = { monthYear: m, used: 0, max: 2 };
  return ss;
}

function replenishTokensIfNeeded(user) {
  const ss = ensureStreakState(user);
  if (!ss) return;
  const today = new Date();
  const day = today.getDay(); // 0=Sun, 1=Mon
  const daysSinceMon = (day + 6) % 7;
  const thisMon = new Date(today);
  thisMon.setHours(0, 0, 0, 0);
  thisMon.setDate(today.getDate() - daysSinceMon);
  const thisMonKey = dateToKey(thisMon);
  if ((ss.freezeTokens.lastReplenishDate || '0000-00-00') < thisMonKey) {
    ss.freezeTokens.available = ss.freezeTokens.max || 1;
    ss.freezeTokens.lastReplenishDate = thisMonKey;
  }
}

function activeDatesForStreak(user, type) {
  const out = new Set();
  const userLogs = state.logs[user.id] || {};
  if (type === 'logging') {
    Object.keys(userLogs).forEach(d => { if ((userLogs[d] || []).length > 0) out.add(d); });
  } else if (type === 'weight') {
    (user.weights || []).forEach(w => out.add(w.date));
  } else if (type === 'inTarget' || type === 'protein') {
    const protT = effectiveProteinTarget(user.id);
    const tdee = calcTDEE(user);
    const incExercise = activityIncludesExercise(user);
    const goalAdj = effectiveGoalAdjust(user);
    Object.keys(userLogs).forEach(d => {
      const entries = userLogs[d] || [];
      if (entries.length < 2) return;
      const t = sumEntries(entries);
      if (type === 'inTarget') {
        // Goal-aware: did the day's energy delta land within ~250 kcal of the user's goal?
        const exerciseBurn = incExercise ? 0 : sumActivitiesBurn(user.id, d);
        const energyDelta = t.calories - (tdee + exerciseBurn);
        const goalDelta = energyDelta - goalAdj;
        if (Math.abs(goalDelta) < 250) out.add(d);
      } else {
        if (protT > 0 && t.protein_g >= protT * 0.85) out.add(d);
      }
    });
  }
  return out;
}

function streakOfSet(activeSet, frozenList, todayKeyStr) {
  const all = new Set([...activeSet, ...(frozenList || [])]);
  const yest = dateToKey(addDays(keyToDate(todayKeyStr), -1));
  let cursor;
  if (all.has(todayKeyStr)) cursor = todayKeyStr;
  else if (all.has(yest)) cursor = yest;
  else return 0;
  let count = 0;
  while (all.has(cursor)) {
    count++;
    cursor = dateToKey(addDays(keyToDate(cursor), -1));
  }
  return count;
}

function bestStreakOfSet(allSet) {
  const dates = [...allSet].sort();
  let best = 0, cur = 0, prev = null;
  for (const d of dates) {
    if (prev && daysBetween(prev, d) === 1) cur++;
    else cur = 1;
    if (cur > best) best = cur;
    prev = d;
  }
  return best;
}

function getStreakStatus(user, type) {
  const ss = ensureStreakState(user);
  const active = activeDatesForStreak(user, type);
  const frozen = ss.freezes[type] || [];
  const allSet = new Set([...active, ...frozen]);
  const today = todayKey();
  const current = streakOfSet(active, frozen, today);
  const computedBest = bestStreakOfSet(allSet);
  const persistedBest = ss.bests[type] || 0;
  const best = Math.max(computedBest, persistedBest, current);
  if (best > persistedBest) ss.bests[type] = best;
  return { current, best, doneToday: active.has(today) };
}

function checkAndCelebrateMilestones(user, prevSnapshot) {
  const ss = ensureStreakState(user);
  let toShow = null;
  ['logging','weight','inTarget','protein'].forEach(type => {
    const cur = getStreakStatus(user, type).current;
    const prev = prevSnapshot[type] || 0;
    if (cur <= prev) return;
    const ms = getMilestoneInfo(cur);
    if (!ms) return;
    const key = `${type}-${cur}`;
    if (ss.celebrated.includes(key)) return;
    ss.celebrated.push(key);
    if (!toShow) toShow = { type, days: cur, label: ms.label, msg: ms.msg };
  });
  if (toShow) showMilestoneModal(toShow);
}

function streaksSnapshot(user) {
  return {
    logging: getStreakStatus(user, 'logging').current,
    weight: getStreakStatus(user, 'weight').current,
    inTarget: getStreakStatus(user, 'inTarget').current,
    protein: getStreakStatus(user, 'protein').current
  };
}

function autoFreezeIfPossible(user) {
  const ss = ensureStreakState(user);
  if (ss.freezeTokens.available < 1) return false;
  const today = todayKey();
  const yest = dateToKey(addDays(new Date(), -1));
  const userLogs = state.logs[user.id] || {};
  const yestHasLog = (userLogs[yest] || []).length > 0;
  if (yestHasLog) return false;
  const dayBefore = dateToKey(addDays(new Date(), -2));
  const dayBeforeHasLog = (userLogs[dayBefore] || []).length > 0;
  const freezes = ss.freezes.logging || [];
  if (!dayBeforeHasLog && !freezes.includes(dayBefore)) return false;
  freezes.push(yest);
  ss.freezes.logging = freezes;
  ss.freezeTokens.available -= 1;
  return true;
}

function showMilestoneModal(info) {
  if (document.getElementById('milestone-overlay')) return;
  const lbl = STREAK_LABELS[info.type];
  const el = document.createElement('div');
  el.id = 'milestone-overlay';
  el.className = 'milestone-overlay';
  el.dataset.act = 'dismiss-milestone';
  el.innerHTML = `
    <div class="milestone-card">
      <div class="em">🎉</div>
      <div class="ml-label">${h(info.label)}</div>
      <div class="ml-type">${lbl.emoji} ${h(lbl.name)} Streak</div>
      <div class="ml-days">${info.days} วันติดต่อกัน</div>
      <div class="ml-msg">"${h(info.msg)}"</div>
      <button class="btn block" data-act="dismiss-milestone">ขอบคุณ! 🙏</button>
    </div>
  `;
  document.body.appendChild(el);
}

/* ========== AGGREGATION ========== */
function dayTotals(userId, dateKey) {
  const entries = ((state.logs[userId] || {})[dateKey] || []);
  return { entries, totals: sumEntries(entries) };
}
function weekAggregate(userId, endKey) {
  const u = state.users.find(x => x.id === userId);
  const tdee = u ? calcTDEE(u) : 2000;
  const incExercise = u ? activityIncludesExercise(u) : false;
  const goalAdj = u ? effectiveGoalAdjust(u) : 0;
  const keys = lastNDaysKeys(7, endKey);
  const days = keys.map(k => {
    const { entries, totals } = dayTotals(userId, k);
    const exerciseBurn = incExercise ? 0 : sumActivitiesBurn(userId, k);
    const totalBurn = tdee + exerciseBurn;
    const energyDelta = totals.calories - totalBurn;     // − = deficit, + = surplus
    const goalDelta = energyDelta - goalAdj;             // 0 = on goal
    return { key: k, entries, totals, logged: entries.length > 0, exerciseBurn, totalBurn, energyDelta, goalDelta };
  });
  const loggedDays = days.filter(d => d.logged);
  const N = loggedDays.length;
  const avg = N === 0
    ? { calories: 0, protein_g: 0, carbs_g: 0, fat_g: 0, sugar_g: 0, exerciseBurn: 0, energyDelta: 0, goalDelta: 0 }
    : {
        calories: loggedDays.reduce((s, d) => s + d.totals.calories, 0) / N,
        protein_g: loggedDays.reduce((s, d) => s + d.totals.protein_g, 0) / N,
        carbs_g: loggedDays.reduce((s, d) => s + d.totals.carbs_g, 0) / N,
        fat_g: loggedDays.reduce((s, d) => s + d.totals.fat_g, 0) / N,
        sugar_g: loggedDays.reduce((s, d) => s + d.totals.sugar_g, 0) / N,

}
function monthKeys(year, monthIdx) {
  const first = new Date(year, monthIdx, 1);

function monthAggregate(userId, year, monthIdx) {

    const goalDelta = energyDelta - goalAdj;
    return { key: k, entries, totals, logged: entries.length > 0, exerciseBurn, totalBurn, energyDelta, goalDelta };
  });
  const loggedDays = days.filter(d => d.logged);
  const N = loggedDays.length;
  const avg = N === 0
    ? { calories: 0, protein_g: 0, carbs_g: 0, fat_g: 0, sugar_g: 0, exerciseBurn: 0, energyDelta: 0, goalDelta: 0 }
    : {
        calories: loggedDays.reduce((s, d) => s + d.totals.calories, 0) / N,

  let streak = 0;

/* ========== SVG CHART (weight line) ========== */
// v1.10.30 — T-012: generalized with optional opts (valueKey + ariaLabel +
// colors). Existing callers (Reports weight, Weight Log weight) pass nothing
// → defaults preserve identical visual output.
// v1.10.43 — T-017: added optional chartId + selectedIdx for tap-to-read.
// Backward-compatible — call sites that don't pass chartId render identically to before.
function svgLineChart(series, avgSeries, w = 320, h = 140, opts) {
  if (!series.length) {
    return `<svg viewBox="0 0 ${w} ${h}"><text x="${w/2}" y="${h/2}" text-anchor="middle" fill="#aaa" font-size="12">ไม่มีข้อมูล</text></svg>`;
  }
  const valueKey = (opts && opts.valueKey) || 'weight_kg';
  const ariaLabel = (opts && opts.ariaLabel) || 'กราฟน้ำหนัก';
  const dotColor = (opts && opts.dotColor) || '#d97706';
  const lineColor = (opts && opts.lineColor) || '#fde7c8';
  const avgColor = (opts && opts.avgColor) || '#b35d00';
  const chartId = (opts && opts.chartId) || '';        // v1.10.43 — T-017
  const selectedIdx = opts && opts.selectedIdx;        // v1.10.43 — T-017
  const gapDashDays = opts && opts.gapDashDays;         // v1.10.49 — T-022b: opt-in (body-comp only)
  const padL = 32, padR = 8, padT = 10, padB = 22;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const all = series.concat(avgSeries || []);
  const values = all.map(p => p[valueKey]);
  let minV = Math.min(...values);
  let maxV = Math.max(...values);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  else { minV = Math.floor(minV - 0.5); maxV = Math.ceil(maxV + 0.5); }
  const firstDate = keyToDate(series[0].date);
  const lastDate = keyToDate(series[series.length - 1].date);
  const spanDays = Math.max(1, daysBetween(series[0].date, series[series.length - 1].date));
  const xFor = (pt) => padL + (daysBetween(series[0].date, pt.date) / spanDays) * innerW;
  const yFor = (v) => padT + (1 - (v - minV) / (maxV - minV)) * innerH;

  const path = (arr) => arr.map((p, i) => `${i === 0 ? 'M' : 'L'}${xFor(p).toFixed(1)},${yFor(p[valueKey]).toFixed(1)}`).join(' ');
  const gridY = [minV, (minV + maxV) / 2, maxV];
  const grid = gridY.map(v => `<line x1="${padL}" y1="${yFor(v)}" x2="${w - padR}" y2="${yFor(v)}" stroke="#eee" stroke-width="1"/><text x="${padL - 4}" y="${yFor(v) + 4}" text-anchor="end" fill="#999" font-size="10">${v.toFixed(1)}</text>`).join('');
  // v1.10.43 — T-017: highlight selected dot with ring + larger radius (matches T-010 pattern)
  const dots = series.map((p, i) => {
    const isSel = selectedIdx === i;
    const r = isSel ? 4.8 : 2.8;
    const ring = isSel ? `<circle cx="${xFor(p).toFixed(1)}" cy="${yFor(p[valueKey]).toFixed(1)}" r="6.5" fill="none" stroke="#1f2937" stroke-width="1.5"/>` : '';
    return `${ring}<circle cx="${xFor(p).toFixed(1)}" cy="${yFor(p[valueKey]).toFixed(1)}" r="${r}" fill="${dotColor}"/>`;
  }).join('');
  // v1.10.49 — T-022b: when gapDashDays is set (body-comp charts only), segments longer than that
  // many days render dashed + faded so a gap doesn't imply continuous data. Default (unset) path is
  // byte-identical to the original — existing weight/waist/cal/bal/prot charts are unaffected.
  const segPaths = (arr, color, width) => {
    if (!arr || arr.length < 2) return '';
    let solidD = '', dashD = '';
    for (let i = 1; i < arr.length; i++) {
      const a = arr[i - 1], b = arr[i];
      const seg = `M${xFor(a).toFixed(1)},${yFor(a[valueKey]).toFixed(1)} L${xFor(b).toFixed(1)},${yFor(b[valueKey]).toFixed(1)} `;
      if (daysBetween(a.date, b.date) > gapDashDays) dashD += seg; else solidD += seg;
    }
    const s = solidD ? `<path d="${solidD.trim()}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>` : '';
    const g = dashD ? `<path d="${dashD.trim()}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,3" opacity="0.5"/>` : '';
    return s + g;
  };
  let avgPath, dataPath;
  if (gapDashDays) {
    avgPath = (avgSeries && avgSeries.length > 1) ? segPaths(avgSeries, avgColor, 2) : '';
    dataPath = segPaths(series, lineColor, 1.5);
  } else {
    avgPath = (avgSeries && avgSeries.length > 1)
      ? `<path d="${path(avgSeries)}" fill="none" stroke="${avgColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
      : '';
    dataPath = `<path d="${path(series)}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linecap="round"/>`;
  }
  // v1.10.43 — T-017: per-point hit-areas for tap-to-read (only when chartId provided)
  let hitAreas = '';
  if (chartId) {
    hitAreas = series.map((p, i) => {
      const cx = xFor(p);
      const cy = yFor(p[valueKey]);
      // Generous tap target around each point (24px wide × full chart height for finger-friendly tap)
      return `<rect data-act="show-chart-point" data-chart-id="${chartId}" data-day-idx="${i}" x="${(cx - 12).toFixed(1)}" y="${padT}" width="24" height="${innerH}" fill="transparent" style="cursor:pointer"/>`;
    }).join('');
  }
  const startLbl = `${firstDate.getDate()}/${firstDate.getMonth() + 1}`;
  const endLbl = `${lastDate.getDate()}/${lastDate.getMonth() + 1}`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${ariaLabel}">
    ${grid}
    ${dataPath}
    ${avgPath}
    ${dots}
    ${hitAreas}
    <text x="${padL}" y="${h - 6}" fill="#999" font-size="10">${startLbl}</text>
    <text x="${w - padR}" y="${h - 6}" text-anchor="end" fill="#999" font-size="10">${endLbl}</text>
  </svg>`;
}

// v1.10.27 — generic daily line chart (T-009). For calorie trends etc.
// Renders gaps for unlogged days (line breaks, not zero-drag).
// v1.10.28 — T-010: target rendered as per-day path (not flat average) so
// the burn line actually varies with logged exercise. Adds hit-area + selection
// for tap-to-read detail.
// opts: { valueFn, targetFn?, color, targetColor, label, w, h, chartId?, selectedIdx? }
function svgDailyLineChart(days, opts) {
  const valueFn = opts.valueFn;
  const targetFn = opts.targetFn;
  const color = opts.color || '#d97706';
  const targetColor = opts.targetColor || '#9ca3af';
  const label = opts.label || '';
  const w = opts.w || 320;
  const ch = opts.h || 140;
  const chartId = opts.chartId || '';
  const selectedIdx = opts.selectedIdx;
  const padL = 38, padR = 8, padT = 10, padB = 22;
  const innerW = w - padL - padR;
  const innerH = ch - padT - padB;
  const points = days.map((d, i) => ({
    i,
    value: d.logged ? valueFn(d) : null,
    target: targetFn ? targetFn(d) : null
  }));
  const validPoints = points.filter(p => p.value != null);
  if (validPoints.length === 0) {
    return `<svg viewBox="0 0 ${w} ${ch}"><text x="${w/2}" y="${ch/2}" text-anchor="middle" fill="#aaa" font-size="12">ไม่มีข้อมูลในช่วงนี้</text></svg>`;
  }
  const allValues = validPoints.map(p => p.value);
  if (targetFn) points.forEach(p => p.target != null && allValues.push(p.target));
  let minV = Math.min(...allValues);
  let maxV = Math.max(...allValues);
  if (minV === maxV) { minV -= 100; maxV += 100; }
  const rng = maxV - minV;
  maxV = maxV + rng * 0.1;
  minV = Math.max(0, minV - rng * 0.05);
  const step = rng > 1000 ? 500 : 100;
  minV = Math.floor(minV / step) * step;
  maxV = Math.ceil(maxV / step) * step;
  const xFor = (i) => padL + (i / Math.max(1, days.length - 1)) * innerW;
  const yFor = (v) => padT + (1 - (v - minV) / (maxV - minV)) * innerH;
  const gridY = [minV, (minV + maxV) / 2, maxV];
  const grid = gridY.map(v => `<line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w - padR}" y2="${yFor(v).toFixed(1)}" stroke="#eee" stroke-width="1"/><text x="${padL - 4}" y="${(yFor(v) + 4).toFixed(1)}" text-anchor="end" fill="#999" font-size="10">${Math.round(v)}</text>`).join('');
  // v1.10.28 — target rendered as per-day path (variable line). Each segment
  // breaks on unlogged days, like the data line. This reflects actual exercise
  // logged per day instead of a misleading flat average.
  let targetPath = '';
  if (targetFn) {
    const tParts = [];
    let inT = false;
    points.forEach(p => {
      if (p.target != null) {
        tParts.push(`${inT ? 'L' : 'M'}${xFor(p.i).toFixed(1)},${yFor(p.target).toFixed(1)}`);
        inT = true;
      } else { inT = false; }
    });
    if (tParts.length) {
      targetPath = `<path d="${tParts.join(' ')}" fill="none" stroke="${targetColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,3"/>`;
    }
  }
  // Data path with gaps for unlogged days
  const parts = [];
  let inSeg = false;
  points.forEach(p => {
    if (p.value != null) {
      parts.push(`${inSeg ? 'L' : 'M'}${xFor(p.i).toFixed(1)},${yFor(p.value).toFixed(1)}`);
      inSeg = true;
    } else { inSeg = false; }
  });
  const dataPath = `<path d="${parts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  const dots = validPoints.map(p => {
    const isSel = selectedIdx === p.i;
    const r = isSel ? 4.5 : 2.4;
    const ring = isSel ? `<circle cx="${xFor(p.i).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="6" fill="none" stroke="#1f2937" stroke-width="1.5"/>` : '';
    return `${ring}<circle cx="${xFor(p.i).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="${r}" fill="${color}"/>`;
  }).join('');
  // v1.10.28 — column-wide invisible hit-area per day for tap-to-read
  let hitAreas = '';
  if (chartId) {
    const colW = innerW / days.length;
    hitAreas = days.map((d, i) => {
      const x = padL + (i - 0.5) * (innerW / Math.max(1, days.length - 1));
      return `<rect data-act="show-chart-point" data-chart-id="${chartId}" data-day-idx="${i}" x="${x.toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${innerH}" fill="transparent" style="cursor:pointer"/>`;
    }).join('');
  }
  const sD = keyToDate(days[0].key);
  const eD = keyToDate(days[days.length - 1].key);
  return `<svg viewBox="0 0 ${w} ${ch}" role="img" aria-label="${label}">
    ${grid}
    ${targetPath}
    ${dataPath}
    ${dots}
    ${hitAreas}
    <text x="${padL}" y="${ch - 6}" fill="#999" font-size="10">${sD.getDate()}/${sD.getMonth() + 1}</text>
    <text x="${w - padR}" y="${ch - 6}" text-anchor="end" fill="#999" font-size="10">${eD.getDate()}/${eD.getMonth() + 1}</text>
  </svg>`;
}

// v1.10.27 — generic daily bar chart (T-009). Supports negative values (deficit
// bars below zero-line). For energy-balance + protein-vs-target visualizations.
// v1.10.28 — T-010: adds hit-area + selection support (chartId + selectedIdx).
// opts: { valueFn, colorFn(v)→color, targetLine?, zeroLine?, label, w, h, chartId?, selectedIdx? }
function svgDailyBarChart(days, opts) {
  const valueFn = opts.valueFn;
  const colorFn = opts.colorFn || (() => '#d97706');
  const targetLine = opts.targetLine;
  const zeroLine = !!opts.zeroLine;
  const label = opts.label || '';
  const w = opts.w || 320;
  const ch = opts.h || 140;
  const chartId = opts.chartId || '';
  const selectedIdx = opts.selectedIdx;
  const padL = 38, padR = 8, padT = 10, padB = 22;
  const innerW = w - padL - padR;
  const innerH = ch - padT - padB;
  const points = days.map((d, i) => ({ i, value: d.logged ? valueFn(d) : null }));
  const validPoints = points.filter(p => p.value != null);
  if (validPoints.length === 0) {
    return `<svg viewBox="0 0 ${w} ${ch}"><text x="${w/2}" y="${ch/2}" text-anchor="middle" fill="#aaa" font-size="12">ไม่มีข้อมูลในช่วงนี้</text></svg>`;
  }
  const allValues = validPoints.map(p => p.value);
  if (targetLine != null) allValues.push(targetLine);
  let minV = Math.min(...allValues);
  let maxV = Math.max(...allValues);
  if (zeroLine) { minV = Math.min(minV, 0); maxV = Math.max(maxV, 0); }
  if (minV === maxV) { minV -= 100; maxV += 100; }
  const rng = maxV - minV;
  maxV = maxV + rng * 0.1;
  if (minV < 0) minV = minV - rng * 0.05;
  const step = rng > 1000 ? 500 : rng > 200 ? 100 : 50;
  minV = Math.floor(minV / step) * step;
  maxV = Math.ceil(maxV / step) * step;
  const barW = Math.max(2, (innerW / days.length) * 0.7);
  const xFor = (i) => padL + ((i + 0.5) / days.length) * innerW;
  const yFor = (v) => padT + (1 - (v - minV) / (maxV - minV)) * innerH;
  const yZero = yFor(0);
  const gridY = [minV, (minV + maxV) / 2, maxV];
  const grid = gridY.map(v => `<line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w - padR}" y2="${yFor(v).toFixed(1)}" stroke="#eee" stroke-width="1"/><text x="${padL - 4}" y="${(yFor(v) + 4).toFixed(1)}" text-anchor="end" fill="#999" font-size="10">${Math.round(v)}</text>`).join('');
  let zeroLineHtml = '';
  if (zeroLine && minV < 0 && maxV > 0) {
    zeroLineHtml = `<line x1="${padL}" y1="${yZero.toFixed(1)}" x2="${w - padR}" y2="${yZero.toFixed(1)}" stroke="#666" stroke-width="1"/>`;
  }
  let tLineHtml = '';
  if (targetLine != null) {
    const yT = yFor(targetLine);
    tLineHtml = `<line x1="${padL}" y1="${yT.toFixed(1)}" x2="${w - padR}" y2="${yT.toFixed(1)}" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  }
  const bars = validPoints.map(p => {
    const cx = xFor(p.i);
    const bx = cx - barW / 2;
    const yVal = yFor(p.value);
    let by, bh;
    if (p.value >= 0) {
      by = yVal;
      bh = (zeroLine && minV < 0 ? yZero : yFor(minV)) - yVal;
    } else {
      by = yZero;
      bh = yVal - yZero;
    }
    const isSel = selectedIdx === p.i;
    const strokeAttr = isSel ? ' stroke="#1f2937" stroke-width="2"' : '';
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0.5, bh).toFixed(1)}" fill="${colorFn(p.value)}" rx="1"${strokeAttr}/>`;
  }).join('');
  // v1.10.28 — hit-area per day (full chart height) for tap-to-read
  let hitAreas = '';
  if (chartId) {
    const colW = innerW / days.length;
    hitAreas = days.map((d, i) => {
      const hx = padL + i * colW;
      return `<rect data-act="show-chart-point" data-chart-id="${chartId}" data-day-idx="${i}" x="${hx.toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${innerH}" fill="transparent" style="cursor:pointer"/>`;
    }).join('');
  }
  const sD = keyToDate(days[0].key);
  const eD = keyToDate(days[days.length - 1].key);
  return `<svg viewBox="0 0 ${w} ${ch}" role="img" aria-label="${label}">
    ${grid}
    ${bars}
    ${zeroLineHtml}
    ${tLineHtml}
    ${hitAreas}
    <text x="${padL}" y="${ch - 6}" fill="#999" font-size="10">${sD.getDate()}/${sD.getMonth() + 1}</text>
    <text x="${w - padR}" y="${ch - 6}" text-anchor="end" fill="#999" font-size="10">${eD.getDate()}/${eD.getMonth() + 1}</text>
  </svg>`;
}

/* ========== BACKUP v2 + RESTORE (v1.10.54 — T-026a) ========== */
// Spec: docs/specs/T-026-money-tracking.md §5.8
// ไฟล์สำรองเดิมทุกเวอร์ชัน (v1.0.0 → v1.10.53) ใช้ซองไฟล์แบบเดียวกัน เพราะโค้ดส่งออกไม่เคยเปลี่ยน
// สิ่งที่ต่างคือรูปข้อมูลข้างใน ซึ่งเป็นงานของ migrateData() ตอนเปิดแอปอยู่แล้ว
// การกู้คืนจึงไม่ migrate เอง: ตรวจ → เขียน → โหลดหน้าใหม่ผ่านเส้นทางเปิดแอปปกติ

const DATE_KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
function isPlainObject(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
function isRealDateKey(s) {
  if (typeof s !== 'string' || !DATE_KEY_RE.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}
function formatTsThai(ts) {
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${formatDateTH(dateToKey(d))} ${hh}:${mi}`;
}

// ---------- ส่งออก ----------
// moneyRaw มาจาก moneyReadRaw() · ข้อมูลเงินอ่านไม่ได้ = throw ให้ผู้เรียกแจ้ง — ห้ามส่งออกไฟล์ที่ขาดข้อมูลเงินแบบเงียบ ๆ
function buildBackupObject(moneyRaw) {
  const money = moneyRaw ? JSON.parse(moneyRaw) : null;
  return {
    format: BACKUP_FORMAT,
    formatVersion: BACKUP_FORMAT_VERSION,
    appVersion: VERSION,
    exportedAt: new Date().toISOString(),
    health: {
      users: state.users,
      currentUserId: state.currentUserId,
      customMeals: state.customMeals,
      favorites: state.favorites,
      logs: state.logs,
      dailyTargets: state.dailyTargets,
      bpcRange: state.bpcRange
    },
    money
  };
}

// ---------- อ่านและตรวจไฟล์ (pure — ไม่แตะ storage) ----------
function validateHealthSection(hs) {
  if (!isPlainObject(hs)) return 'ไม่พบข้อมูลสุขภาพในไฟล์';
  if (!Array.isArray(hs.users) || hs.users.length === 0) return 'ไฟล์นี้ไม่มีโปรไฟล์ — ไม่นำเข้า เพื่อป้องกันข้อมูลในเครื่องหาย';
  if (hs.users.length > MAX_USERS) return `ไฟล์นี้มี ${hs.users.length} โปรไฟล์ เกินที่แอปรองรับ (${MAX_USERS})`;
  const ids = new Set();
  for (const u of hs.users) {
    if (!isPlainObject(u) || typeof u.id !== 'string' || !u.id) return 'โปรไฟล์ในไฟล์ไม่มี id ที่ถูกต้อง';
    if (ids.has(u.id)) return 'ไฟล์นี้มี id โปรไฟล์ซ้ำกัน';
    ids.add(u.id);
    if (typeof u.name !== 'string') return 'โปรไฟล์ในไฟล์ไม่มีชื่อ';
    for (const k of ['weights', 'waist', 'checkIns', 'scannedProducts']) {
      if (u[k] !== undefined && !Array.isArray(u[k])) return `ข้อมูล ${k} ของโปรไฟล์ "${u.name}" ผิดรูปแบบ`;
    }
  }
  if (!isPlainObject(hs.logs)) return 'ข้อมูลบันทึกอาหารในไฟล์ผิดรูปแบบ';
  for (const uid of Object.keys(hs.logs)) {
    const byDate = hs.logs[uid];
    if (!isPlainObject(byDate)) return 'ข้อมูลบันทึกอาหารในไฟล์ผิดรูปแบบ';
    for (const d of Object.keys(byDate)) {
      if (!isRealDateKey(d)) return `วันที่ในบันทึกอาหารผิดรูปแบบ (${d})`;
      if (!Array.isArray(byDate[d])) return `บันทึกอาหารวันที่ ${d} ผิดรูปแบบ`;
      for (const e of byDate[d]) if (!isPlainObject(e)) return `รายการอาหารวันที่ ${d} ผิดรูปแบบ`;
    }
  }
  for (const k of ['customMeals', 'favorites']) {
    if (hs[k] !== undefined && hs[k] !== null && !Array.isArray(hs[k])) return `ข้อมูล ${k} ในไฟล์ผิดรูปแบบ`;
  }
  if (hs.dailyTargets !== undefined && hs.dailyTargets !== null && !isPlainObject(hs.dailyTargets)) return 'ข้อมูลเป้าหมายรายวันในไฟล์ผิดรูปแบบ';
  return null;
}
function validateMoneySection(m) {
  if (m === null || m === undefined) return null;
  if (!isPlainObject(m)) return 'ข้อมูลเงินในไฟล์ผิดรูปแบบ';
  if (typeof m.schemaVersion !== 'number') return 'ข้อมูลเงินในไฟล์ไม่มีเวอร์ชัน';
  if (m.schemaVersion > MONEY_SCHEMA_VERSION_SUPPORTED) return 'ข้อมูลเงินในไฟล์มาจากแอปเวอร์ชันใหม่กว่า — อัปเดตแอปก่อนนำเข้า';
  if (!isPlainObject(m.byUser)) return 'ข้อมูลเงินในไฟล์ผิดรูปแบบ';
  // v1.10.55 — T-026b: ตรวจกติกาเงินทั้งชุดของทุกโปรไฟล์ (ใช้ทั้งตอนนำเข้าไฟล์และก่อนบันทึกทุกครั้ง)
  for (const uid of Object.keys(m.byUser)) { const err = moneyValidateUser(m.byUser[uid]); if (err) return err; }
  return null;
}
// รูปเดียวกับที่ persist() เขียน (ลำดับ key เดียวกัน) — bpcRange ใส่เมื่อไฟล์มีเท่านั้น
function normalizeHealthSection(hs) {
  const users = hs.users;
  const out = {
    users,
    currentUserId: users.some(u => u.id === hs.currentUserId) ? hs.currentUserId : users[0].id,
    customMeals: Array.isArray(hs.customMeals) ? hs.customMeals : [],
    favorites: Array.isArray(hs.favorites) ? hs.favorites : [],
    logs: hs.logs,
    dailyTargets: isPlainObject(hs.dailyTargets) ? hs.dailyTargets : {}
  };
  if (isPlainObject(hs.bpcRange)) out.bpcRange = hs.bpcRange;
  return out;
}
function summarizeData(hs, money) {
  const users = (hs && Array.isArray(hs.users)) ? hs.users : [];
  const logs = (hs && isPlainObject(hs.logs)) ? hs.logs : {};
  const byUser = (money && isPlainObject(money.byUser)) ? money.byUser : {};
  const profiles = users.map(u => {
    const byDate = isPlainObject(logs[u.id]) ? logs[u.id] : {};
    const days = Object.keys(byDate).filter(d => Array.isArray(byDate[d]) && byDate[d].length > 0).sort();
    const mu = byUser[u.id];
    return {
      id: u.id,
      name: u.name,
      foodDays: days.length,
      foodEntries: days.reduce((n, d) => n + byDate[d].length, 0),
      lastFoodDate: days.length ? days[days.length - 1] : null,
      weights: Array.isArray(u.weights) ? u.weights.length : 0,
      moneyTxns: mu && Array.isArray(mu.txns) ? mu.txns.length : 0,
      debts: mu && Array.isArray(mu.debts) ? mu.debts.length : 0
    };
  });
  const sum = k => profiles.reduce((n, p) => n + p[k], 0);
  return {
    profiles,
    foodDays: sum('foodDays'), foodEntries: sum('foodEntries'), weights: sum('weights'),
    moneyTxns: sum('moneyTxns'), debts: sum('debts'),
    hasMoney: !!money
  };
}
function parseBackupText(text, byteLength) {
  const fail = error => ({ ok: false, error });
  if (byteLength > BACKUP_MAX_BYTES) return fail('ไฟล์ใหญ่เกิน 20 MB — ไม่น่าใช่ไฟล์สำรองของ PraCaL');
  if (typeof text !== 'string' || !text.trim()) return fail('ไฟล์ว่างเปล่า');
  let obj;
  try { obj = JSON.parse(text.replace(/^﻿/, '')); }
  catch { return fail('อ่านไฟล์ไม่ได้ — ไฟล์อาจเสีย หรือไม่ใช่ไฟล์สำรองของ PraCaL'); }
  if (!isPlainObject(obj)) return fail('ไม่ใช่ไฟล์สำรองของ PraCaL');
  let kind, hs, money = null, meta;
  if (obj.format !== undefined) {
    if (obj.format !== BACKUP_FORMAT) return fail('ไม่ใช่ไฟล์สำรองของ PraCaL');
    if (!Number.isInteger(obj.formatVersion) || obj.formatVersion < 2) return fail('รูปแบบไฟล์สำรองไม่ถูกต้อง');
    if (obj.formatVersion > BACKUP_FORMAT_VERSION) return fail('ไฟล์นี้มาจาก PraCaL เวอร์ชันใหม่กว่า — อัปเดตแอปก่อนนำเข้า');
    kind = 'v2';
    hs = obj.health;
    money = obj.money === undefined ? null : obj.money;
    meta = { appVersion: obj.appVersion, exportedAt: obj.exportedAt, formatVersion: obj.formatVersion };
  } else if (Array.isArray(obj.users) && 'logs' in obj && typeof obj.version === 'string' && /^v1\.\d+/.test(obj.version)) {
    // ซองไฟล์เดิม — export-data เหมือนกันทุกไบต์ตั้งแต่ v1.0.0 ถึง v1.10.53
    kind = 'legacy';
    hs = {
      users: obj.users, currentUserId: obj.currentUserId, customMeals: obj.customMeals,
      favorites: obj.favorites, logs: obj.logs, dailyTargets: obj.dailyTargets
    };
    meta = { appVersion: obj.version, exportedAt: obj.exportedAt, formatVersion: 1 };
  } else {
    return fail('ไม่ใช่ไฟล์สำรองของ PraCaL');
  }
  const hErr = validateHealthSection(hs);
  if (hErr) return fail(hErr);
  const mErr = validateMoneySection(money);
  if (mErr) return fail(mErr);
  const health = normalizeHealthSection(hs);
  // ข้อมูลเงินของโปรไฟล์ที่ไม่มีในส่วนสุขภาพ = ข้อมูลกำพร้า → ไม่นำเข้า และบอกในหน้าตัวอย่าง
  let droppedMoneyProfiles = 0;
  if (money) {
    const ids = new Set(health.users.map(u => u.id));
    for (const uid of Object.keys(money.byUser)) if (!ids.has(uid)) { delete money.byUser[uid]; droppedMoneyProfiles++; }
  }
  return { ok: true, kind, health, money, meta, droppedMoneyProfiles, summary: summarizeData(health, money) };
}

// ---------- สำเนาความปลอดภัย (IndexedDB แยกฐาน — ไม่แตะ PraCaLBodyProgress) ----------
// id = เวลาที่สร้าง จึงเรียงและตัดของเก่าได้จาก key โดยไม่ต้องโหลดข้อมูลทั้งก้อน
let _safetyDbPromise = null;
function openSafetyDb() {
  if (_safetyDbPromise) return withDbTimeout(_safetyDbPromise);
  _safetyDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('IndexedDB ไม่รองรับในเบราว์เซอร์นี้'));
    const req = indexedDB.open(SAFETY_DB_NAME, 1);
    req.onerror = () => { _safetyDbPromise = null; reject(req.error); };
    // v1.10.56 — ปิดเมื่อมีการลบ/อัปเกรดฐานจากที่อื่น ไม่งั้นคำขอนั้นค้าง และการเปิดฐานครั้งถัดไปทั้งหมดค้างตาม (ปุ่มนำเข้าหมุนไม่จบ)
    req.onsuccess = () => { const db = req.result; db.onversionchange = () => { db.close(); _safetyDbPromise = null; }; resolve(db); };
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(SAFETY_STORE)) db.createObjectStore(SAFETY_STORE, { keyPath: 'id' });
    };
  });
  return withDbTimeout(_safetyDbPromise);
}
async function saveSafetySnapshot(rec) {
  const db = await openSafetyDb();
  const id = Date.now();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(SAFETY_STORE, 'readwrite');
    tx.objectStore(SAFETY_STORE).put({ ...rec, id, createdAt: id });
    tx.oncomplete = () => resolve(id);          // คืนค่าเมื่อเขียนเสร็จจริงเท่านั้น
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('snapshot aborted'));
  });
}
async function getSafetySnapshot(id) {
  const db = await openSafetyDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(SAFETY_STORE, 'readonly').objectStore(SAFETY_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deleteSafetySnapshot(id) {
  const db = await openSafetyDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(SAFETY_STORE, 'readwrite');
    tx.objectStore(SAFETY_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function safetySnapshotKeys() {
  const db = await openSafetyDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction(SAFETY_STORE, 'readonly').objectStore(SAFETY_STORE).getAllKeys();
    req.onsuccess = () => resolve((req.result || []).slice().sort((a, b) => b - a));
    req.onerror = () => reject(req.error);
  });
}
async function pruneSafetySnapshots() {
  const keys = await safetySnapshotKeys();
  const now = Date.now();
  const j = readRestoreMarker();   // สำเนาของการนำเข้าที่ยังไม่ปิดงาน ห้ามลบ
  const doomed = keys.filter((k, i) => (i >= SAFETY_MAX_SNAPSHOTS || now - k > SAFETY_KEEP_MS) && !(j && j.snapId === k));
  for (const k of doomed) await deleteSafetySnapshot(k);
  return doomed.length;
}
async function getNewestSafetySnapshotMeta() {
  const keys = await safetySnapshotKeys();
  if (!keys.length || Date.now() - keys[0] > SAFETY_KEEP_MS) return null;
  const snap = await getSafetySnapshot(keys[0]);
  return snap ? { id: snap.id, createdAt: snap.createdAt, reason: snap.reason, label: snap.label || '' } : null;
}

// ---------- กันแท็บอื่นเขียนทับหลังกู้คืน ----------
// _loadedRestoreEpoch ประกาศไว้ต้นสคริปต์ (ใกล้ STORAGE_KEY) เพราะ persist() อ่านค่านี้
function restoreEpochChangedElsewhere() {
  try { return (localStorage.getItem(RESTORE_EPOCH_KEY) || '') !== _loadedRestoreEpoch; } catch { return false; }
}
// เครื่องหมาย "เพิ่งนำเข้า" อยู่ใน localStorage ซึ่งทุกแท็บเห็น — ถ้าทุกแท็บตรวจและคืนข้อมูลพร้อมกัน
// แท็บหนึ่งจะคืนสำเร็จแล้วลบสำเนา อีกแท็บจะหาสำเนาไม่เจอแล้วเตือนว่า "คืนไม่ได้" ทั้งที่ข้อมูลปลอดภัย
// และแท็บที่ผู้ใช้กดนำเข้าจะไม่เห็นผลลัพธ์ → ให้เฉพาะแท็บที่กู้คืนเป็นผู้ตรวจ
function myTabId() {
  try {
    let id = sessionStorage.getItem(TAB_ID_KEY);
    if (!id) { id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); sessionStorage.setItem(TAB_ID_KEY, id); }
    return id;
  } catch { return ''; }
}
function setBootNotice(kind, detail) {
  try { sessionStorage.setItem(BOOT_NOTICE_KEY, JSON.stringify({ kind, detail: detail || '' })); } catch {}
}
function reloadAfterExternalRestore() {
  if (_reloadingForRestore) return;
  _reloadingForRestore = true;
  setBootNotice('external-restore', '');
  location.reload();
}

// ---------- สถานะการนำเข้าที่เก็บถาวร (journal) — v1.10.56 ----------
// เครื่องหมาย "เพิ่งนำเข้า" เดิมเก็บหลังเขียนเสร็จ จึงไม่ครอบคลุมการปิดหน้า/แท็บระหว่างเขียน (catch/finally ไม่ได้รัน)
// ตอนนี้บันทึก journal ให้สำเร็จก่อนเปลี่ยนข้อมูลจริง แล้วเลื่อน phase:
//   'writing'   → กำลังเขียน (ถ้าเจอตอนเปิดแอป = ถูกขัดจังหวะ → คืนชุดเดิม)
//   'verify'    → เขียนครบแล้ว รอตรวจหลังโหลด (ตรวจ hash ของทั้งสองส่วน + เปิดได้ทุกโปรไฟล์)
//   'reverting' → กำลังคืนชุดเดิม (ถ้าเจอตอนเปิดแอป = คืนค้าง → คืนซ้ำ)
// แท็บที่นำเข้าถือ Web Lock ไว้ตลอดช่วงเขียน — แท็บอื่นแยกได้ว่า "ยังทำอยู่" หรือ "ปิดไปแล้ว"
const RESTORE_LOCK_NAME = 'pracal-restore';
const DB_OPEN_TIMEOUT_MS = 5000;
const DB_BLOCKED_MESSAGE = 'ฐานข้อมูลถูก PraCaL หน้าต่างอื่นใช้อยู่ — กรุณาปิด PraCaL แท็บ/หน้าต่างอื่นทั้งหมด แล้วลองอีกครั้ง';
// เปิดฐาน IndexedDB ค้างได้เมื่อมีคำขอลบ/อัปเกรดฐานที่ถูกแท็บอื่น (เช่นแท็บโค้ดเก่า) บล็อกอยู่ → ไม่ปล่อยให้หมุนค้าง
function withDbTimeout(promise) {
  let t;
  return Promise.race([
    promise,
    new Promise((_, reject) => { t = setTimeout(() => { const e = new Error(DB_BLOCKED_MESSAGE); e.dbBlocked = true; reject(e); }, DB_OPEN_TIMEOUT_MS); })
  ]).finally(() => clearTimeout(t));
}
// hash ของข้อความ (cyrb53) — ใช้ตรวจว่าข้อมูลที่อยู่ในเครื่องตรงกับชุดที่ตั้งใจเขียนหรือไม่ โดยไม่ต้องเก็บข้อมูลทั้งก้อนซ้ำ
function hashRaw(s) {
  if (s == null) return 'null';
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return s.length + ':' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
// throw ถ้าเขียนไม่ได้ — ผู้เรียกต้องหยุด ห้ามเปลี่ยนข้อมูลโดยไม่มี journal
function writeRestoreJournal(j) {
  localStorage.setItem(RESTORE_MARKER_KEY, JSON.stringify({ ...j, at: Date.now(), tabId: myTabId() }));
}
// ถือ lock จนกว่าจะเรียก release() หรือหน้าถูกปิด/โหลดใหม่ · เบราว์เซอร์ที่ไม่มี Web Locks → ใช้เวลา (RESTORE_MARKER_STALE_MS) แทน
async function acquireRestoreLock() {
  let release = () => {};
  if (navigator.locks && navigator.locks.request) {
    await new Promise(acquired => {
      navigator.locks.request(RESTORE_LOCK_NAME, () => new Promise(done => { release = done; acquired(); })).catch(() => acquired());
    });
  }
  return { release: () => release() };
}
async function restoreLockHeld() {
  try {
    if (navigator.locks && navigator.locks.query) {
      const q = await navigator.locks.query();
      return (q.held || []).some(l => l.name === RESTORE_LOCK_NAME);
    }
  } catch {}
  return null;   // ไม่รู้
}
// คืนชุดก่อนนำเข้าจาก safety snapshot แล้วอ่านกลับมาตรวจ · ล้าง journal เฉพาะเมื่อตรวจแล้วว่าทั้งสองส่วนตรงจริง
async function revertToSnapshot(j) {
  try { writeRestoreJournal({ ...j, phase: 'reverting' }); } catch {}
  let ok = false;
  try {
    const snap = await getSafetySnapshot(j.snapId);
    if (snap) ok = await rollbackRaw(snap.health, snap.money);
  } catch {}
  try { localStorage.setItem(RESTORE_EPOCH_KEY, String(Date.now()) + 'r'); } catch {}   // แท็บอื่นที่เปิดค้างต้องโหลดใหม่ ห้ามเขียน
  if (ok) {
    clearRestoreMarker();
    try { await deleteSafetySnapshot(j.snapId); } catch {}   // ลบหลังล้าง journal: ถ้าปิดหน้าระหว่างนี้ จะเหลือสำเนาเกิน ไม่ใช่ journal ที่ไม่มีสำเนา
  }
  return ok;
}
// เรียกต้น main() ก่อน initFromStorage (ซึ่งอาจเขียนผ่าน migrateData) · ผล: { go, verify } | { wait } | { stop, recovery }
async function handleRestoreJournalAtBoot() {
  const j = readRestoreMarker();
  if (!j) return { go: true };
  const mine = !!j.tabId && j.tabId === myTabId();
  const fresh = Date.now() - (Number(j.at) || 0) <= RESTORE_MARKER_STALE_MS;
  const phase = j.phase || 'verify';   // เครื่องหมายจาก v1.10.54/55 ไม่มี phase = เขียนครบแล้ว
  if (phase === 'verify') {
    if (!mine && fresh) return { go: true };   // แท็บที่นำเข้ากำลังโหลดใหม่และจะตรวจเอง
    if (j.tgtH) {
      let curH = null, curM;
      try { curH = localStorage.getItem(STORAGE_KEY); curM = await withDbTimeout(moneyReadRaw()); } catch { curM = undefined; }
      if (hashRaw(curH) !== j.tgtH || curM === undefined || hashRaw(curM) !== j.tgtM) return revertOrRecover(j, 'restore-reverted');
    }
    return { go: true, verify: j };
  }
  // 'writing' / 'reverting' = งานค้าง · ถ้าแท็บที่ทำยังเปิดอยู่ (ถือ lock) ให้รอ ไม่แย่งคืนข้อมูลกลางทาง
  const held = await restoreLockHeld();
  if (!mine && (held === true || (held === null && fresh))) return { wait: true };
  return revertOrRecover(j, 'restore-interrupted-reverted');
}
async function revertOrRecover(j, noticeKind) {
  if (await revertToSnapshot(j)) {

    location.reload();
    return { stop: true };
  }
  return { stop: true, recovery: true };
}

function pollRestoreWait() {
  const t = setInterval(async () => {
    const j = readRestoreMarker();
    if (!j || (j.phase !== 'writing' && j.phase !== 'reverting')) { clearInterval(t); location.reload(); return; }
    const held = await restoreLockHeld();
    if (held === false || (held === null && Date.now() - (Number(j.at) || 0) > RESTORE_MARKER_STALE_MS)) { clearInterval(t); location.reload(); }
  }, 1000);
}

// ---------- กู้คืน ----------
// คืนทั้งสองส่วน แล้วอ่านกลับมาตรวจ — คืน true เฉพาะเมื่อทั้งสองส่วนตรงกับค่าเดิมจริง
async function rollbackRaw(prevHealth, prevMoney) {
  try { if (prevHealth === null) localStorage.removeItem(STORAGE_KEY); else localStorage.setItem(STORAGE_KEY, prevHealth); } catch {}
  try { await moneyWriteRaw(prevMoney); } catch {}
  try { return localStorage.getItem(STORAGE_KEY) === prevHealth && (await moneyReadRaw()) === prevMoney; } catch { return false; }
}
// source = { healthRaw: string|null, moneyRaw: string|null, reason: 'pre-restore'|'pre-undo', label }
// ลำดับ: lock → อ่านชุดปัจจุบัน → safety snapshot (เขียนเสร็จจริง) → journal 'writing' → epoch → เขียนเงิน → เขียนสุขภาพ
//        → journal 'verify' → โหลดใหม่ → ตรวจตอนเปิดแอป (handleRestoreJournalAtBoot + smoke test)
// ปิดหน้าตรงไหนก็ตามหลัง journal 'writing' → เปิดแอปครั้งถัดไปคืนชุดเดิมก่อนให้บันทึกอะไรได้
async function performRestore(source) {
  if (state.tmp.restoring) return;
  state.tmp.restoring = true;
  state.tmp.restoreError = '';
  render();
  const lock = await acquireRestoreLock();
  const stop = (msg) => { lock.release(); state.tmp.restoring = false; state.tmp.restoreError = msg; render(); };
  if (readRestoreMarker()) return stop('มีการนำเข้าครั้งก่อนที่ยังไม่เสร็จ — โหลดหน้าใหม่ก่อน แล้วลองอีกครั้ง');
  let prevHealth, prevMoney;
  try {
    prevHealth = localStorage.getItem(STORAGE_KEY);
    prevMoney = await moneyReadRaw();
  } catch (e) {
    return stop(e && e.dbBlocked ? e.message : 'อ่านข้อมูลปัจจุบันไม่ได้ จึงยกเลิกการนำเข้า — ไม่มีอะไรเปลี่ยน');
  }
  let snapId;
  try {
    snapId = await saveSafetySnapshot({ reason: source.reason, label: source.label || '', appVersion: VERSION, health: prevHealth, money: prevMoney });
  } catch (e) {
    return stop(e && e.dbBlocked ? e.message : 'เก็บสำเนาข้อมูลปัจจุบันไม่สำเร็จ จึงยังไม่นำเข้า — กด "ดาวน์โหลดไฟล์สำรอง" ของเครื่องนี้เก็บไว้ก่อน แล้วลองใหม่ (' + (e && e.message || e) + ')');
  }
  const journal = {
    phase: 'writing', snapId, reason: source.reason,
    prevH: hashRaw(prevHealth), prevM: hashRaw(prevMoney), tgtH: hashRaw(source.healthRaw), tgtM: hashRaw(source.moneyRaw)
  };
  try { writeRestoreJournal(journal); }
  catch (e) {
    try { await deleteSafetySnapshot(snapId); } catch {}
    return stop('บันทึกสถานะการนำเข้าไม่สำเร็จ (พื้นที่ในเครื่องอาจไม่พอ) จึงยังไม่นำเข้า — ไม่มีอะไรเปลี่ยน');
  }
  // epoch ก่อน: นับจากตอนนี้ persist() / บันทึกเงินของทุกแท็บอื่นจะปฏิเสธการเขียน
  try { localStorage.setItem(RESTORE_EPOCH_KEY, String(Date.now())); } catch {}
  // เขียนเงิน (IndexedDB) แล้วสุขภาพ (localStorage) — สองที่เก็บไม่มี transaction ร่วม
  let failed = null;
  try { await moneyWriteRaw(source.moneyRaw); } catch (e) { failed = e; }
  if (!failed) {
    try {
      if (source.healthRaw === null) localStorage.removeItem(STORAGE_KEY);
      else localStorage.setItem(STORAGE_KEY, source.healthRaw);
    } catch (e) { failed = e; }
  }
  if (failed) {
    const detail = String(failed && (failed.dbBlocked ? failed.message : (failed.name || failed.message)) || failed);
    // คืนไม่ครบ → journal ยังอยู่ ('reverting') → เปิดแอปครั้งถัดไปเข้าหน้ากู้คืน ไม่เปิดใช้งานปกติ
    setBootNotice((await revertToSnapshot(journal)) ? 'restore-write-failed' : 'restore-rollback-incomplete', detail);
    location.reload();
    return;
  }
  // ถ้าเขียน 'verify' ไม่ได้ journal ยังเป็น 'writing' → เปิดครั้งถัดไปจะคืนชุดเดิม (ปลอดภัย แค่การนำเข้าไม่เกิด)
  try { writeRestoreJournal({ ...journal, phase: 'verify' }); } catch {}
  // epoch อีกครั้งหลังเขียนเสร็จ: แท็บที่โหลดใหม่ระหว่างช่วงเขียน จะได้ event อีกรอบแล้วโหลดข้อมูลชุดสุดท้าย
  try { localStorage.setItem(RESTORE_EPOCH_KEY, String(Date.now()) + 'b'); } catch {}
  location.reload();
}
function readRestoreMarker() {
  try { const raw = localStorage.getItem(RESTORE_MARKER_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function clearRestoreMarker() {
  try { localStorage.removeItem(RESTORE_MARKER_KEY); } catch {}

// render() จับ error แล้วแสดงการ์ด "เกิดข้อผิดพลาด" แทนการพัง แอปที่เปิดได้จึงไม่ได้แปลว่าข้อมูลใช้ได้

function handleBackupFile(file) {
  state.tmp.importError = '';
  if (file.size > BACKUP_MAX_BYTES) { state.tmp.importError = 'ไฟล์ใหญ่เกิน 20 MB — ไม่น่าใช่ไฟล์สำรองของ PraCaL'; return render(); }
  const reader = new FileReader();
  reader.onerror = () => { state.tmp.importError = 'อ่านไฟล์ไม่ได้'; render(); };
  reader.onload = async () => {
    const parsed = parseBackupText(String(reader.result || ''), file.size);
    if (!parsed.ok) { state.tmp.importError = parsed.error; return render(); }
    let curMoneyRaw;
    try { curMoneyRaw = await moneyReadRaw(); }
    catch { state.tmp.importError = 'อ่านข้อมูลเงินในเครื่องไม่ได้ จึงยังนำเข้าไม่ได้ — ไม่มีอะไรเปลี่ยน'; return render(); }
    go('restore-preview', { restore: {
      source: 'file', fileName: file.name, fileSize: file.size,
      kind: parsed.kind, meta: parsed.meta, summary: parsed.summary,
      droppedMoneyProfiles: parsed.droppedMoneyProfiles, curMoneyRaw,
      healthRaw: JSON.stringify(parsed.health),
      moneyRaw: parsed.money ? JSON.stringify(parsed.money) : null
    } });
  };
  reader.readAsText(file);
}

}

}

          <li>รูปถ่ายความคืบหน้าไม่อยู่ในไฟล์สำรอง — รูปที่อยู่ในเครื่องนี้ยังอยู่ตามเดิม</li>

}
