/* ========== MONEY — ที่เก็บ + เครื่องคำนวณ (v1.10.55 — T-026b · ยังไม่มี UI) ========== */
// Spec: docs/specs/T-026-money-tracking.md §5 (ร่าง 3)
// - จำนวนเงินทุกตัวเป็นสตางค์จำนวนเต็ม · วันที่เป็นสตริงท้องถิ่น YYYY-MM-DD เทียบกันแบบสตริง
// - ยอดหนี้ / ค้างรับ / ต้องคืน ไม่ถูกเก็บ — คำนวณจากรายการทุกครั้ง ณ วันที่ที่ขอ (P4)
// - "ค่าใช้จ่ายของฉัน" = ตามการชำระ · ทุกบรรทัดลงวันที่ของเหตุการณ์ตัวเอง → เหตุการณ์ใหม่ไม่ย้อนแก้ช่วงที่ผ่านไป
// - เขียนผ่าน moneyCommit() เท่านั้น: อ่านใหม่จาก storage → ตรวจแท็บเก่า → แก้สำเนา → ตรวจกติกาทั้งชุด → เขียน

const MONEY_SCHEMA_VERSION = 1;
const MONEY_MAX_SATANG = 999999999;                    // ฿9,999,999.99
const MONEY_INTEREST_CAT = 'c_interest';               // ปลายทางของดอกเบี้ย/ค่าธรรมเนียมของเงินกู้
const MONEY_SELF_CTX = 'x_self';
const MONEY_DUP_INSTALLMENT_DAYS = 5;                  // เตือนเมื่อรายจ่ายหน้าตาเหมือนงวดผ่อน ภายใน ±5 วันจากวันครบกำหนด
const MONEY_DEFAULT_CATEGORIES = [
  ['c_food', 'expense', 'อาหาร/เครื่องดื่ม'], ['c_travel', 'expense', 'เดินทาง'], ['c_daily', 'expense', 'ของใช้ประจำวัน'],
  ['c_shop', 'expense', 'ช้อปปิ้ง'], ['c_fun', 'expense', 'เกม/บันเทิง'], ['c_home', 'expense', 'บ้าน/บิล'],
  ['c_health', 'expense', 'สุขภาพ'], ['c_gift', 'expense', 'ของขวัญ/ทำบุญ'], [MONEY_INTEREST_CAT, 'expense', 'ดอกเบี้ย/ค่าธรรมเนียม'],
  ['c_other', 'expense', 'อื่น ๆ'],
  ['i_salary', 'income', 'เงินเดือน'], ['i_side', 'income', 'รายได้เสริม'], ['i_bonus', 'income', 'โบนัส/พิเศษ'], ['i_other', 'income', 'อื่น ๆ']
];
const MONEY_DEFAULT_CONTEXTS = [
  [MONEY_SELF_CTX, 'ตัวเอง'], ['x_partner', 'แฟน'], ['x_friend', 'เพื่อน'], ['x_family', 'ครอบครัว'], ['x_work', 'งาน'], ['x_other', 'อื่น ๆ']
];
// ชนิดหนี้กำหนดกติกาการนับ — ไม่มีสวิตช์ให้ผู้ใช้ตั้งเอง (C1)
// ไม่มีชนิดไหนรองรับวงเงินหมุนเวียน / บัตรที่ยังรูดเพิ่ม (C6) — UI ต้องแจ้งก่อนสร้าง
const DEBT_TYPES = {
  installment: { name: 'ผ่อนสินค้า', paymentsAreMyCost: true },
  loan: { name: 'เงินกู้ / กดเงินสด', paymentsAreMyCost: false },
  card: { name: 'หนี้บัตรเดิม', paymentsAreMyCost: false },
  personal: { name: 'ยืมเงินคนรู้จัก', paymentsAreMyCost: false }
};
const DEBT_ANCHOR_TYPES = ['start', 'statement', 'adjust', 'close'];

// ---------- จำนวนเงินและวันที่ ----------
function isSatang(n) { return Number.isInteger(n) && n >= 0 && n <= MONEY_MAX_SATANG; }
// แยกสตริง ไม่คูณทศนิยม (1200.1 * 100 = 120009.99…) · รับ 1200 · 1,200 · 1200.5 · ฿1,200.50
function parseMoneyInput(text) {
  let s = String(text == null ? '' : text).trim().replace(/^฿\s*/, '');
  if (!s) return null;
  if (s.includes(',')) {
    if (!/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(s)) return null;
    s = s.replace(/,/g, '');
  }
  const m = s.match(/^(\d+)(?:\.(\d{1,2}))?$/);
  if (!m) return null;
  const baht = m[1].replace(/^0+(?=\d)/, '');
  if (baht.length > 7) return null;
  const v = Number(baht) * 100 + Number((m[2] || '').padEnd(2, '0'));
  return v <= MONEY_MAX_SATANG ? v : null;
}
function formatMoney(satang, opts) {
  if (opts && opts.hidden) return '฿•••';
  const a = Math.abs(satang);
  const st = a % 100;
  const s = '฿' + Math.floor(a / 100).toLocaleString('en-US') + (st ? '.' + String(st).padStart(2, '0') : '');
  return satang < 0 ? '−' + s : s;
}
function moneyAddDays(key, n) {
  const [y, m, d] = key.split('-').map(Number);
  return dateToKey(new Date(y, m - 1, d + n));
}
function moneyDaysBetween(a, b) {
  const [y1, m1, d1] = a.split('-').map(Number);
  const [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}
function moneyMonthRange(ym) {
  const [y, m] = ym.split('-').map(Number);
  return { start: dateToKey(new Date(y, m - 1, 1)), end: dateToKey(new Date(y, m, 0)) };
}
// ช่วงวันที่ — สัปดาห์เริ่มวันจันทร์ (F8) · กำหนดเองรวมทั้งสองวัน สิ้นสุดก่อนเริ่ม = null
function moneyPeriodRange(kind, today, custom) {
  const [y, m, d] = today.split('-').map(Number);
  if (kind === 'today') return { start: today, end: today };
  if (kind === 'week') {
    const start = moneyAddDays(today, -((new Date(y, m - 1, d).getDay() + 6) % 7));
    return { start, end: moneyAddDays(start, 6) };
  }
  if (kind === 'month') return moneyMonthRange(today.slice(0, 7));
  if (kind === 'lastMonth') return { start: dateToKey(new Date(y, m - 2, 1)), end: dateToKey(new Date(y, m - 1, 0)) };
  if (kind === 'custom') {
    if (!custom || !isRealDateKey(custom.start) || !isRealDateKey(custom.end) || custom.end < custom.start) return null;
    return { start: custom.start, end: custom.end };
  }
  return null;
}
// ยอดคงค้างของช่วง = ณ สิ้นช่วง ถ้าช่วงจบแล้ว · ณ วันนี้ ถ้ายังไม่จบ (A13)
function moneyAsOf(range, today) {
  return range.end < today ? { date: range.end, label: 'ณ สิ้นช่วง ' + formatDateTH(range.end) } : { date: today, label: 'ณ วันนี้ ' + formatDateTH(today) };
}

// ---------- โครงข้อมูลเริ่มต้น ----------
function moneyEmpty() { return { schemaVersion: MONEY_SCHEMA_VERSION, revision: 0, byUser: {} }; }
function moneyEmptyUser() {
  let order = 0;
  return {
    enabled: false,
    categories: MONEY_DEFAULT_CATEGORIES.map(([id, kind, name]) => ({
      id, kind, name, order: ++order, archived: false, system: id === MONEY_INTEREST_CAT ? 'interest' : null
    })),
    contexts: MONEY_DEFAULT_CONTEXTS.map(([id, name], i) => ({ id, name, order: i + 1, archived: false })),
    txns: [],
    debts: [],
    prefs: { period: 'month', hideAmounts: false }
  };
}
function moneyUser(data, uid) {
  if (!data.byUser[uid]) data.byUser[uid] = moneyEmptyUser();
  return data.byUser[uid];
}

// ---------- ดัชนีรายการที่ผูกกับรายจ่าย (คนอื่นคืน · ร้านคืน · ไม่ต้องคืนแล้ว · คืนเงินให้คนอื่น) ----------
function moneyLinkIndex(mu) {
  const idx = new Map();
  const add = (eid, ev) => { if (!eid) return; if (!idx.has(eid)) idx.set(eid, []); idx.get(eid).push(ev); };
  for (const t of mu.txns) {
    if (t.kind === 'moneyBack') {
      for (const a of (t.allocations || [])) {
        if (t.backType === 'refund') add(a.txnId, { kind: 'refund', txnId: t.id, date: t.date, mine: a.mine || 0, others: a.others || 0 });
        else add(a.txnId, { kind: 'reimburse', txnId: t.id, date: t.date, amount: a.amount || 0 });
      }
    } else if (t.kind === 'writeOff') add(t.sourceTxnId, { kind: 'writeOff', txnId: t.id, date: t.date, amount: t.amount });
    else if (t.kind === 'payOut') add(t.sourceTxnId, { kind: 'payOut', txnId: t.id, date: t.date, amount: t.amount });
  }
  return idx;
}
function moneyLinkTotals(idx, eid, upTo) {
  const r = { reimbursed: 0, writtenOff: 0, refundMine: 0, refundOthers: 0, paidOut: 0 };
  for (const ev of (idx.get(eid) || [])) {
    if (upTo && ev.date > upTo) continue;
    if (ev.kind === 'reimburse') r.reimbursed += ev.amount;
    else if (ev.kind === 'writeOff') r.writtenOff += ev.amount;
    else if (ev.kind === 'payOut') r.paidOut += ev.amount;
    else { r.refundMine += ev.mine; r.refundOthers += ev.others; }
  }
  return r;
}
// ยอดกับคนอื่นของรายจ่าย e ณ วันที่ t: บวก = ค้างรับ · ลบ = ต้องคืน (§5.4ค)
function moneyPosition(idx, e, upTo) {
  const L = moneyLinkTotals(idx, e.id, upTo);
  return (e.amount - e.myShare) - L.reimbursed - L.writtenOff - L.refundOthers + L.paidOut;
}
function moneyBalancesWithOthersAt(mu, t) {
  const idx = moneyLinkIndex(mu);
  let receivable = 0, payable = 0;
  const items = [];
  for (const e of mu.txns) {
    if (e.kind !== 'expense' || e.date > t) continue;
    const pos = moneyPosition(idx, e, t);
    if (pos > 0) receivable += pos; else if (pos < 0) payable -= pos;
    if (pos !== 0) items.push({ txnId: e.id, date: e.date, pos });
  }
  return { receivable, payable, items };
}

// ---------- หนี้ ----------
function moneyAnchorCutoff(a) { return a.type === 'start' ? moneyAddDays(a.date, -1) : a.date; }   // start = ก่อนการจ่ายวันนั้น
function moneyDebtStart(debt) { return (debt.anchors || []).find(a => a.type === 'start') || null; }
// ยอดหนี้ ณ วันที่ t — งวดที่ไม่ทราบเงินต้นหลังยอดอ้างอิงล่าสุด → "ยังไม่ยืนยัน" ไม่แสดงตัวเลขเดา (§5.4ง, DEC-004)
function moneyDebtBalanceAt(mu, debt, t) {
  const anchors = debt.anchors.map((a, i) => ({ a, i, c: moneyAnchorCutoff(a) })).filter(x => x.c <= t)
    .sort((x, y) => (x.c < y.c ? -1 : x.c > y.c ? 1 : x.i - y.i));
  if (!anchors.length) return null;                     // ยังไม่เริ่มติดตาม ณ วันนั้น
  const A = anchors[anchors.length - 1].a;
  const cut = moneyAnchorCutoff(A);
  const pays = mu.txns.filter(p => p.kind === 'debtPayment' && p.debtId === debt.id && p.date > cut && p.date <= t);
  const paidSince = pays.reduce((s, p) => s + p.amount, 0);
  if (pays.some(p => p.principal == null)) {
    return { confirmed: false, lastConfirmed: A.balance, lastConfirmedDate: A.date, paidSince, unsplitCount: pays.filter(p => p.principal == null).length };
  }
  return { confirmed: true, balance: A.balance - pays.reduce((s, p) => s + p.principal, 0), basedOn: A.date, anchorType: A.type };
}
// หนี้รวม: แสดงผลรวมทั้งหมดเฉพาะเมื่อยืนยันครบ (C3)
function moneyDebtTotalsAt(mu, t) {
  let confirmedTotal = 0, confirmedCount = 0, unconfirmedCount = 0;
  for (const d of mu.debts) {
    const b = moneyDebtBalanceAt(mu, d, t);
    if (!b) continue;
    if (b.confirmed) { confirmedTotal += b.balance; confirmedCount++; } else unconfirmedCount++;
  }
  return { confirmedTotal, confirmedCount, unconfirmedCount, total: unconfirmedCount ? null : confirmedTotal };
}
// ข้อเท็จจริงตอนใส่ใบแจ้ง/ปรับยอด — ไม่เดาดอกเบี้ย ไม่สร้างเงินสด
function moneyAnchorFacts(mu, debt, anchor) {
  const prev = debt.anchors.filter(a => a !== anchor && moneyAnchorCutoff(a) < anchor.date)
    .sort((x, y) => (moneyAnchorCutoff(x) < moneyAnchorCutoff(y) ? -1 : 1)).pop();
  if (!prev) return null;
  const cut = moneyAnchorCutoff(prev);
  const paidSince = mu.txns.filter(p => p.kind === 'debtPayment' && p.debtId === debt.id && p.date > cut && p.date <= anchor.date)
    .reduce((s, p) => s + p.amount, 0);
  return { previousBalance: prev.balance, previousDate: prev.date, paidSince, decreasedBy: prev.balance - anchor.balance };
}

// ---------- ค่าใช้จ่ายของฉัน (ตามการชำระ) ----------
function moneyMyCostLines(mu, S, E) {
  const tx = new Map(mu.txns.map(t => [t.id, t]));
  const debts = new Map(mu.debts.map(d => [d.id, d]));
  const lines = [];
  let unsplitLoan = 0;
  const unsplitTxnIds = [];
  const line = (t, categoryId, contextId, amount, kind, extra) => lines.push({ txnId: t.id, date: t.date, categoryId, contextId, amount, kind, ...extra });
  for (const t of mu.txns) {
    if (t.date < S || t.date > E) continue;
    if (t.kind === 'expense') line(t, t.categoryId, t.contextId, t.myShare, 'spend', { paid: t.amount });
    else if (t.kind === 'writeOff') line(t, t.categoryId, t.contextId, t.amount, 'writeOff', { sourceTxnId: t.sourceTxnId });
    else if (t.kind === 'moneyBack' && t.backType === 'refund') {
      for (const a of (t.allocations || [])) {
        const src = tx.get(a.txnId);
        if (src && a.mine) line(t, src.categoryId, src.contextId, -a.mine, 'refund', { sourceTxnId: src.id });
      }
    } else if (t.kind === 'debtPayment') {
      const d = debts.get(t.debtId);
      if (!d) continue;
      if (DEBT_TYPES[d.type].paymentsAreMyCost) line(t, d.categoryId, d.contextId, t.amount, 'installment', { debtId: d.id });
      else if (t.principal == null) { unsplitLoan += t.amount; unsplitTxnIds.push(t.id); }
      else if (t.interest + t.fee > 0) line(t, MONEY_INTEREST_CAT, MONEY_SELF_CTX, t.interest + t.fee, 'interest', { debtId: d.id });
    }
  }
  return { lines, unsplitLoan, unsplitTxnIds };
}
function moneySummary(mu, S, E) {
  const P = mu.txns.filter(t => t.date >= S && t.date <= E);
  const sum = (arr, f) => arr.reduce((s, t) => s + (f ? f(t) : t.amount), 0);
  const of = k => P.filter(t => t.kind === k);
  const pays = of('debtPayment');
  const cash = {
    income: sum(of('income')), back: sum(of('moneyBack')),
    paid: sum(of('expense')), debtPaid: sum(pays), payOut: sum(of('payOut'))
  };
  cash.cashIn = cash.income + cash.back;
  cash.cashOut = cash.paid + cash.debtPaid + cash.payOut;
  cash.net = cash.cashIn - cash.cashOut;
  const { lines, unsplitLoan, unsplitTxnIds } = moneyMyCostLines(mu, S, E);
  const byCategory = {}, byContext = {};
  for (const l of lines) {
    const c = byCategory[l.categoryId] || (byCategory[l.categoryId] = { paid: 0, refunded: 0, net: 0 });
    if (l.amount >= 0) c.paid += l.amount; else c.refunded -= l.amount;
    c.net += l.amount;
    byContext[l.contextId] = (byContext[l.contextId] || 0) + l.amount;
  }
  const by = k => lines.filter(l => l.kind === k).reduce((s, l) => s + l.amount, 0);
  const mine = lines.reduce((s, l) => s + l.amount, 0);
  return {
    range: { start: S, end: E }, cash, mine, byCategory, byContext,
    // mine = จ่าย − ส่วนของคนอื่น + ไม่ต้องคืนแล้ว − ร้านคืน (ส่วนของฉัน) + งวดผ่อนสินค้า + ดอกเบี้ย/ค่าธรรมเนียมของเงินกู้
    reconcile: {
      paid: cash.paid, othersShare: cash.paid - by('spend'), writeOff: by('writeOff'),
      refundMine: -by('refund'), installment: by('installment'), interestFee: by('interest')
    },
    debt: {
      paid: cash.debtPaid,
      principal: sum(pays.filter(p => p.principal != null), p => p.principal),
      interest: sum(pays, p => p.interest || 0), fee: sum(pays, p => p.fee || 0),
      unsplit: sum(pays.filter(p => p.principal == null))
    },
    unsplitLoan, unsplitTxnIds,          // งวดเงินกู้ที่ยังไม่แยก — ไม่อยู่ใน mine และต้องแจ้งผู้ใช้ (C2)
    negativeBecauseRefunds: mine < 0     // C8
  };
}
// กรองหมวด × บริบท (null = ทั้งหมด) — บรรทัดค่าใช้จ่ายของฉันที่ตรง + ยอดที่จ่ายจริงของรายจ่ายที่ตรง
function moneyFilteredCost(mu, S, E, categoryId, contextId) {
  const ok = l => (!categoryId || l.categoryId === categoryId) && (!contextId || l.contextId === contextId);
  const lines = moneyMyCostLines(mu, S, E).lines.filter(ok);
  return {
    net: lines.reduce((s, l) => s + l.amount, 0),
    paid: lines.filter(l => l.kind === 'spend').reduce((s, l) => s + l.paid, 0),
    count: new Set(lines.map(l => l.txnId)).size
  };
}
// ผลต่อค่าใช้จ่ายของฉันรายเดือน ระหว่างข้อมูลสองชุด — ใช้ preview ก่อนแก้ประวัติ (C2, C7)
function moneyMonthlyDelta(muBefore, muAfter) {
  const months = new Set();
  for (const mu of [muBefore, muAfter]) for (const t of mu.txns) months.add(t.date.slice(0, 7));
  const out = [];
  for (const ym of [...months].sort()) {
    const r = moneyMonthRange(ym);
    const before = moneySummary(muBefore, r.start, r.end).mine;
    const after = moneySummary(muAfter, r.start, r.end).mine;
    if (before !== after) out.push({ month: ym, before, after, delta: after - before });
  }
  return out;
}

// ---------- ตรวจกติกาทั้งชุดของหนึ่งโปรไฟล์ (คืนข้อความไทย หรือ null) ----------
function moneyValidateUser(mu) {
  if (!isPlainObject(mu)) return 'ข้อมูลเงินของโปรไฟล์ผิดรูปแบบ';
  for (const k of ['categories', 'contexts', 'txns', 'debts']) if (!Array.isArray(mu[k])) return `ข้อมูลเงิน (${k}) ผิดรูปแบบ`;
  const cats = new Map(mu.categories.map(c => [c.id, c]));
  const ctxs = new Set(mu.contexts.map(c => c.id));
  const catOk = (id, kind) => cats.has(id) && cats.get(id).kind === kind;
  const tx = new Map();
  for (const t of mu.txns) {
    if (!isPlainObject(t) || typeof t.id !== 'string' || !t.id) return 'รายการเงินไม่มี id';
    if (tx.has(t.id)) return 'รายการเงินมี id ซ้ำ';
    tx.set(t.id, t);
  }
  const debts = new Map();
  for (const d of mu.debts) {
    if (!isPlainObject(d) || typeof d.id !== 'string' || !d.id || debts.has(d.id)) return 'หนี้ไม่มี id หรือ id ซ้ำ';
    debts.set(d.id, d);
    if (!DEBT_TYPES[d.type]) return `ชนิดหนี้ "${d.name}" ไม่รู้จัก`;
    if (!Array.isArray(d.anchors) || d.anchors.filter(a => a.type === 'start').length !== 1) return `หนี้ "${d.name}" ต้องมียอดตั้งต้น 1 รายการ`;
    for (const a of d.anchors) {
      if (!DEBT_ANCHOR_TYPES.includes(a.type) || !isRealDateKey(a.date) || !isSatang(a.balance)) return `ยอดอ้างอิงของหนี้ "${d.name}" ผิดรูปแบบ`;
      if (a.date < moneyDebtStart(d).date) return `ยอดอ้างอิงของหนี้ "${d.name}" ต้องไม่ก่อนวันเริ่มติดตาม`;
      if (a.type === 'close' && a.balance !== 0) return `ยอดปิดหนี้ "${d.name}" ต้องเป็น 0`;
      if (a.type === 'close' && a.waived > 0 && !String(a.note || '').trim()) return `ปิดหนี้ "${d.name}" ที่ยังเหลือยอด ต้องมีเหตุผล`;
    }
    if (d.type === 'installment' && (!catOk(d.categoryId, 'expense') || !ctxs.has(d.contextId))) return `หนี้ผ่อนสินค้า "${d.name}" ต้องมีหมวดและบริบทของสินค้า`;
  }
  for (const t of mu.txns) {
    if (!isRealDateKey(t.date)) return 'วันที่ของรายการเงินผิดรูปแบบ';
    if (!isSatang(t.amount) || t.amount === 0) return `รายการ ${formatDateTH(t.date)}: จำนวนเงินต้องมากกว่า 0`;
    const at = `รายการ ${formatDateTH(t.date)}`;
    const srcOf = id => { const s = tx.get(id); return s && s.kind === 'expense' ? s : null; };
    if (t.kind === 'expense') {
      if (!catOk(t.categoryId, 'expense') || !ctxs.has(t.contextId)) return `${at}: ไม่มีหมวดหรือบริบท`;
      if (!isSatang(t.myShare) || t.myShare > t.amount) return `${at}: ส่วนของฉันต้องอยู่ระหว่าง 0 ถึงยอดที่จ่าย`;
      if (t.debtId && !debts.has(t.debtId)) return `${at}: เงินดาวน์ผูกกับหนี้ที่ไม่มีอยู่`;
    } else if (t.kind === 'income') {
      if (!catOk(t.categoryId, 'income')) return `${at}: ไม่มีหมวดรายรับ`;
    } else if (t.kind === 'moneyBack') {
      if (t.backType !== 'refund' && t.backType !== 'reimburse') return `${at}: ชนิดเงินคืนไม่ถูกต้อง`;
      const al = Array.isArray(t.allocations) ? t.allocations : null;
      if (!al) return `${at}: การจัดสรรเงินคืนผิดรูปแบบ`;
      if (t.backType === 'refund' && al.length > 1) return `${at}: ร้านคืนผูกได้ 1 รายการ`;
      let total = 0;
      for (const a of al) {
        const src = srcOf(a.txnId);
        if (!src) return `${at}: เงินคืนผูกกับรายการที่ไม่ใช่รายจ่าย`;
        if (src.date > t.date) return `${at}: วันที่ต้องไม่ก่อนวันจ่าย (${formatDateTH(src.date)})`;
        if (t.backType === 'refund') {
          if (!isSatang(a.mine) || !isSatang(a.others)) return `${at}: จำนวนเงินคืนผิดรูปแบบ`;
          if (a.others > 0 && src.myShare === src.amount) return `${at}: รายการนี้ไม่ได้จ่ายแทนใคร จึงไม่มีส่วนของคนอื่น`;
          total += a.mine + a.others;
        } else {
          if (!isSatang(a.amount) || a.amount === 0) return `${at}: จำนวนที่จัดสรรผิดรูปแบบ`;
          total += a.amount;
        }
      }
      if (total > t.amount) return `${at}: จัดสรรเกินยอดที่ได้รับ (${formatMoney(t.amount)})`;
    } else if (t.kind === 'writeOff' || t.kind === 'payOut') {
      const src = srcOf(t.sourceTxnId);
      if (t.kind === 'writeOff') {
        if (!src) return `${at}: "ไม่ต้องคืนแล้ว" ต้องผูกกับรายจ่าย`;
        if (!catOk(t.categoryId, 'expense') || !ctxs.has(t.contextId)) return `${at}: ไม่มีหมวดหรือบริบท`;
      } else if (t.sourceTxnId != null && !src) return `${at}: คืนเงินให้คนอื่นผูกกับรายการที่ไม่ใช่รายจ่าย`;
      if (src && src.date > t.date) return `${at}: วันที่ต้องไม่ก่อนวันจ่าย (${formatDateTH(src.date)})`;
    } else if (t.kind === 'debtPayment') {
      const d = debts.get(t.debtId);
      if (!d) return `${at}: ไม่พบหนี้ที่จ่าย`;
      if (t.date < moneyDebtStart(d).date) return `${at}: วันที่จ่ายต้องไม่ก่อนวันเริ่มติดตามหนี้ (${formatDateTH(moneyDebtStart(d).date)})`;
      const parts = [t.principal, t.interest, t.fee];
      if (parts.every(v => v == null)) { /* ยังไม่แยก */ }
      else if (!parts.every(isSatang)) return `${at}: ต้องใส่ เงินต้น ดอกเบี้ย และค่าธรรมเนียม ให้ครบ (ใส่ 0 ได้)`;
      else if (t.principal + t.interest + t.fee !== t.amount) return `${at}: รวมได้ ${formatMoney(t.principal + t.interest + t.fee)} ไม่เท่ายอดจ่าย ${formatMoney(t.amount)}`;
      else if (d.interestFree && t.interest > 0) return `${at}: หนี้ 0% ไม่มีดอกเบี้ย — ใส่เป็นค่าธรรมเนียมแทน`;
    } else return 'ชนิดรายการเงินไม่รู้จัก';
  }
  // ข้ามรายการ: ยอดกับคนอื่นของแต่ละรายจ่าย
  const idx = moneyLinkIndex(mu);
  for (const e of mu.txns) {
    if (e.kind !== 'expense') continue;
    const owed = e.amount - e.myShare;
    const L = moneyLinkTotals(idx, e.id);
    const at = `รายการ ${formatDateTH(e.date)}`;
    if (L.reimbursed + L.writtenOff > owed) return `${at}: ได้รับคืนแล้ว ${formatMoney(L.reimbursed + L.writtenOff)} เกินส่วนของคนอื่น ${formatMoney(owed)} — ส่วนของฉันสูงสุดได้ ${formatMoney(e.amount - L.reimbursed - L.writtenOff)}`;
    if (L.refundOthers + L.writtenOff > owed) return `${at}: ส่วนของคนอื่นในรายการนี้มี ${formatMoney(owed - L.writtenOff)}`;
    if (L.refundMine > e.myShare + L.writtenOff) return `${at}: ส่วนของฉันคืนได้สูงสุด ${formatMoney(e.myShare + L.writtenOff)}`;
    for (const ev of (idx.get(e.id) || [])) {
      const pos = moneyPosition(idx, e, ev.date);
      // ข้อความระบุรายการที่ติด + วิธีแก้ — ห้ามลบ/ปรับรายการอื่นให้เอง
      if (ev.kind === 'writeOff' && pos < 0) return `${at}: "ไม่ต้องคืนแล้ว" วันที่ ${formatDateTH(ev.date)} เกินยอดค้างรับ ณ วันนั้น — ลดจำนวน หรือแก้รายการเงินคืนของรายการนี้ก่อน`;
      if (ev.kind === 'payOut' && pos > 0) return `${at}: คืนเงินให้คนอื่นวันที่ ${formatDateTH(ev.date)} — ต้องคืนรายการนี้ ${formatMoney(Math.max(0, ev.amount - pos))} ณ วันนั้น · ลดจำนวน หรือลงวันที่หลังวันที่ร้านคืน/คนอื่นคืน`;
      // ร้านคืนส่วนของฉันได้ไม่เกินค่าใช้จ่ายสุทธิที่ยังเหลือ ณ วันที่คืน (ส่วนของฉัน + ที่ยกให้แล้ว − ร้านคืนก่อนหน้า)
      if (ev.kind === 'refund') {
        const Lt = moneyLinkTotals(idx, e.id, ev.date);
        if (Lt.refundMine > e.myShare + Lt.writtenOff) return `${at}: ร้านคืนวันที่ ${formatDateTH(ev.date)}: ส่วนของฉันคืนได้สูงสุด ${formatMoney(e.myShare + Lt.writtenOff - (Lt.refundMine - ev.mine))} ณ วันที่คืน — ถ้าจะรวมส่วนที่ยกให้ ให้ลงวันที่ตั้งแต่วัน "ไม่ต้องคืนแล้ว"`;
      }
    }
  }
  // หนี้: จ่ายเงินต้นเกินยอดที่ยืนยัน · จ่ายหลังปิด
  for (const d of mu.debts) {
    const close = d.anchors.find(a => a.type === 'close');
    for (const p of mu.txns) {
      if (p.kind !== 'debtPayment' || p.debtId !== d.id) continue;
      if (close && p.date > close.date) return `หนี้ "${d.name}" ปิดแล้วเมื่อ ${formatDateTH(close.date)}`;
      if (p.principal == null) continue;
      const b = moneyDebtBalanceAt(mu, d, p.date);
      if (b && b.confirmed && b.balance < 0) return `หนี้ "${d.name}": เงินต้นมากกว่ายอดคงเหลือ ${formatMoney(b.balance + p.principal)}`;
    }
  }
  return null;
}

// ---------- เปลี่ยนข้อมูล (เรียกภายใน moneyCommit เท่านั้น · throw Error ข้อความไทยเมื่อผิด) ----------
function moneyUpsertTxn(mu, txn, today) {
  if (!isRealDateKey(txn.date)) throw new Error('วันที่ไม่ถูกต้อง');
  if (txn.date > today) throw new Error('วันที่ต้องไม่อยู่ในอนาคต');
  const stamp = new Date().toISOString();
  const i = mu.txns.findIndex(t => t.id === txn.id);   // id สร้างตอนเปิดฟอร์ม → กดซ้ำ = แทนที่ ไม่เพิ่ม
  if (i >= 0) mu.txns[i] = { ...txn, createdAt: mu.txns[i].createdAt, updatedAt: stamp };
  else mu.txns.push({ ...txn, createdAt: stamp, updatedAt: stamp });
}
// ผลของการลบ — ใช้ทั้งแสดงในกล่องยืนยันและลงมือลบ ให้ตรงกันเสมอ
function moneyDeleteEffects(mu, id) {
  const t = mu.txns.find(x => x.id === id);
  if (!t || t.kind !== 'expense') return [];
  const out = [];
  for (const b of mu.txns) {
    if (b.kind === 'moneyBack') {
      for (const a of (b.allocations || [])) if (a.txnId === id) {
        out.push({ type: 'unlink-back', txnId: b.id, date: b.date, backType: b.backType, amount: b.backType === 'refund' ? a.mine + a.others : a.amount });
      }
    } else if (b.kind === 'writeOff' && b.sourceTxnId === id) out.push({ type: 'delete-writeoff', txnId: b.id, date: b.date, amount: b.amount });
    else if (b.kind === 'payOut' && b.sourceTxnId === id) out.push({ type: 'unlink-payout', txnId: b.id, date: b.date, amount: b.amount });
  }
  if (t.debtId) out.push({ type: 'unlink-downpayment', debtId: t.debtId });
  return out;
}
function moneyDeleteTxn(mu, id) {
  const effects = moneyDeleteEffects(mu, id);
  const t = mu.txns.find(x => x.id === id);
  if (!t) throw new Error('ไม่พบรายการ (อาจถูกลบจากหน้าต่างอื่นแล้ว)');
  const doomed = new Set([id, ...effects.filter(e => e.type === 'delete-writeoff').map(e => e.txnId)]);
  mu.txns = mu.txns.filter(x => !doomed.has(x.id));
  for (const b of mu.txns) {
    if (b.kind === 'moneyBack') b.allocations = (b.allocations || []).filter(a => a.txnId !== id);   // เงินคืนยังอยู่ในเงินเข้า แต่ไม่ผูก
    if (b.kind === 'payOut' && b.sourceTxnId === id) b.sourceTxnId = null;
  }
  if (t.debtId) { const d = mu.debts.find(x => x.id === t.debtId); if (d && d.purchase) d.purchase.downPaymentTxnId = null; }
  return effects;
}
// เพิ่มหนี้เดิม — ยอดตั้งต้นไม่สร้างรายการเงินใด ๆ
function moneyAddDebt(mu, d, today) {
  if (mu.debts.some(x => x.id === d.id)) return;      // กดซ้ำ
  if (!DEBT_TYPES[d.type]) throw new Error('เลือกชนิดหนี้');
  if (!d.name || !String(d.name).trim()) throw new Error('ใส่ชื่อหนี้');
  if (!isRealDateKey(d.startDate) || d.startDate > today) throw new Error('วันเริ่มติดตามต้องไม่อยู่ในอนาคต');
  if (!isSatang(d.startBalance)) throw new Error('ยอดคงเหลือไม่ถูกต้อง');
  mu.debts.push({
    id: d.id, name: String(d.name).trim(), type: d.type, interestFree: !!d.interestFree,
    categoryId: d.type === 'installment' ? d.categoryId : (d.categoryId || null),
    contextId: d.type === 'installment' ? d.contextId : (d.contextId || null),
    originDate: d.originDate || null, purchase: d.purchase || null,
    installment: d.installment || null, dueDay: d.dueDay || null, note: d.note || '',
    history: [], status: 'active',
    anchors: [{ id: d.id + '_start', type: 'start', date: d.startDate, balance: d.startBalance }],
    createdAt: new Date().toISOString()
  });
}
// ซื้อผ่อนใหม่ (§5.4จ) — หนี้ + เงินดาวน์ใน commit เดียว · ราคาเต็มไม่เคยเป็นเงินออกหรือค่าใช้จ่าย
function moneyCreateInstallmentPurchase(mu, p, today) {
  if (!isSatang(p.price) || p.price === 0) throw new Error('ใส่ราคาสินค้า');
  if (!isSatang(p.down) || p.down > p.price) throw new Error('เงินดาวน์ต้องไม่เกินราคา');
  if (p.down === p.price) throw new Error('ไม่มียอดผ่อนเหลือ — บันทึกเป็นรายจ่ายปกติ');
  moneyAddDebt(mu, {
    id: p.debtId, name: p.name, type: 'installment', interestFree: p.interestFree, categoryId: p.categoryId, contextId: p.contextId,
    startDate: p.date, startBalance: p.price - p.down, originDate: p.date,
    purchase: { price: p.price, downPaymentTxnId: p.down > 0 ? p.downTxnId : null },
    installment: p.installment, dueDay: p.dueDay, note: p.note
  }, today);
  if (p.down > 0) {
    moneyUpsertTxn(mu, {
      id: p.downTxnId, kind: 'expense', date: p.date, amount: p.down, myShare: p.down,
      categoryId: p.categoryId, contextId: p.contextId, debtId: p.debtId, note: 'เงินดาวน์ ' + String(p.name).trim()
    }, today);
  }
}
// ใบแจ้ง / ปรับยอด — มีประวัติ ไม่สร้างเงินสด
function moneyAddDebtAnchor(mu, debtId, a, today) {
  const d = mu.debts.find(x => x.id === debtId);
  if (!d) throw new Error('ไม่พบหนี้');
  if (a.type !== 'statement' && a.type !== 'adjust') throw new Error('ชนิดยอดอ้างอิงไม่ถูกต้อง');
  if (!isRealDateKey(a.date) || a.date > today) throw new Error('วันที่ต้องไม่อยู่ในอนาคต');
  if (d.anchors.some(x => x.id === a.id)) return;
  d.anchors.push({ id: a.id, type: a.type, date: a.date, balance: a.balance, note: a.note || '' });
}
// ปิดหนี้ — ต้องยืนยันยอดก่อน · ยอดเหลือ 0 (จ่ายครบ) ปิดได้เลย · ยังเหลือยอด → ต้องมีเหตุผล (เช่นส่วนลดปิดก่อนกำหนด)
// ยอดที่ปรับเป็น 0 เก็บเป็น waived + เหตุผลในประวัติ — ไม่ใช่เงินสด ไม่ใช่ค่าใช้จ่าย · ห้ามทำให้ยอดหายโดยไม่มีรายการอธิบาย
function moneyCloseDebt(mu, debtId, date, today, reason) {

function moneyInstallmentDupWarning(mu, exp) {
  for (const d of mu.debts) {
    if (d.type !== 'installment' || d.status !== 'active' || !d.installment) continue;
    if (d.categoryId !== exp.categoryId || d.installment !== exp.amount) continue;
    if (d.dueDay) {
      const [y, m] = exp.date.split('-').map(Number);
      const near = [-1, 0, 1].some(k => {

// ---------- ที่เก็บ: IndexedDB (DEC-005) ----------
// อ่าน-ตรวจ-เขียนอยู่ใน readwrite transaction เดียว — เบราว์เซอร์จัดคิว transaction ที่ทับกันให้ทีละอัน ข้ามทุกแท็บ
// จึงไม่มีช่องว่างระหว่างการตรวจ revision กับการเขียน · ผลลัพธ์ส่งกลับหลัง oncomplete (เขียนลงจริงแล้ว) เท่านั้น
function moneyIdbBackend() {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('เบราว์เซอร์นี้ไม่รองรับ IndexedDB'));
    const req = indexedDB.open(MONEY_DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(MONEY_DB_STORE)) db.createObjectStore(MONEY_DB_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => { const db = req.result; db.onversionchange = () => { db.close(); dbp = null; }; resolve(db); };
    req.onerror = () => { dbp = null; reject(req.error); };
  }));
  return {
    async readRaw() {
      const db = await withDbTimeout(open());
      return new Promise((resolve, reject) => {
        const g = db.transaction(MONEY_DB_STORE, 'readonly').objectStore(MONEY_DB_STORE).get(MONEY_DB_KEY);
        g.onsuccess = () => resolve(g.result ? g.result.json : null);
        g.onerror = () => reject(g.error);
      });
    },
    // fn(raw) → { result, write? } · write: string = แทนที่ · null = ลบ · ไม่ระบุ = ไม่เขียน
    async transact(fn) {
      const db = await withDbTimeout(open());
      return new Promise((resolve, reject) => {
        const tx = db.transaction(MONEY_DB_STORE, 'readwrite');
        const st = tx.objectStore(MONEY_DB_STORE);
        let out, thrown = null;
        const g = st.get(MONEY_DB_KEY);
        g.onsuccess = () => {
          try {
            const step = fn(g.result ? g.result.json : null);
            out = step.result;
            if (step.write === null) st.delete(MONEY_DB_KEY);
            else if (typeof step.write === 'string') st.put({ id: MONEY_DB_KEY, json: step.write });
          } catch (e) { thrown = e; tx.abort(); }
        };
        tx.oncomplete = () => resolve(out);
        tx.onabort = () => reject(thrown || tx.error || new Error('ยกเลิกการบันทึก'));
      });
    }
  };
}
let _moneyBackend = null;
function moneyBackend() { return _moneyBackend || (_moneyBackend = moneyIdbBackend()); }
// throw เมื่ออ่านไม่ได้ — ผู้เรียกต้องหยุด ห้ามถือว่า "ไม่มีข้อมูลเงิน"
function moneyReadRaw() { return moneyBackend().readRaw(); }
function moneyWriteRaw(raw) { return moneyBackend().transact(() => ({ write: raw, result: true })); }

let _money = null;            // สำเนาล่าสุดที่แท็บนี้อ่าน/เขียนสำเร็จ
let _moneyStamp = null;       // instance:revision ของสำเนานั้น — ใช้จับว่าแท็บอื่นบันทึกก่อน
function moneyStampOf(d) { return d ? (d.instance || '') + ':' + (d.revision || 0) : ':0'; }
function moneyParse(raw) {
  if (raw == null) return { ok: true, data: moneyEmpty() };
  let d;
  try { d = JSON.parse(raw); } catch { return { ok: false, reason: 'corrupt', error: 'ข้อมูลเงินในเครื่องเสียหาย' }; }
  const err = validateMoneySection(d);
  return err ? { ok: false, reason: 'corrupt', error: err } : { ok: true, data: d };
}
async function moneyLoad() {
  let raw;
  try { raw = await moneyReadRaw(); } catch (e) { return { ok: false, reason: 'read-failed', error: e && e.dbBlocked ? e.message : 'อ่านข้อมูลเงินไม่ได้' }; }
  const p = moneyParse(raw);
  if (!p.ok) { _money = null; _moneyStamp = null; return p; }
  _money = p.data;
  _moneyStamp = moneyStampOf(raw == null ? null : p.data);
  return { ok: true, data: p.data };
}
// ผลลัพธ์: { ok:true, data, result } หรือ { ok:false, reason, error } โดย reason =
//   'restored-elsewhere' แท็บอื่นกู้คืนข้อมูล → ต้องโหลดหน้าใหม่ · 'stale' แท็บอื่นบันทึกก่อน → โหลดข้อมูลใหม่แล้ว ให้ผู้ใช้กดอีกครั้ง
//   'invalid' ผิดกติกา · 'write-failed' เขียนไม่สำเร็จ · 'corrupt' / 'read-failed'
// ไม่สำเร็จทุกกรณี: ที่เก็บไม่เปลี่ยน และ _money ไม่มีข้อมูลที่ไม่ได้บันทึก
// opts.ignoreStale — ใช้กับการเปลี่ยนที่ไม่อิงข้อมูลที่แท็บนี้แสดงอยู่ (เช่นลบข้อมูลเงินทั้งโปรไฟล์) · ยังเป็น transaction เดียว
async function moneyCommit(mutate, opts) {
  if (restoreEpochChangedElsewhere()) return { ok: false, reason: 'restored-elsewhere', error: 'มีการนำเข้าข้อมูลจากหน้าต่างอื่น — กำลังโหลดใหม่' };
  if (_moneyStamp === null) { const l = await moneyLoad(); if (!l.ok) return l; }
  const expect = _moneyStamp;
  let out;
  try {
    out = await moneyBackend().transact(raw => {
      const p = moneyParse(raw);
      if (!p.ok) return { result: p };
      const cur = p.data;
      if (!(opts && opts.ignoreStale) && moneyStampOf(raw == null ? null : cur) !== expect) {
        return { result: { ok: false, reason: 'stale', error: 'มีการแก้จากหน้าต่างอื่น ตรวจแล้วกดบันทึกอีกครั้ง', fresh: cur, freshStamp: moneyStampOf(raw == null ? null : cur) } };
      }
      const next = JSON.parse(JSON.stringify(cur));
      let result;
      try { result = mutate(next); } catch (e) { return { result: { ok: false, reason: 'invalid', error: String(e && e.message || e) } }; }
      next.schemaVersion = MONEY_SCHEMA_VERSION;
      next.instance = cur.instance || ('m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
      next.revision = (cur.revision || 0) + 1;
      const err = validateMoneySection(next);
      if (err) return { result: { ok: false, reason: 'invalid', error: err } };
      return { write: JSON.stringify(next), result: { ok: true, data: next, result } };
    });
  } catch (e) {
    return { ok: false, reason: 'write-failed', error: e && e.dbBlocked ? 'บันทึกไม่สำเร็จ — ' + e.message : 'บันทึกไม่สำเร็จ — ข้อมูลยังไม่ถูกเก็บ (' + String(e && (e.name || e.message) || e) + ')' };
  }
  if (out.ok) { _money = out.data; _moneyStamp = moneyStampOf(out.data); }
  else if (out.reason === 'stale') { _money = out.fresh; _moneyStamp = out.freshStamp; delete out.fresh; delete out.freshStamp; }
  return out;
}

  return moneyCommit(d => { const removed = d.byUser[uid] || null; delete d.byUser[uid]; return removed; }, { ignoreStale: true });

  return moneyCommit(d => { d.byUser[uid] = mu; }, { ignoreStale: true });

      ${showKindSeg ? `

// อ่านค่าที่พิมพ์ล่าสุดจากทุกช่องของฟอร์ม (กรณี event input ยังไม่มา) — ไม่ให้ข้อมูลที่กรอกหาย
function moneyFormSync() {
  const f = state.tmp.mf;
  if (!f) return;
  const a = document.getElementById('mf-amount'); if (a) f.amountText = a.value;
  const n = document.getElementById('mf-note'); if (n) f.note = n.value;
  const d = document.getElementById('mf-date'); if (d && isRealDateKey(d.value)) f.date = d.value;
  document.querySelectorAll('[data-mf]').forEach(el => { f[el.dataset.mf] = el.value; });
}
const moneyAmountText = satang => satang == null ? '' : String(satang / 100);
async function moneyFormSave(more) {
  const f = state.tmp.mf;
  if (!f || f.saving) return;
  moneyFormSync();
  const mu = moneyMU();
  const today = todayKey();
  const uidNow = state.currentUserId;
  f.error = '';
  const fail = msg => { f.error = msg; render(); };
  if (!isRealDateKey(f.date) || f.date > today) return fail('วันที่ต้องไม่อยู่ในอนาคต');
  let mutate;
  // ---- ซื้อแบบผ่อน: หนี้ + เงินดาวน์ใน commit เดียว ----
  if (f.kind === 'expense' && f.instOpen) {
    const price = parseMoneyInput(f.priceText), down = (f.downText || '').trim() ? parseMoneyInput(f.downText) : 0;
    const inst = (f.instAmtText || '').trim() ? parseMoneyInput(f.instAmtText) : null;
    if (!price) return fail('ใส่ราคาเต็ม');
    if (down == null || down >= price) return fail('เงินดาวน์ต้องน้อยกว่าราคาเต็ม (ถ้าจ่ายครบให้บันทึกเป็นรายจ่ายปกติ)');
    if (!f.categoryId) return fail('เลือกหมวดของสินค้า');
    if (!(f.instName || '').trim()) return fail('ใส่ชื่อหนี้ เช่น ทีวี');
    if ((f.instAmtText || '').trim() && !inst) return fail('ยอดงวดไม่ถูกต้อง');
    const p = { debtId: f.debtNewId, downTxnId: f.id, name: f.instName, date: f.date, price, down, categoryId: f.categoryId, contextId: f.contextId || MONEY_SELF_CTX, interestFree: !!f.instFree, installment: inst, note: f.note.trim() };
    mutate = d => moneyCreateInstallmentPurchase(moneyUser(d, uidNow), p, today);
  } else if (f.kind === 'debtPayment') {
    const amount = parseMoneyInput(f.amountText);
    if (!amount) return fail('ใส่ยอดที่จ่าย');
    const debt = mu.debts.find(d => d.id === f.debtId);
    if (!debt) return fail('เลือกหนี้ที่จ่าย');
    let principal = null, interest = null, fee = null;
    const ptxt = (f.principalText || '').trim();
    if (debt.interestFree ? ptxt !== '' : f.splitOpen) {
      principal = parseMoneyInput(ptxt || '0'); interest = debt.interestFree ? 0 : parseMoneyInput((f.interestText || '').trim() || '0'); fee = parseMoneyInput((f.feeText || '').trim() || '0');
      if (principal == null || interest == null || fee == null) return fail('ตัวเลขเงินต้น/ดอกเบี้ย/ค่าธรรมเนียมไม่ถูกต้อง');
      if (principal + interest + fee !== amount) return fail(`เงินต้น + ดอกเบี้ย + ค่าธรรมเนียม = ${formatMoney(principal + interest + fee)} ไม่เท่ายอดจ่าย ${formatMoney(amount)}`);
    }
    const txn = { id: f.id, kind: 'debtPayment', date: f.date, debtId: debt.id, amount, principal, interest, fee, note: f.note.trim() };
    // แก้งวดเดิมที่ทำให้รายงานช่วงก่อนเปลี่ยน → บอกผลก่อนบันทึก (C2)
    if (f.editing) {
      const after = JSON.parse(JSON.stringify(mu));
      const i = after.txns.findIndex(t => t.id === f.id); if (i >= 0) after.txns[i] = { ...after.txns[i], ...txn };
      const delta = moneyMonthlyDelta(mu, after).filter(m => m.month !== today.slice(0, 7));
      if (delta.length && !confirm('การแก้นี้เปลี่ยนรายงานเดือนก่อน:\n' + delta.map(m => `• ${m.month}: ค่าใช้จ่ายของฉัน ${m.delta > 0 ? '+' : '−'}${formatMoney(Math.abs(m.delta))}`).join('\n') + '\n\nบันทึก?')) return;
    }
    mutate = d => { const m = moneyUser(d, uidNow); if (f.editing && !m.txns.some(t => t.id === f.id)) throw new Error('รายการนี้ถูกลบจากหน้าต่างอื่นแล้ว'); moneyUpsertTxn(m, txn, today); };
  } else {
    const amount = parseMoneyInput(f.amountText);
    if (!amount) return fail('ใส่จำนวนเงิน เช่น 60 หรือ 1,200.50');
    if (!f.categoryId) return fail('เลือกหมวด');
    let txn;
    if (f.kind === 'expense') {
      let myShare = amount;
      if (f.shareOpen) {
        myShare = parseMoneyInput((f.myShareText || '').trim());
        if (myShare == null || myShare > amount) return fail('ส่วนของฉันต้องอยู่ระหว่าง 0 ถึงยอดที่จ่าย');
      }
      txn = { id: f.id, kind: 'expense', date: f.date, amount, myShare, categoryId: f.categoryId, contextId: f.contextId || MONEY_SELF_CTX, note: f.note.trim() };
      if (f.shareOpen && (f.owedBy || '').trim()) txn.owedBy = f.owedBy.trim();
      if (f.original && f.original.debtId) txn.debtId = f.original.debtId;
      // บันทึกงวดผ่อนเป็นรายจ่ายซ้ำ? เตือน ไม่บล็อก
      const dup = !f.editing && moneyInstallmentDupWarning(mu, txn);
      if (dup && !confirm(`รายการนี้เหมือนงวดของ "${dup.name}" — ถ้าเป็นการจ่ายงวด ให้บันทึกที่ "จ่ายหนี้" แทน (ไม่งั้นจะนับซ้ำ)\n\nบันทึกเป็นรายจ่ายต่อไหม?`)) return;
    } else {
      txn = { id: f.id, kind: 'income', date: f.date, amount, categoryId: f.categoryId, note: f.note.trim() };
    }
    mutate = d => { const m = moneyUser(d, uidNow); if (f.editing && !m.txns.some(t => t.id === f.id)) throw new Error('รายการนี้ถูกลบจากหน้าต่างอื่นแล้ว'); moneyUpsertTxn(m, txn, today); };
  }
  f.saving = true;
  render();
  const r = await moneySave(mutate);
  f.saving = false;
  if (!r.ok) {
    f.error = r.reason === 'stale' ? 'มีการแก้จากหน้าต่างอื่น ข้อมูลล่าสุดโหลดแล้ว — ตรวจแล้วกดบันทึกอีกครั้ง' : (r.error || 'บันทึกไม่สำเร็จ — ข้อมูลยังไม่ถูกเก็บ');
    return render();
  }
  if (more) {
    state.tmp.mf = moneyNewForm({ ...f, batchCount: f.batchCount + 1 });
    render();
    document.getElementById('mf-amount')?.focus();
    return;
  }
  toast(f.instOpen ? 'บันทึกการซื้อผ่อนแล้ว' : f.editing ? 'บันทึกการแก้ไขแล้ว' : 'บันทึกแล้ว');
  back();
}

async function moneyFxSave(mutate, okMsg) {
  const fx = state.tmp.fx;
  if (!fx || fx.saving) return false;
  document.querySelectorAll('[data-fx]').forEach(el => { fx[el.dataset.fx] = el.value; });
  fx.saving = true; fx.error = ''; render();
  const uidNow = state.currentUserId;
  let r;
  // แก้รายการเดิม: ใช้ id เดิมใน commit เดียว (แทนที่ทั้งรายการ ไม่ลบแล้วสร้างใหม่) · ถูกลบจากหน้าต่างอื่นแล้ว = ไม่สร้างกลับมาเงียบ ๆ
  try { r = await moneySave(d => { const mu = moneyUser(d, uidNow); if (fx.editing && !mu.txns.some(t => t.id === fx.id)) throw new Error('รายการนี้ถูกลบจากหน้าต่างอื่นแล้ว'); return mutate(mu, todayKey()); }); }
  catch (e) { r = { ok: false, error: String(e && e.message || e) }; }
  fx.saving = false;
  if (!r.ok) {
    fx.error = r.reason === 'stale' ? 'มีการแก้จากหน้าต่างอื่น ข้อมูลล่าสุดโหลดแล้ว — ตรวจแล้วกดบันทึกอีกครั้ง' : (r.error || 'บันทึกไม่สำเร็จ — ข้อมูลยังไม่ถูกเก็บ');
    render();
    return false;
  }
  if (okMsg) toast(okMsg);
  return true;
}

function csvEscape(v) {
  if (v == null) return '';

  return s;

function buildCSV(userId, startKey, endKey) {
  const user = state.users.find(u => u.id === userId);

  // for anyone (or any AI) summing this file. Optional-nutrient cells are EMPTY when the
  // value is unknown — never 0 (DEC-004 rule 1).
  const rows = [['วันที่','ประเภทแถว','ชื่ออาหาร','จำนวน','ขนาด (%)','แคลอรี่','โปรตีน(g)','คาร์บ(g)','น้ำตาล(g)','ไขมัน(g)','ไขมันอิ่มตัว(g)','ใยอาหาร(g)','แอลกอฮอล์(g)','น้ำหนัก(kg)']];

  const allDates = Object.keys(byDate).filter(d => d >= startKey && d <= endKey).sort();
  allDates.forEach(d => {
    const entries = byDate[d] || [];
    entries.forEach(e => {
      const m = e.snapshot || findMeal(e.mealId);
      const t = calcEntryTotals(e);

      const ad = calcAddonTotals(e);

      const qty = e.quantity || 1;
      rows.push([d, 'รายการ', baseName, qty, e.sizePct || 100,
        Math.round(t.calories - ad.calories),
        (t.protein_g - ad.protein_g).toFixed(1),
        (t.carbs_g - ad.carbs_g).toFixed(1),
        (t.sugar_g - ad.sugar_g).toFixed(1),
        (t.fat_g - ad.fat_g).toFixed(1),
        ...OPTIONAL_NUTRIENTS.map(k => optCell(t[k] == null || ad[k] == null ? null : t[k] - ad[k])),
        '']);
      (e.addons || []).forEach(a => {
        const id = typeof a === 'string' ? a : a.id;
        const count = typeof a === 'string' ? 1 : (a.count || 0);
        if (!count) return;
        const addon = ADDONS.find(x => x.id === id);
        if (!addon) return;
        rows.push([d, 'ส่วนเสริม', `  + ${addon.name}`, count, '-',

          (addon.fat_g * count).toFixed(1),

      daySum.carbs_g.toFixed(1), daySum.sugar_g.toFixed(1), daySum.fat_g.toFixed(1),
      ...OPTIONAL_NUTRIENTS.map(k => (dayOpt[k].covered === 0 ? '' : dayOpt[k].g.toFixed(1))),

    if (OPTIONAL_NUTRIENTS.some(k => dayOpt[k].covered > 0)) {

        ...OPTIONAL_NUTRIENTS.map(k => dayOpt[k].coveredPct.toFixed(0)),

  (user?.weights || []).forEach(w => {
    if (w.date >= startKey && w.date <= endKey && !allDates.includes(w.date)) {
      rows.push([w.date, 'ชั่งน้ำหนัก', '(ชั่งน้ำหนัก)', '-', '-', '-', '-', '-', '-', '-', '', '', '', w.weight_kg.toFixed(1)]);
    }
  });
  const body = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  return '\uFEFF' + body;
}
function downloadCSV(days) {
  const u = currentUser();
  if (!u) return;
  const end = todayKey();
  const start = days ? dateToKey(addDays(new Date(), -(days - 1))) : '0000-01-01';
  const csv = buildCSV(u.id, start, end);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const safeName = (u.name || 'user').replace(/[^\w\u0E00-\u0E7F-]/g, '_');
  const a = document.createElement('a');
  a.href = url;
  const prefix = days ? `${start}_to_${end}` : `all_to_${end}`;
  a.download = `pracal_${safeName}_${prefix}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('ดาวน์โหลดแล้ว ✅');
}

/* ========== LOGGING ========== */
function addLogEntry(entry, dateKey = todayKey()) {
  if (!state.logs[state.currentUserId]) state.logs[state.currentUserId] = {};
  if (!state.logs[state.currentUserId][dateKey]) state.logs[state.currentUserId][dateKey] = [];
  const u = currentUser();
  const beforeSnap = u ? streaksSnapshot(u) : null;
  if (u && dateKey === todayKey()) {
    if (autoFreezeIfPossible(u)) {
      setTimeout(() => toast('🛡️ ใช้ freeze token รักษา streak'), 200);
    }
  }
  entry.id = entry.id || uid('e');
  entry.dateKey = dateKey;
  entry.loggedAt = Date.now();
  // v1.10.0 — tag new entries with nutrition data version (old entries stay unchanged)
  if (!entry.nutrition_version) entry.nutrition_version = 'v1.10.0';
  state.logs[state.currentUserId][dateKey].push(entry);
  if (u && beforeSnap) checkAndCelebrateMilestones(u, beforeSnap);
  persist();
}
function deleteLogEntry(entryId, dateKey = todayKey()) {
  const arr = (state.logs[state.currentUserId] || {})[dateKey];
  if (!arr) return;
  const idx = arr.findIndex(e => e.id === entryId);
  if (idx >= 0) { arr.splice(idx, 1); persist(); }
}
function updateLogEntry(entryId, patch, dateKey = todayKey()) {
  const arr = (state.logs[state.currentUserId] || {})[dateKey];
  if (!arr) return;
  const e = arr.find(x => x.id === entryId);
  if (e) { Object.assign(e, patch); persist(); }
}

/* ========== NAV ========== */
function go(view, data) {
  if (state.view !== 'loading') state.stack.push({ view: state.view, tmp: { ...state.tmp } });
  state.view = view;
  state.tmp = data || {};
  state.modal = null;
  render();
  window.scrollTo(0, 0);
}
function replace(view, data) {
  state.view = view;
  state.tmp = data || {};
  state.modal = null;
  render();
  window.scrollTo(0, 0);
}
function back() {
  const prev = state.stack.pop();
  if (prev) { state.view = prev.view; state.tmp = prev.tmp || {}; }
  else { state.view = 'dashboard'; state.tmp = {}; }
  state.modal = null;
  render();
}
function goHome() {
  state.stack = [];
  state.view = 'dashboard';
  state.tmp = {};
  state.modal = null;
  render();
}

    case 6: return renderOnbTips();
    default: return renderOnbWelcome();
  }
}

function weeklyStripHtml(user, baseTarget) {
  const agg = weekAggregate(user.id);
  const today = todayKey();
  const goalAdj = effectiveGoalAdjust(user);
  const goalCat = goalCategory(user);

  // Per-day bar: height = eaten/dayBudget %, color = goal-aware zone
  const bars = agg.days.map(d => {
    const dayBudget = baseTarget + d.exerciseBurn;
    const pct = d.logged && dayBudget ? (d.totals.calories / dayBudget) * 100 : 0;
    let cls = '';
    if (d.logged) {
      // Map goalDelta into the same zones the dashboard ring uses
      if (goalCat === 'lose') {
        if (d.goalDelta < -500)      cls = 'low';   // way under (warning)
        else if (d.goalDelta < -150) cls = 'ok';    // bonus deficit
        else if (d.goalDelta < 150)  cls = 'ok';    // on goal
        else if (d.goalDelta < 400)  cls = 'warn';  // a bit over
        else                          cls = 'over';  // way over
      } else if (goalCat === 'gain') {
        if (d.goalDelta < -300)      cls = 'warn';  // not enough
        else if (d.goalDelta < -100) cls = 'warn';  // close
        else if (d.goalDelta < 200)  cls = 'ok';    // on goal
        else if (d.goalDelta < 500)  cls = 'warn';  // slight over
        else                          cls = 'over';  // way over
      } else {
        if (d.goalDelta < -400)      cls = 'low';
        else if (d.goalDelta < -150) cls = 'ok';
        else if (d.goalDelta < 150)  cls = 'ok';
        else if (d.goalDelta < 400)  cls = 'warn';
        else                          cls = 'over';
      }
    }
    const h = Math.min(100, Math.max(d.logged ? 4 : 0, pct));
    const date = keyToDate(d.key);
    const dow = DOW[date.getDay()];
    const isToday = d.key === today;
    return `
      <div class="week-bar ${isToday ? 'today' : ''}" data-act="view-history-day" data-v="${d.key}">
        <div class="day">${dow}</div>
        <div class="col"><i class="${cls}" style="height:${h.toFixed(1)}%"></i></div>
        <div class="num">${d.logged ? fmt(d.totals.calories / 100, 0) + '' : '·'}</div>
      </div>
    `;
  }).join('');

  // Avg context: compare avg energyDelta vs goalAdj (i.e., avg.goalDelta)
  // 30-day projection from avg energy delta (true delta, includes exercise)
  const avgGoalDelta = agg.avg.goalDelta;
  const avgEnergyDelta = agg.avg.energyDelta;
  const projKg = agg.loggedCount > 0 ? (avgEnergyDelta * 30) / KCAL_PER_KG_FAT : 0;
  let contextMsg = '';
  if (agg.loggedCount === 0) {
    contextMsg = 'ยังไม่มีข้อมูลสัปดาห์นี้';
  } else if (goalCat === 'lose') {
    if (avgGoalDelta < -500)      contextMsg = `⚠️ ขาดดุลเยอะเกินไป · คาด ${projKg.toFixed(1)} kg ใน 30 วัน`;
    else if (avgGoalDelta < -150) contextMsg = `💪 ขาดดุลเกินเป้า — bonus · คาด ${projKg.toFixed(1)} kg ใน 30 วัน`;
    else if (avgGoalDelta < 150)  contextMsg = `🎯 ตามเป้าเป๊ะ · คาด ${projKg.toFixed(1)} kg ใน 30 วัน`;
    else if (avgGoalDelta < 400)  contextMsg = `กินเกินแผนนิด ๆ · คาด ${projKg > 0 ? '+' : ''}${projKg.toFixed(1)} kg ใน 30 วัน`;
    else                           contextMsg = `⚠️ กินเกินแผนเยอะ · คาด +${Math.abs(projKg).toFixed(1)} kg ใน 30 วัน`;
  } else if (goalCat === 'gain') {
    if (avgGoalDelta < -300)      contextMsg = `⚠️ ยังกินไม่ถึง surplus · เพิ่มอีก ${fmt(-avgGoalDelta)} kcal/วัน`;
    else if (avgGoalDelta < -100) contextMsg = `เกือบถึงเป้า surplus`;
    else if (avgGoalDelta < 200)  contextMsg = `💪 ตามเป้าเพิ่มกล้าม · คาด +${Math.abs(projKg).toFixed(1)} kg ใน 30 วัน`;
    else if (avgGoalDelta < 500)  contextMsg = `กินเกินเป้า — ระวังไขมัน · +${Math.abs(projKg).toFixed(1)} kg ใน 30 วัน`;
    else                           contextMsg = `⚠️ กินเยอะเกินเป้ามาก · +${Math.abs(projKg).toFixed(1)} kg ใน 30 วัน`;
  } else {
    if (Math.abs(avgGoalDelta) < 150) contextMsg = '⚖️ สมดุลดี รักษาน้ำหนักได้';
    else if (avgGoalDelta < 0)        contextMsg = `ขาดดุล · คาด ${projKg.toFixed(1)} kg ใน 30 วัน`;
    else                               contextMsg = `เกินสมดุล · คาด +${Math.abs(projKg).toFixed(1)} kg ใน 30 วัน`;
  }

  // Avg row: show eaten + (if any exercise) the dynamic budget context
  const avgEx = Math.round(agg.avg.exerciseBurn);
  const avgDeltaStr = avgEnergyDelta === 0 ? '0' : (avgEnergyDelta < 0 ? '−' : '+') + fmt(Math.abs(avgEnergyDelta));
  const avgDeltaColor = avgEnergyDelta < 0 ? 'var(--green)' : avgEnergyDelta > 0 ? 'var(--amber)' : 'var(--ink)';

  return `
    <div class="card">
      <div class="row between" style="margin-bottom:4px">
        <h3 style="margin:0;font-size:16px">📅 7 วันล่าสุด</h3>
        <span class="muted" style="font-size:12px">บันทึก ${agg.loggedCount}/7</span>
      </div>
      <div class="week-strip">${bars}</div>
      <div style="font-size:13px;line-height:1.7">
        <div class="row between"><span class="muted">กินเฉลี่ย</span><b>${fmt(agg.avg.calories)} kcal/วัน</b></div>
        ${avgEx > 0 ? `<div class="row between"><span class="muted">ออกกำลังเฉลี่ย</span><b>+${fmt(avgEx)} kcal/วัน</b></div>` : ''}
        <div class="row between"><span class="muted">ส่วนต่างเฉลี่ย</span><b style="color:${avgDeltaColor}">${avgDeltaStr} kcal/วัน</b></div>
        <div class="hint" style="font-size:13px;color:var(--ink-2);margin-top:4px">💡 ${contextMsg}</div>
      </div>
    </div>
  `;
}

function goalSliderHtml(currentAdjust, actName, profile) {
  const adj = typeof currentAdjust === 'number' ? currentAdjust : 0;
  let category, hintCls, hintText;
  const elderly = profile && isElderly(profile);
  if (elderly && adj < -300) {
    category = '👵 ลดน้ำหนัก (โหมดสูงวัย)'; hintCls = 'warn'; hintText = `⚠️ จำกัด deficit ที่ -300 (อายุ ${effectiveAge(profile)}+)`;
  } else if (adj <= -500) {
    category = '📉 ลดน้ำหนักเร็ว'; hintCls = 'danger'; hintText = '⚠️ ลดเร็วเกินไป — เสี่ยงเสียกล้ามเนื้อ';
  } else if (adj <= -300) {
    category = '📉 ลดน้ำหนัก'; hintCls = 'safe'; hintText = '✓ ลดปลอดภัย ~0.5 kg/สัปดาห์';
  } else if (adj < 100) {
    category = '⚖️ คงน้ำหนัก'; hintCls = 'neutral'; hintText = 'รักษาน้ำหนักปัจจุบัน';
  } else if (adj <= 400) {
    category = '📈 เพิ่มกล้ามเนื้อ (lean bulk)'; hintCls = 'safe'; hintText = '✓ เพิ่มกล้ามแบบไม่อ้วน ~0.5 kg/สัปดาห์';
  } else {
    category = '📈 เพิ่มน้ำหนักเร็ว'; hintCls = 'danger'; hintText = '⚠️ เพิ่มเร็วเกินไป — อาจได้ไขมันเยอะ';
  }
  const sign = adj > 0 ? '+' : '';
  // Floor preview
  let floorWarn = '';
  if (profile && profile.weight && profile.height && profile.age) {
    const tdee = calcTDEE(profile);
    const beforeFloor = tdee + adj;
    const floor = calorieFloor(profile);
    const actualTarget = defaultCalorieTarget({ ...profile, goalAdjust: adj });
    if (actualTarget > beforeFloor + 5) {
      floorWarn = `<div class="callout" style="background:var(--red-soft);color:var(--red);font-size:13px;margin-top:8px">⚠️ ต่ำกว่า ${fmt(floor)} kcal เสี่ยงสุขภาพ — ระบบปรับขึ้นเป็น <b>${fmt(actualTarget)}</b><br>แนะนำ: เพิ่มออกกำลังแทนลดแคล</div>`;
    }
  }
  return `
    <div class="goal-slider-wrap">
      <div class="label">${h(category)}</div>
      <div style="text-align:center;font-size:14px;color:var(--ink-2)">ปรับแคลจาก TDEE: <span class="num">${sign}${adj}</span> kcal/วัน</div>
      <input type="range" id="${actName}" min="-700" max="700" step="50" value="${adj}">
      <div class="ticks">
        <span>-700</span><span>-400</span><span>0</span><span>+400</span><span>+700</span>
      </div>
      <div class="hint-line ${hintCls}">${h(hintText)}</div>
      ${floorWarn}
    </div>
  `;
}

function renderDashboard() {
  const u = currentUser();
  if (!u) return '';
  const entries = todayEntries();
  const totals = sumEntries(entries);
  const baseTarget = effectiveCalorieTarget(u.id);
  const protTarget = effectiveProteinTarget(u.id);
  const sugarLimit = SUGAR_DAILY_LIMIT_G;
  const incExercise = activityIncludesExercise(u);
  const allowsLogging = !incExercise;
  const burned = allowsLogging ? sumActivitiesBurn(u.id) : 0;
  const tdee = calcTDEE(u);
  const goalAdj = effectiveGoalAdjust(u);

  // Goal-aware ring evaluation — handles all goal types (loss/gain/maintain)
  // and adjusts target up by today's exercise burn.
  const zone = goalZoneEval({
    eaten: totals.calories,
    baseTarget,
    exerciseBurn: burned,
    goalAdj,
    tdee
  });
  const totalDailyBurn = zone.totalBurn;
  const energyDelta = zone.energyDelta;
  const carbsTarget = Math.round(baseTarget * 0.5 / 4);

  const protPct = protTarget ? Math.min(100, (totals.protein_g / protTarget) * 100) : 0;
  const protRemain = protTarget - totals.protein_g;
  const carbsPct = carbsTarget ? Math.min(100, (totals.carbs_g / carbsTarget) * 100) : 0;
  const sugarPct = Math.min(100, (totals.sugar_g / sugarLimit) * 100);
  const sugarCls = totals.sugar_g > sugarLimit ? 'over' : totals.sugar_g > sugarLimit * 0.6 ? 'warn' : 'ok';

  const ringC = 2 * Math.PI * 58;
  const ringOffset = ringC - (Math.min(100, zone.ringPct) / 100) * ringC;

  // Status card background + accent — soft tint matching the zone color
  const statusBg = zone.zone === 'win' || zone.zone === 'extra'
    ? 'var(--green-soft)'
    : zone.zone === 'danger-low' || zone.zone === 'danger-high'
      ? 'var(--red-soft)'
      : 'var(--amber-soft)';

  return `
    <div class="screen">
      <div class="header">
        <button class="icon-btn" data-act="nav-users" aria-label="สลับผู้ใช้" title="สลับผู้ใช้" style="padding:6px">

        </button>
        <div style="flex:1">
          <h1 style="margin:0;font-size:20px">สวัสดี ${h(u.name)}</h1>
          <div class="sub">${formatDateTH(todayKey())}</div>
        </div>
        <button class="icon-btn" data-act="nav-settings" aria-label="ตั้งค่า">⚙️</button>
      </div>

      <div class="card">
        <div class="ring-wrap">
          <div class="ring zone-${zone.zone}${zone.pulse ? ' pulse' : ''}" aria-label="แคลอรี่วันนี้">
            <svg width="140" height="140" viewBox="0 0 140 140">
              <circle cx="70" cy="70" r="58" fill="none" stroke="var(--bg-2)" stroke-width="14"/>
              <circle cx="70" cy="70" r="58" fill="none" stroke="${zone.ringColor}" stroke-width="14"
                stroke-dasharray="${ringC.toFixed(2)}" stroke-dashoffset="${ringOffset.toFixed(2)}"
                stroke-linecap="round"/>
            </svg>
            <div class="num">
              <b>${fmt(totals.calories)}</b>
              <small>/ ${fmt(zone.effective)} kcal</small>
            </div>
          </div>
          <div class="ring-labels" style="font-size:13px;line-height:1.7">
            <div><span class="muted">🔥 เผา</span> <b>${fmt(totalDailyBurn)}</b>${burned > 0 ? ` <span style="color:var(--muted);font-size:12px">(+${fmt(burned)} ออกกำลัง)</span>` : ''}</div>
            <div><span class="muted">🍽️ กิน</span> <b>${fmt(totals.calories)}</b></div>
            <div style="margin-top:5px;padding-top:5px;border-top:1px solid var(--line)">
              <span class="muted">⚖️ ส่วนต่าง</span>
              <b style="color:${energyDelta < 0 ? 'var(--green)' : energyDelta > 0 ? 'var(--amber)' : 'var(--ink)'}">
                ${energyDelta === 0 ? '0' : (energyDelta < 0 ? '−' : '+') + fmt(Math.abs(energyDelta))}
              </b>
            </div>
          </div>
        </div>

        <div class="zone-card" style="margin-top:12px;padding:12px 14px;background:${statusBg};border-radius:12px;text-align:center;line-height:1.6">
          <div style="font-weight:700;font-size:15px;color:${zone.ringColor}">${h(zone.headline)}</div>
          <div style="font-size:13px;color:var(--ink-2);margin-top:3px">${h(zone.sub)}</div>
          <div class="muted" style="font-size:11.5px;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,0.08)">
            กิน ${fmt(totals.calories)} − เผา ${fmt(totalDailyBurn)} = ${energyDelta === 0 ? '0' : (energyDelta < 0 ? '−' : '+') + fmt(Math.abs(energyDelta))}
            · เป้า ${goalAdj > 0 ? '+' : ''}${goalAdj}/วัน${burned > 0 ? ` · งบ ${fmt(baseTarget)}+${fmt(burned)} ออกกำลัง` : ''}

          <div class="bar-label">
            <span>🥩 โปรตีน ${helpHtml('protein')}</span>

        </div>

            <span>🍚 คาร์บ ${helpHtml('carbs')}</span>

            <div class="muted" style="font-size:12.5px">วันนี้ 3 มื้อ · หรือล่วงหน้า 3-14 วัน · เลือกตามแคล/โปรตีน</div>

function logEntryHtml(entry) {
  const m = entry.snapshot || findMeal(entry.mealId);
  const t = calcEntryTotals(entry);
  const pct = entry.sizePct || 100;
  const qty = entry.quantity || 1;
  const isSpecial = !!entry.special;
  const addonList = (entry.addons || []).map(a => {
    const id = typeof a === 'string' ? a : a.id;
    const count = typeof a === 'string' ? 1 : (a.count || 0);
    if (!count) return '';
    const def = ADDONS.find(x => x.id === id);
    if (!def) return '';
    return count > 1 ? `${count}×${def.name}` : def.name;
  }).filter(Boolean).join(', ');
  const customList = (entry.customizations || []).map(cid => {
    const c = m?.customizations?.find(x => x.id === cid);
    return c?.label || '';
  }).filter(Boolean).join(', ');
  if (isSpecial) {
    const sp = entry.special;
    const subText = sp.method === 'detailed'
      ? (sp.itemSummary ? sp.itemSummary.slice(0, 40) + (sp.itemSummary.length > 40 ? '...' : '') : `${sp.items?.length || 0} รายการ`)
      : `Quick · ${pct === 100 ? '' : pct + '% '}${sp.addons?.length ? '+' + sp.addons.length + ' add-on' : ''}`;
    return `
      <div class="log-item" style="border-left:4px solid #d97706">
        <div class="emo">${m ? (m.emoji || '🎉') : '🎉'}</div>
        <div class="body">
          <div class="name"><span class="badge" style="margin-right:6px">🎉 พิเศษ</span>${h(m ? m.name : '?')}</div>
          <div class="sub">${h(subText)}</div>
        </div>
        <div class="cal">${fmt(t.calories)} kcal</div>
        <button class="del" data-act="delete-entry" data-id="${entry.id}" aria-label="ลบ">🗑️</button>
      </div>
    `;
  }
  return `
    <div class="log-item" data-act="edit-entry" data-id="${entry.id}">
      <div class="emo">${qty > 1 ? `<span style="font-size:14px;background:var(--primary);color:#fff;padding:2px 6px;border-radius:8px;font-weight:700">${qty}×</span>` : (m ? (m.emoji || '🍽️') : '🍽️')}</div>
      <div class="body">
        <div class="name">${h(m ? m.name : 'ไม่พบเมนู')}${customList ? ` <span style="color:var(--primary-dark);font-size:13px;font-weight:500">(${h(customList)})</span>` : ''}</div>
        <div class="sub">${pct}% ${addonList ? '· + ' + h(addonList) : ''}</div>
      </div>
      <div class="cal">${fmt(t.calories)} kcal</div>
      <button class="del" data-act="delete-entry" data-id="${entry.id}" aria-label="ลบ">🗑️</button>
    </div>
  `;
}

  if (loading) {
    return `

  const confLabel = result.confidence === 'high' ? '🟢 สูง' : result.confidence === 'medium' ? '🟡 ปานกลาง' : '🔴 ต่ำ';

        <div class="kv-row"><div class="k">แบรนด์</div><input class="w-full" id="ocr-brand" value="${h(result.brand || '')}" placeholder="ไม่ระบุ" maxlength="60" style="grid-column:1/3"></div>

        <div class="kv-row"><div class="k">แคลอรี่</div><input id="ocr-cal" type="number" inputmode="decimal" value="${result.calories}" min="0" max="5000" step="1"></div>
        <div class="kv-row"><div class="k">โปรตีน (ก.)</div><input id="ocr-prot" type="number" inputmode="decimal" value="${result.protein_g}" min="0" max="500" step="0.1"></div>
        <div class="kv-row"><div class="k">คาร์บ (ก.)</div><input id="ocr-carb" type="number" inputmode="decimal" value="${result.carbs_g}" min="0" max="500" step="0.1"></div>

function renderLibrary() {
  const t = state.tmp;
  const cat = t.cat || 'all';
  const query = (t.query || '').trim().toLowerCase();

  // v1.10.11 — numeric filters (calorie range, min protein, max sugar)
  const calMinNum = parseFloat(t.calMin);
  const calMaxNum = parseFloat(t.calMax);
  const protMinNum = parseFloat(t.protMin);
  const sugarMaxNum = parseFloat(t.sugarMax);
  const calMin = isFinite(calMinNum) && calMinNum > 0 ? calMinNum : 0;
  const calMax = isFinite(calMaxNum) && calMaxNum > 0 ? calMaxNum : Infinity;
  const protMin = isFinite(protMinNum) && protMinNum > 0 ? protMinNum : 0;
  const sugarMax = isFinite(sugarMaxNum) && sugarMaxNum >= 0 ? sugarMaxNum : Infinity;
  const filterCount =
    (calMin > 0 ? 1 : 0) +
    (isFinite(calMax) ? 1 : 0) +
    (protMin > 0 ? 1 : 0) +
    (isFinite(sugarMax) ? 1 : 0);
  const hasFilter = filterCount > 0;

  let meals = allMeals();
  if (cat === 'custom') {
    meals = state.customMeals;
  } else if (cat === 'branded') {
    meals = meals.filter(m => m.source === 'branded' || m.source === 'scanned');
  } else if (cat !== 'all') {
    meals = meals.filter(m => m.category === cat);
  }
  if (query) {
    meals = meals.filter(m => m.name.toLowerCase().includes(query));
  }
  const totalBeforeFilter = meals.length;
  if (hasFilter) {
    meals = meals.filter(m => {
      const cal = m.baseCalories || 0;
      const prot = m.protein_g || 0;
      const sugar = m.sugar_g || 0;
      if (cal < calMin || cal > calMax) return false;
      if (prot < protMin) return false;
      if (sugar > sugarMax) return false;
      return true;
    });
  }
  meals = meals.slice(0, 300);

  // v1.10.1 — cart chip when picking items for a special-detail meal
  let specialCartChip = '';
  if (t.pickMode === 'special-add') {
    const sdItems = t.specialDetail?.items || [];
    const sdCal = sdItems.reduce((s, i) => s + (i.perPersonCal || 0), 0);
    if (sdItems.length > 0) {
      specialCartChip = `
        <div class="special-cart-chip" data-act="goto-special-summary">
          <span style="font-size:18px">🛒</span>
          <div style="flex:1">
            <div><b>${sdItems.length} เมนู</b> ในรายการ · <b>${fmt(sdCal)} kcal</b></div>
            <div class="muted" style="font-size:11.5px;line-height:1.3">เลือกเพิ่ม หรือกดเพื่อดูสรุป + บันทึก</div>
          </div>
          <span style="font-weight:600;color:var(--primary-dark)">ดูสรุป →</span>
        </div>
      `;
    } else {
      specialCartChip = `
        <div class="special-cart-chip empty">
          <span style="font-size:18px">🛒</span>
          <div style="flex:1;font-size:13px;color:var(--ink-2)">รายการพิเศษว่างอยู่ — เลือกเมนูแรกเพื่อเริ่ม</div>
        </div>
      `;
    }
  }

  return `
    <div class="screen">
      <div class="header">
        <button class="icon-btn" data-act="back">←</button>
        <h1>${t.pickMode === 'special-add' ? 'เลือกเมนูเพิ่มในรายการ' : 'เลือกเมนู'}</h1>
      </div>
      ${backdateBannerHtml(t.targetDate)}
      ${specialCartChip}
      <div class="search-box mb">
        <span class="icon">🔍</span>
        <input id="lib-search" class="input" placeholder="ค้นหา เช่น ข้าวผัด" value="${h(t.query || '')}">
      </div>
      <div class="row" style="gap:8px;align-items:center;margin-bottom:8px">
        <button class="btn ghost sm" data-act="toggle-filter" style="font-size:13px;padding:6px 10px;${t.filterOpen ? 'background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark)' : ''}">
          🎛️ ตัวกรอง${filterCount > 0 ? ` <span class="badge" style="background:var(--primary);color:#fff;padding:1px 6px;border-radius:8px;font-size:11px;margin-left:2px">${filterCount}</span>` : ''}
        </button>
        ${hasFilter ? `<span class="muted" style="font-size:12px">แสดง ${meals.length}/${totalBeforeFilter} รายการ</span>` : ''}
      </div>
      ${t.filterOpen ? `
        <div class="card tight" style="margin-bottom:10px;padding:12px">
          <div class="field" style="margin-bottom:10px">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">🔥 แคลอรี่ (kcal)</label>
            <div style="display:flex;gap:8px;align-items:center">
              <input id="filter-cal-min" type="number" inputmode="numeric" class="input" placeholder="ขั้นต่ำ" value="${h(t.calMin || '')}" min="0" max="5000" style="flex:1;height:42px">
              <span class="muted">—</span>
              <input id="filter-cal-max" type="number" inputmode="numeric" class="input" placeholder="ขั้นสูง" value="${h(t.calMax || '')}" min="0" max="5000" style="flex:1;height:42px">
            </div>
          </div>
          <div class="field" style="margin-bottom:10px">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">🥩 โปรตีนขั้นต่ำ (ก.)</label>
            <input id="filter-prot-min" type="number" inputmode="decimal" class="input" placeholder="เช่น 20 = เมนูโปรตีนสูง" value="${h(t.protMin || '')}" min="0" max="200" step="1" style="height:42px">
          </div>
          <div class="field" style="margin-bottom:10px">
            <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">🍭 น้ำตาลขั้นสูง (ก.)</label>
            <input id="filter-sugar-max" type="number" inputmode="decimal" class="input" placeholder="เช่น 10 = เมนูหวานน้อย" value="${h(t.sugarMax || '')}" min="0" max="200" step="1" style="height:42px">
          </div>
          ${filterCount > 0 ? `<button class="btn secondary block sm" data-act="clear-filters">↺ ล้างตัวกรองทั้งหมด</button>` : '<div class="hint" style="font-size:12px;text-align:center">กรอกค่าเพื่อเริ่มกรอง · เว้นว่างได้</div>'}
        </div>
      ` : ''}
      <div class="tabs">
        ${CATEGORIES.map(c => `<button class="${c.id === cat ? 'on' : ''}" data-act="set-cat" data-v="${c.id}">${c.emoji} ${h(c.name)}</button>`).join('')}
      </div>
      ${meals.length === 0 ? `
        <div class="card empty"><div class="big">🔍</div><div>ไม่พบเมนู</div>
        <div class="muted" style="font-size:14px;margin-top:6px">ลองค้นหาออนไลน์ด้วย AI</div>
        <button class="btn secondary sm mt" data-act="nav-online-from-library">🔎 ค้นหาออนไลน์</button>
        </div>
      ` : meals.map(m => mealItemHtml(m)).join('')}
      <div style="height:30px"></div>
    </div>
    ${bottomNavHtml('')}
  `;
}

function renderAiResultCard(r) {
  const confLabel = r.confidence === 'high' ? '🟢 สูง' : r.confidence === 'medium' ? '🟡 ปานกลาง' : '🔴 ต่ำ';
  const notes = r.notes;
  const reasoning = r.reasoning;
  const sugar = r.sugar_g || 0;
  return `
    <div class="card">
      <h3 style="margin-top:0">🍽️ ${h(r.name)}</h3>
      ${reasoning ? `<div class="hint" style="background:var(--bg-2);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:12.5px;line-height:1.55;color:var(--ink-2)"><b style="color:var(--ink)">🧮 AI คำนวณจาก:</b> ${h(reasoning)}</div>` : ''}
      <div class="row between"><span class="muted">แคลอรี่</span><b>${fmt(r.calories)} kcal</b></div>
      <div class="row between"><span class="muted">ขนาด/ปริมาตร</span><b>~${fmt(r.weight_g)} ก./มล.</b></div>
      <div class="row between"><span class="muted">โปรตีน</span><b>${fmt(r.protein_g, 1)} ก.</b></div>
      <div class="row between"><span class="muted">คาร์บ</span><b>${fmt(r.carbs_g, 1)} ก.</b></div>
      <div class="row between"><span class="muted">น้ำตาล</span><b style="color:${sugar > 25 ? 'var(--red)' : sugar > 10 ? 'var(--amber)' : 'var(--ink)'}">${fmt(sugar, 1)} ก.${sugar > 0 ? ` (≈${Math.round(sugar / 4)} ช้อนชา)` : ''}</b></div>
      <div class="row between"><span class="muted">ไขมัน</span><b>${fmt(r.fat_g, 1)} ก.</b></div>
      <div class="row between mt"><span class="muted">ความแม่นยำ</span><span class="chip ${r.confidence}">${confLabel}</span></div>
      ${notes ? `<div class="callout mt">💡 ${h(notes)}</div>` : ''}
      ${r.confidence === 'low' ? `<div class="callout" style="background:var(--red-soft);color:var(--red)">⚠️ ความแม่นยำต่ำ ควรปรับแก้ค่าก่อนบันทึก</div>` : ''}
      <div class="btn-row mt">

function normalizeAddons(arr) {
  return (arr || []).map(a => typeof a === 'string' ? { id: a, count: 1 } : { id: a.id, count: a.count || 0 }).filter(x => x.count > 0);
}

function renderMealDetail() {
  const t = state.tmp;
  const meal = t.meal || findMeal(t.mealId);
  if (!meal) {
    return `<div class="screen"><div class="header"><button class="icon-btn" data-act="back">←</button><h1>ไม่พบเมนู</h1></div></div>`;
  }
  const sizePct = t.sizePct || 100;
  const quantity = t.quantity == null ? 1 : t.quantity;
  const addonCounts = t.addonCounts || {};
  const customizations = t.customizations || [];
  const mult = sizePct / 100;
  const factor = mult * quantity;
  // Apply customizations to base
  let baseCal = meal.baseCalories;
  let baseProt = meal.protein_g;
  let baseCarb = meal.carbs_g;
  let baseFat = meal.fat_g;
  let baseSugar = meal.sugar_g || 0;
  if (customizations.length && Array.isArray(meal.customizations)) {
    customizations.forEach(cid => {
      const c = meal.customizations.find(x => x.id === cid);
      if (!c) return;
      baseCal += c.calChange || 0;
      baseProt += c.proteinChange || 0;
      baseCarb += c.carbChange || 0;
      baseFat += c.fatChange || 0;
      baseSugar += c.sugarChange || 0;
    });
  }
  let cal = baseCal * factor;
  let prot = baseProt * factor;
  let carb = baseCarb * factor;
  let fat = baseFat * factor;
  let sugar = baseSugar * factor;
  ADDONS.forEach(a => {
    const c = addonCounts[a.id] || 0;
    cal += a.calories * c;
    prot += a.protein_g * c;
    carb += a.carbs_g * c;
    fat += a.fat_g * c;
    sugar += (a.sugar_g || 0) * c;
  });
  const wt = meal.baseWeight_g * factor;
  const isFav = state.favorites.includes(meal.id);
  const editing = !!t.editingEntryId;
  const isCustom = state.customMeals.some(m => m.id === meal.id);
  const presetOn = SIZE_PRESETS.find(p => p.pct === sizePct);
  // v1.10.19 — plan-edit mode: opened from meal-plan view to modify a slot.
  // Hides log/edit buttons and hides "ดูเมนูคล้ายกัน" (use plan view's swap drawer instead).
  const planEditing = !!t.planEditing;

  return `
    <div class="screen">
      <div class="header">
        <button class="icon-btn" data-act="back">←</button>
        <h1 style="flex:1">${meal.emoji || '🍽️'} ${h(meal.name)}</h1>
        <button class="icon-btn" data-act="toggle-fav" data-id="${meal.id}" aria-label="เมนูประจำ" title="เมนูประจำ">${isFav ? '⭐' : '☆'}</button>
      </div>
      ${planEditing ? `
        <div class="callout info" style="background:#e0e7ff;border-left:4px solid #818cf8;font-size:13px">
          📋 <b>กำลังแก้ไขในแผน</b> — ปรับขนาด/Add-on แล้วกด <b>"💾 บันทึกกลับเข้าแผน"</b><br>
          <span style="font-size:11.5px;color:#3730a3">ค่าจะอัปเดตเฉพาะในแผน · ยังไม่บันทึกเข้าวันนี้ จนกว่าจะกด "ยืนยัน" ในหน้าแผน</span>
        </div>
      ` : backdateBannerHtml(t.targetDate)}

      <div class="card">
        <div class="row between">
          <div class="muted">รวม ${quantity > 1 ? `× ${quantity}` : ''}</div>
          <div style="font-size:24px;font-weight:700;color:var(--primary-dark)">${fmt(cal)} kcal</div>
        </div>
        <div class="facts">
          <div><div class="v">${fmt(prot, 1)} ก.</div><div class="l">โปรตีน</div></div>
          <div><div class="v">${fmt(carb, 1)} ก.</div><div class="l">คาร์บ</div></div>
          <div><div class="v">${fmt(fat, 1)} ก.</div><div class="l">ไขมัน</div></div>
        </div>
        <div class="hint mt">น้ำหนักโดยประมาณ ${fmt(wt)} ก. · น้ำตาล ${fmt(sugar, 1)} ก.${sugar > 20 ? ` ≈ ${Math.round(sugar / 4)} ช้อนชา` : ''}</div>
      </div>
      ${planEditing ? '' : `<button class="btn ghost block sm mt" data-act="show-similar" data-id="${meal.id}" style="font-size:13px">🔄 ดูเมนูที่คล้ายกัน</button>`}

      ${Array.isArray(meal.customizations) && meal.customizations.length ? (() => {
        // v1.10.0 — group customizations with the same groupId into mutually-exclusive radio.
        // Customizations without groupId remain checkboxes (legacy behavior).
        const groups = {};
        const ungrouped = [];
        meal.customizations.forEach(c => {
          if (c.groupId) {
            if (!groups[c.groupId]) groups[c.groupId] = [];
            groups[c.groupId].push(c);
          } else {
            ungrouped.push(c);
          }
        });
        const renderItem = (c, isRadio) => {
          const on = customizations.includes(c.id);
          const sign = (c.calChange || 0) >= 0 ? '+' : '';
          const noteHtml = c.note ? `<div class="d" style="font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4">${h(c.note)}</div>` : '';
          return `
            <div class="addon ${on ? 'on' : ''}" data-act="${isRadio ? 'toggle-radio-customization' : 'toggle-customization'}" data-v="${c.id}"${isRadio ? ` data-group="${h(c.groupId)}"` : ''}>
              <div class="emo">${isRadio ? (on ? '●' : '○') : '⚙️'}</div>
              <div class="n">${h(c.label)}${noteHtml}</div>
              <div class="c" style="color:${(c.calChange || 0) < 0 ? 'var(--green)' : (c.calChange || 0) > 0 ? 'var(--primary-dark)' : 'var(--muted)'}">${(c.calChange || 0) === 0 ? '~ 0' : sign + fmt(c.calChange) + ' kcal'}</div>
              <div class="chk">${on ? '✓' : ''}</div>
            </div>
          `;
        };
        const groupHeaders = {
          chicken_rice_skin: '🍗 ไม่หนัง?',
          duck_skin: '🦆 ไม่หนังเป็ด?',
          pork_leg_skin_fat: '🍖 ไม่หนังไม่มัน?',
          crispy_pork_skin_fat: '🥓 หนัง/มันหมูกรอบ?',
          pork_belly_skin_fat: '🥓 ลอกหนัง/มันสามชั้น?',
          red_pork_fat: '🍖 ส่วนมันหมูแดง?',
          fried_chicken_skin_batter: '🍗 หนัง/แป้งทอด?'
        };
        let html = '<h2>🛠️ ปรับแต่ง</h2>';
        Object.keys(groups).forEach(gid => {
          const header = groupHeaders[gid] || '⚙️ เลือก 1 ตัวเลือก';
          html += `<div style="font-size:13px;color:var(--ink-2);font-weight:600;margin:10px 0 6px">${h(header)} <span class="muted" style="font-weight:400;font-size:11.5px">(เลือกได้ 1 ข้อ)</span></div>`;
          html += groups[gid].map(c => renderItem(c, true)).join('');
        });
        if (ungrouped.length) {
          if (Object.keys(groups).length) {
            html += `<div style="font-size:13px;color:var(--ink-2);font-weight:600;margin:12px 0 6px">เพิ่มเติม</div>`;
          }
          html += ungrouped.map(c => renderItem(c, false)).join('');
        }
        return html;
      })() : ''}

      <h2>ขนาดแต่ละจาน</h2>
      <div class="size-grid">
        ${SIZE_PRESETS.map(p => `
          <button type="button" class="${p.pct === sizePct && presetOn ? 'on' : ''}" data-act="set-size" data-v="${p.pct}">
            <span class="pct">${p.pct}%</span>
            <span class="label">${h(p.label)}</span>
          </button>
        `).join('')}
      </div>
      <div class="card tight mt">
        <div class="row between"><span class="muted">ปรับขนาดเอง</span><b>${sizePct}%</b></div>
        <div class="slider-wrap">
          <input type="range" id="size-slider" min="25" max="300" step="5" value="${sizePct}">
        </div>
      </div>

      <h2>จำนวน (กี่จาน/ชาม)</h2>
      <div class="card tight">
        <div class="row between">
          <div>
            <div style="font-weight:600">${h(meal.name)}</div>
            <div class="muted" style="font-size:13px">× ${fmt(meal.baseCalories * mult)} kcal/จาน = ${fmt(cal - ADDONS.reduce((s, a) => s + a.calories * (addonCounts[a.id] || 0), 0))} kcal</div>
          </div>
          ${qtyStepperHtml('main', quantity, 0, 5)}
        </div>
      </div>

      <h2>เพิ่มเติม (ไม่จำเป็น)</h2>
      ${ADDONS.map(a => {
        const c = addonCounts[a.id] || 0;
        const addCal = a.calories * c;
        return `
          <div class="addon-q ${c > 0 ? 'on' : ''}">
            <div class="emo">${a.emoji}</div>
            <div class="n">${h(a.name)}<small>${c > 0 ? `${c} × ${fmt(a.calories)} = ${fmt(addCal)} kcal` : `+${fmt(a.calories)} kcal/ชิ้น`}</small></div>
            ${qtyStepperHtml('addon_' + a.id, c, 0, 5)}
          </div>
        `;
      }).join('')}

      <div class="btn-row mt2">
        ${planEditing
          ? `<button class="btn green block lg" ${quantity < 1 ? 'disabled' : ''} data-act="save-plan-meal">💾 บันทึกกลับเข้าแผน</button>`
          : editing
            ? `<button class="btn block lg" data-act="update-log">✅ บันทึกการแก้ไข</button>`
            : `<button class="btn block lg" ${quantity < 1 ? 'disabled' : ''} data-act="save-log">✅ บันทึกในวันนี้</button>`
        }
      </div>
      ${isCustom && !planEditing ? `
        <div class="btn-row mt">
          <button class="btn secondary sm" data-act="edit-custom-meal" data-id="${meal.id}">✏️ แก้ไขเมนู</button>
          <button class="btn ghost sm" data-act="delete-custom-meal" data-id="${meal.id}" style="color:var(--red)">🗑️ ลบเมนู</button>
        </div>
      ` : ''}
      <div style="height:30px"></div>
    </div>
  `;
}

function qtyStepperHtml(key, value, min, max) {
  return `
    <div class="qty-stepper">
      <button type="button" data-act="qty-dec" data-v="${key}" ${value <= min ? 'disabled' : ''} aria-label="ลด">−</button>
      <span class="v">${value}</span>
      <button type="button" data-act="qty-inc" data-v="${key}" ${value >= max ? 'disabled' : ''} aria-label="เพิ่ม">+</button>
    </div>
  `;
}
