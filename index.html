// Async helper: refresh object URLs for all photo IDs in current draft
async function refreshCheckinPhotoUrls() {
  const checkin = state.tmp.checkin;
  if (!checkin) return;
  state.tmp.checkinPhotoUrls = state.tmp.checkinPhotoUrls || {};
  let changed = false;
  for (const angle of ['front', 'side', 'back']) {
    const pid = checkin.photoIds[angle];
    if (pid && !state.tmp.checkinPhotoUrls[pid]) {
      try {
        const url = await getPhotoUrl(pid);
        if (url) { state.tmp.checkinPhotoUrls[pid] = url; changed = true; }
      } catch (e) { console.warn('refreshCheckinPhotoUrls failed for', pid, e); }
    }
  }
  if (changed) render();
}

// Async helper: revoke all cached photo URLs (memory cleanup on flow exit)
function revokeCheckinPhotoUrls() {
  if (!state.tmp.checkinPhotoUrls) return;
  for (const url of Object.values(state.tmp.checkinPhotoUrls)) {
    if (url) { try { URL.revokeObjectURL(url); } catch (e) {} }
  }
  state.tmp.checkinPhotoUrls = {};
}

// Async helper: process file input → compress → save blob → update draft → cache URL → render
async function handleCheckinPhotoUpload(angle, file) {
  if (!file || !['front', 'side', 'back'].includes(angle)) return;
  const u = currentUser();
  const checkin = state.tmp.checkin;
  if (!u || !checkin) return;
  let blob;
  try { blob = await compressPhoto(file); }
  catch (e) {
    console.warn('Compression failed', e);
    return toast('อัปโหลดไม่สำเร็จ ลองรูปอื่น', true);
  }
  const newId = uid('photo');
  try { await savePhotoBlob(newId, blob); }
  catch (e) {
    console.warn('Save photo blob failed', e);
    return toast('บันทึกรูปไม่สำเร็จ · ลองอีกครั้ง', true);
  }
  // Replace old photo for this angle (if any) — delete blob + revoke URL.
  // v1.10.33 — T-013b.1: in edit mode, do NOT delete the blob if it's an
  // original (saved check-in still references it; deletion happens at save time
  // only if the photo actually gets replaced).
  const oldId = checkin.photoIds[angle];
  if (oldId && oldId !== newId) {
    const isEdit = checkin.mode === 'edit';
    const isOriginal = isEdit && checkin.originalPhotoIds &&
      Object.values(checkin.originalPhotoIds).includes(oldId);
    if (!isOriginal) {
      try { await deletePhotoBlob(oldId); } catch (e) {}
    }
    const oldUrl = state.tmp.checkinPhotoUrls?.[oldId];
    if (oldUrl) { try { URL.revokeObjectURL(oldUrl); } catch (e) {} delete state.tmp.checkinPhotoUrls[oldId]; }
  }
  checkin.photoIds[angle] = newId;
  setCheckinDraft(u.id, checkin);
  // Cache URL for preview
  state.tmp.checkinPhotoUrls = state.tmp.checkinPhotoUrls || {};
  try { state.tmp.checkinPhotoUrls[newId] = await getPhotoUrl(newId); } catch (e) {}
  render();
}

function renderStreaks() {
  const u = currentUser();
  if (!u) return '';
  ensureStreakState(u);
  const types = ['logging','weight','inTarget','protein'];
  const protT = effectiveProteinTarget(u.id);
  const todayLogs = todayEntries();
  const todayTotals = sumEntries(todayLogs);
  // Today's goal-zone — same source of truth as dashboard ring
  const todayBaseTarget = effectiveCalorieTarget(u.id);
  const todayBurned = activityIncludesExercise(u) ? 0 : sumActivitiesBurn(u.id);
  const todayZone = goalZoneEval({
    eaten: todayTotals.calories,
    baseTarget: todayBaseTarget,
    exerciseBurn: todayBurned,
    goalAdj: effectiveGoalAdjust(u),
    tdee: calcTDEE(u)
  });
  const ss = u.streakState;
  const lateHour = new Date().getHours() >= 20;

  function statusFor(type, status) {
    if (status.doneToday) return { cls: 'ok', text: '✓ ทำได้แล้ววันนี้' };
    if (type === 'logging') {
      if (status.current > 0 && lateHour) return { cls: 'warn', text: `⏰ Streak ${status.current} วัน — ยังไม่ได้บันทึกวันนี้` };
      if (status.current > 0) return { cls: 'warn', text: 'ยังไม่ได้บันทึกวันนี้' };
      return { cls: '', text: 'เริ่มต้นวันนี้ได้!' };
    }
    if (type === 'weight') {
      const latest = latestWeight(u);
      if (!latest) return { cls: '', text: 'ยังไม่มีข้อมูลน้ำหนัก' };
      return { cls: 'warn', text: 'ยังไม่ได้ชั่งวันนี้' };
    }
    if (type === 'inTarget') {
      if (todayLogs.length < 2) return { cls: '', text: 'ต้องบันทึกอย่างน้อย 2 มื้อ' };
      const gd = todayZone.goalDelta;
      if (Math.abs(gd) < 250) return { cls: 'ok', text: `✓ อยู่ในเป้า (${gd === 0 ? '0' : (gd < 0 ? '−' : '+') + fmt(Math.abs(gd))} จากเป้า)` };
      if (gd <= -250) return { cls: 'warn', text: `🟡 ขาดดุลเกินเป้า ${fmt(-gd)} kcal — กินเพิ่มอีกหน่อย` };
      return { cls: 'bad', text: `❌ เกินเป้า ${fmt(gd)} kcal` };
    }
    if (type === 'protein') {
      if (todayLogs.length < 2) return { cls: '', text: 'ต้องบันทึกอย่างน้อย 2 มื้อ' };
      const need = protT * 0.85;
      if (todayTotals.protein_g < need) return { cls: 'bad', text: `❌ ขาด ${fmt(need - todayTotals.protein_g, 1)} ก.` };
      return { cls: 'ok', text: '✓ ครบเป้าโปรตีน' };
    }
    return { cls: '', text: '' };
  }

  const breakNotice = (() => {
    const cur = getStreakStatus(u, 'logging').current;
    const best = getStreakStatus(u, 'logging').best;
    if (cur > 0 || best < 5) return '';
    return `<div class="callout info">💔 Streak reset — best ของคุณ <b>${best} วัน</b> ยังอยู่<br>วันนี้เริ่มใหม่ได้: log มื้อแรก = streak 1 วัน 🎯</div>`;
  })();

  return `
    <div class="screen">
      <div class="header">
        <button class="icon-btn" data-act="back">←</button>
        <h1>🏆 Streaks</h1>
      </div>
      ${breakNotice}
      ${types.map(t => {
        const s = getStreakStatus(u, t);
        const lbl = STREAK_LABELS[t];
        const pct = s.best > 0 ? Math.min(100, (s.current / Math.max(s.best, 7)) * 100) : 0;
        const stat = statusFor(t, s);
        const barCls = t === 'logging' ? 'fire' : (stat.cls === 'ok' ? 'green' : '');
        return `
          <div class="streak-row">
            <div class="head">
              <div class="e">${lbl.emoji}</div>
              <div class="n">${h(lbl.name)}</div>
              <div class="num">${s.current}</div>
              <div class="muted" style="font-size:13px">วัน</div>
            </div>
            <div class="desc">${h(lbl.desc)}</div>
            <div class="bar"><i class="${barCls}" style="width:${pct.toFixed(1)}%"></i></div>
            <div class="meta">
              <span>ปัจจุบัน <b>${s.current}</b> วัน</span>
              <span>Best: <b>${s.best}</b> วัน</span>
            </div>
            <div class="status ${stat.cls}">${stat.text}</div>
          </div>
        `;
      }).join('')}

      <div class="card">
        <h3 style="margin-top:0">🛡️ Freeze Tokens</h3>
        <div class="row between">
          <div>
            <div style="font-size:22px;font-weight:700;color:var(--primary-dark)">${ss.freezeTokens.available}/${ss.freezeTokens.max}</div>
            <div class="muted" style="font-size:13px">พร้อมใช้</div>
          </div>
          <div style="font-size:13px;color:var(--muted);text-align:right">
            ใช้อัตโนมัติเมื่อพลาด 1 วัน<br>
            รีเซ็ตทุก<b>วันจันทร์</b>
          </div>
        </div>
        ${ss.freezes.logging.length > 0 ? `<div class="hint mt">วันที่ freeze: ${ss.freezes.logging.slice(-5).join(', ')}</div>` : ''}
      </div>

      <div class="card">
        <h3 style="margin-top:0">🔧 Repair (วันยุ่งจริงๆ)</h3>
        <div class="muted" style="font-size:13px;margin-bottom:8px">นับวันที่ผ่านเป็น "ทำได้" — ใช้ได้ ${ss.repairs.max} ครั้ง/เดือน</div>
        <div class="row between">
          <div style="font-weight:600">ใช้ไปแล้ว ${ss.repairs.used}/${ss.repairs.max}</div>
          <button class="btn sm ${ss.repairs.used >= ss.repairs.max ? 'ghost' : 'secondary'}" ${ss.repairs.used >= ss.repairs.max ? 'disabled' : ''} data-act="streak-repair">
            ${ss.repairs.used >= ss.repairs.max ? 'หมดเดือนนี้' : 'ซ่อม streak เมื่อวาน'}
          </button>
        </div>
      </div>

      <div class="card">
        <button class="btn ghost block" data-act="streak-reset" style="color:var(--red);font-size:14px">⚠️ Reset all streaks</button>
        <div class="hint center" style="font-size:12px;margin-top:6px">ทุก streak จะกลับเป็น 0 (best ก็ถูก reset)</div>
      </div>

      <div style="height:30px"></div>
    </div>
  `;
}

function stopScanner() {
  if (state.scanner) {
    try { state.scanner.reset(); } catch {}
    state.scanner = null;
  }
}

      focusInfo.start = af.selectionStart;

  }

    if (newEl && (newEl.tagName === 'INPUT' || newEl.tagName === 'TEXTAREA')) {
      try {
        newEl.focus({ preventScroll: true });
        if (focusInfo.start != null && newEl.setSelectionRange) {
          newEl.setSelectionRange(focusInfo.start, focusInfo.end != null ? focusInfo.end : focusInfo.start);
        }
      } catch {}
    }
  }
  if (state.view === 'scan' && !state.scanner) {
    setTimeout(() => {
      const v = document.getElementById('scan-video');

async function startBarcodeScan(videoEl) {
  if (!window.ZXing) {
    state.tmp.error = 'ไลบรารี scanner ยังโหลดไม่เสร็จ ลองอีกครั้ง';
    render();
    return;
  }
  try {
    const reader = new ZXing.BrowserMultiFormatReader();
    state.scanner = reader;
    let deviceId = null;
    try {
      const devices = await reader.listVideoInputDevices();
      const back = devices.find(d => /back|rear|environment/i.test(d.label || ''));
      deviceId = (back || devices[devices.length - 1] || devices[0])?.deviceId || null;
    } catch {}
    await reader.decodeFromVideoDevice(deviceId, videoEl, (result, errInner) => {
      if (result && state.view === 'scan') {
        try { navigator.vibrate?.(80); } catch {}
        const code = result.getText();
        stopScanner();
        handleBarcodeFound(code);
      }
    });
  } catch (err) {
    state.tmp.error = 'ไม่สามารถเปิดกล้องได้ — อนุญาตสิทธิ์กล้องในเบราว์เซอร์';
    stopScanner();
    render();
  }
}

function handleBarcodeFound(barcode) {

  go('scan-not-found', { barcode });
}

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        let w = img.width, hh = img.height;
        if (w > maxWidth) { hh = (maxWidth / w) * hh; w = maxWidth; }
        canvas.width = w; canvas.height = hh;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, hh);
        canvas.toBlob(b => {
          URL.revokeObjectURL(url);
          b ? resolve(b) : reject(new Error('Compression failed'));
        }, 'image/jpeg', quality);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
    img.src = url;
  });
}

function fileToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function processOcr(file, attachedBarcode) {
  state.tmp.loading = true;
  state.tmp.error = '';
  state.tmp.result = null;
  if (state.tmp.preview) { try { URL.revokeObjectURL(state.tmp.preview); } catch {} }
  state.tmp.preview = URL.createObjectURL(file);
  render();
  try {
    const compressed = await compressImage(file, 1200, 0.85);
    const base64 = await fileToBase64(compressed);
    const res = await fetch('/api/extract-nutrition', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: base64, barcode: attachedBarcode || null })
    });
    const data = await res.json();
    state.tmp.loading = false;
    if (!res.ok) {
      state.tmp.error = data.error || 'อ่านข้อมูลไม่สำเร็จ';
    } else {
      state.tmp.result = data;
    }
  } catch (err) {
    state.tmp.loading = false;
    state.tmp.error = 'เชื่อมต่อไม่ได้ ลองใหม่';
  }
  render();
}

function collectOcrEdits() {
  const r = state.tmp.result || {};
  const num = id => { const v = Number(document.getElementById(id)?.value); return isFinite(v) ? v : 0; };
  const getStr = id => String(document.getElementById(id)?.value || '').trim();
  const carbs = Math.max(0, num('ocr-carb'));
  const sugar = Math.min(carbs, Math.max(0, num('ocr-sugar')));
  return {
    productName: getStr('ocr-name') || r.productName || 'สินค้า',
    brand: getStr('ocr-brand') || r.brand || null,
    category: r.category || 'other',
    servingSize: Math.max(1, num('ocr-size')),
    servingUnit: r.servingUnit || 'g',
    calories: Math.max(0, num('ocr-cal')),
    protein_g: Math.max(0, num('ocr-prot')),
    carbs_g: carbs,
    sugar_g: sugar,
    fat_g: Math.max(0, num('ocr-fat')),
    barcode: r.barcode || null
  };
}

  // v1.10.30 — T-012: also captures waist (optional). At least one must be valid.
  'save-weight': () => {
    const u = currentUser();
    if (!u) return;
    const wRaw = document.getElementById('wt-input')?.value;
    const waistRaw = document.getElementById('waist-input')?.value;
    const mmRaw = document.getElementById('mm-input')?.value;
    const bfRaw = document.getElementById('bf-input')?.value;
    const w = wRaw ? parseFloat(wRaw) : null;
    const waist = waistRaw ? parseFloat(waistRaw) : null;
    const hasWeight = w != null && !isNaN(w) && w >= 20 && w <= 300;
    const hasWaist = waist != null && !isNaN(waist) && waist >= 40 && waist <= 200;
    const today = todayKey();
    const todayEntry = (u.weights || []).find(x => x.date === today);

    // v1.10.48 — T-022a: optional body-comp (มวลกล้าม kg / % ไขมัน) from a home BIA scale.
    // Loose + non-blocking: an invalid field is rejected with a warning but the weight still saves.
    // Empty = leave the field unchanged (same as the weight/waist inputs) — never silently wipes a
    // previously-saved reading. Body-comp only attaches to TODAY's weight entry.
    const bcWarnings = [];
    const extra = {};
    const refWeight = hasWeight ? Math.round(w * 10) / 10
                    : (todayEntry ? todayEntry.weight_kg
                    : (latestWeight(u)?.weight_kg ?? u.weight ?? null));
    if (mmRaw != null && mmRaw !== '') {
      const mm = parseFloat(mmRaw);
      if (isNaN(mm) || mm <= 0) bcWarnings.push('มวลกล้ามต้องมากกว่า 0 — ไม่บันทึกค่านี้');
      else if (refWeight != null && mm >= refWeight) bcWarnings.push(`มวลกล้ามต้องน้อยกว่าน้ำหนักตัว (${refWeight} กก.) — ไม่บันทึกค่านี้`);
      else extra.muscleMass_kg = Math.round(mm * 10) / 10;
    }
    if (bfRaw != null && bfRaw !== '') {
      const bf = parseFloat(bfRaw);
      if (isNaN(bf) || bf < 3 || bf > 70) bcWarnings.push('% ไขมันต้องอยู่ในช่วง 3–70 — ไม่บันทึกค่านี้');
      else extra.bodyFat_pct = Math.round(bf * 10) / 10;
    }
    const hasBC = extra.muscleMass_kg != null || extra.bodyFat_pct != null;

    if (!hasWeight && !hasWaist && !hasBC) {
      if (bcWarnings.length) return toast(bcWarnings.join(' · '), true);
      return toast('กรอกน้ำหนัก (20-300 kg) หรือรอบเอว (40-200 cm)', true);
    }
    if (wRaw && !hasWeight) return toast('น้ำหนักไม่ถูกต้อง (20-300 kg)', true);
    if (waistRaw && !hasWaist) return toast('รอบเอวไม่ถูกต้อง (40-200 cm)', true);

    const parts = [];
    let bcSaved = false;
    if (hasWeight) {
      setWeight(u, today, Math.round(w * 10) / 10, extra);
      parts.push('น้ำหนัก');
      bcSaved = hasBC;
    } else if (hasBC) {
      // No new weight this save — attach body-comp to today's existing weight entry if one exists.
      if (todayEntry) { setWeight(u, today, todayEntry.weight_kg, extra); bcSaved = true; }
      else bcWarnings.push('ต้องมีน้ำหนักของวันนี้ก่อนเพื่อบันทึกมวลกล้าม/ไขมัน');
    }
    if (hasWaist) {
      setWaist(u, today, Math.round(waist * 10) / 10);
      parts.push('รอบเอว');
    }
    if (bcSaved) parts.push('องค์ประกอบร่างกาย');

    persist();
    if (parts.length) toast(`บันทึก${parts.join(' + ')}แล้ว ✅`);
    if (bcWarnings.length) toast(bcWarnings.join(' · '), true);
    render();
  },

  'save-bodycomp': (e, btn) => {
    const u = currentUser();
    if (!u) return;
    const date = btn.dataset.v;
    const entry = (u.weights || []).find(x => x.date === date);
    if (!entry || entry.weight_kg == null) return toast('ไม่พบรายการน้ำหนักของวันนี้', true);
    const mmRaw = document.getElementById('bc-mm-' + date)?.value;
    const bfRaw = document.getElementById('bc-bf-' + date)?.value;
    const patch = {};
    const warnings = [];
    // Validate against THIS entry's own weight_kg (not today's, not profile). Blank = leave unchanged.
    if (mmRaw != null && mmRaw !== '') {
      const mm = parseFloat(mmRaw);
      if (isNaN(mm) || mm <= 0) warnings.push('มวลกล้ามต้องมากกว่า 0 — ไม่บันทึกค่านี้');
      else if (mm >= entry.weight_kg) warnings.push(`มวลกล้ามต้องน้อยกว่าน้ำหนักตัว (${entry.weight_kg} กก.) — ไม่บันทึกค่านี้`);
      else patch.muscleMass_kg = Math.round(mm * 10) / 10;
    }
    if (bfRaw != null && bfRaw !== '') {
      const bf = parseFloat(bfRaw);
      if (isNaN(bf) || bf < 3 || bf > 70) warnings.push('% ไขมันต้องอยู่ในช่วง 3–70 — ไม่บันทึกค่านี้');
      else patch.bodyFat_pct = Math.round(bf * 10) / 10;
    }
    const applied = ('muscleMass_kg' in patch) || ('bodyFat_pct' in patch);
    if (applied) setBodyComp(u, date, patch);
    persist();
    state.tmp.editingBodyComp = null;
    render();
    if (applied) toast('บันทึกองค์ประกอบร่างกายแล้ว ✅');
    if (warnings.length) toast(warnings.join(' · '), true);
    if (!applied && !warnings.length) toast('ไม่มีการเปลี่ยนแปลง');
  },

  // v1.10.32 — T-013b: weekly check-in capture flow

  'nav-checkin': async () => {

    if (!u) return;
    let checkin = getCheckinDraft(u.id);
    if (!checkin) {
      checkin = {
        mode: 'new',
        step: 'front',
        date: todayKey(),
        photoIds: {},
        weight_kg: null,
        waist_cm: null,
        note: '',
        startedAt: Date.now()
      };
      setCheckinDraft(u.id, checkin);

      // Back-compat: drafts created by T-013b have no mode field — treat as 'new'
      checkin.mode = 'new';

    const checkinPhotoUrls = {};

        try {
          const url = await getPhotoUrl(pid);

  // v1.10.33 — T-013b.1: load saved check-in into an edit draft and route to flow.
  'edit-checkin': async (e, btn) => {
    const u = currentUser();
    if (!u) return;
    const id = btn?.dataset?.checkinId;
    if (!id) return;
    const existing = getCheckIn(u, id);
    if (!existing) { toast('ไม่พบ check-in', true); return; }
    // If a draft already exists, force resolution first (avoid silent overwrite)
    const pending = getCheckinDraft(u.id);
    if (pending) {
      const isEditSame = pending.mode === 'edit' && pending.editingId === id;
      if (!isEditSame) {
        toast('มี draft ค้างอยู่ · ทำต่อหรือทิ้งก่อน', true);
        return;
      }
    }
    // Build edit draft — snapshot originalPhotoIds so cancel/replace handles cleanup correctly
    const originalPhotoIds = { ...(existing.photoIds || {}) };
    const draft = pending && pending.mode === 'edit' ? pending : {
      mode: 'edit',
      editingId: id,
      step: 'review',
      date: existing.date,
      photoIds: { ...originalPhotoIds },
      originalPhotoIds,
      weight_kg: existing.weight_kg != null ? existing.weight_kg : null,
      waist_cm: existing.waist_cm != null ? existing.waist_cm : null,
      note: existing.note || '',
      // Preserve snapshot fields so review can display them without recomputing
      weight_7day_avg: existing.weight_7day_avg != null ? existing.weight_7day_avg : null,
      deficit_7day_avg: existing.deficit_7day_avg != null ? existing.deficit_7day_avg : null,
      protein_pass_rate: existing.protein_pass_rate != null ? existing.protein_pass_rate : null,
      training_count: existing.training_count || 0,
      strength_count: existing.strength_count || 0,
      cardio_count: existing.cardio_count || 0,
      startedAt: Date.now()
    };
    setCheckinDraft(u.id, draft);
    // Pre-fetch URLs for current photoIds (originals at start)
    const checkinPhotoUrls = {};
    for (const angle of ['front', 'side', 'back']) {
      const pid = draft.photoIds[angle];
      if (pid) {
        try {
          const url = await getPhotoUrl(pid);
          if (url) checkinPhotoUrls[pid] = url;
        } catch (err) {}
      }
    }
    go('checkin', { checkin: draft, checkinPhotoUrls });
  },

  // v1.10.33 — T-013b.1: delete saved check-in (metadata + photo blobs).
  // v1.10.34 — T-013c: if user is viewing/comparing the deleted check-in,
  // route back to a safe view (Timeline or BPC) after delete.
  'delete-checkin': async (e, btn) => {
    const u = currentUser();
    if (!u) return;
    const id = btn?.dataset?.checkinId;
    if (!id) return;
    if (!confirm('ลบ check-in นี้?\nรูปทั้งหมดของรายการนี้จะถูกลบจากเครื่อง')) return;
    await deleteCheckIn(u, id);
    persist();
    toast('ลบ check-in แล้ว');
    // T-013c: handle viewer/compare context
    if (state.view === 'bpc-viewer' && state.tmp?.checkInId === id) {
      revokeUrlMap(state.tmp.viewerPhotoUrls);
      state.tmp.viewerPhotoUrls = {};
      const remaining = u.checkIns || [];
      go(remaining.length > 0 ? 'bpc-timeline' : 'bpc');
      return;
    }
    if (state.view === 'bpc-compare' && (state.tmp?.leftId === id || state.tmp?.rightId === id)) {
      revokeUrlMap(state.tmp.comparePhotoUrls);
      state.tmp.comparePhotoUrls = {};
      const remaining = u.checkIns || [];
      if (remaining.length < 2) { go('bpc'); return; }
      const defaults = pickCompareDefaults(remaining, state.tmp.compareMode || 'start-latest');
      if (!defaults) { go('bpc'); return; }
      state.tmp.leftId = defaults.leftId;
      state.tmp.rightId = defaults.rightId;
      const leftCi = remaining.find(c => c.id === defaults.leftId);
      const rightCi = remaining.find(c => c.id === defaults.rightId);
      state.tmp.comparePhotoUrls = {};
      Object.assign(state.tmp.comparePhotoUrls, await fetchCheckinPhotoUrls(leftCi));
      Object.assign(state.tmp.comparePhotoUrls, await fetchCheckinPhotoUrls(rightCi));
      render();
      return;
    }
    render();
  },

  // v1.10.34 — T-013c: open Compare with default mode 'start-latest'.
  'nav-bpc-compare': async () => {
    const u = currentUser();
    if (!u) return;
    const all = u.checkIns || [];
    // v1.10.38 — T-013d.3: defaults use check-ins within selected BPC range
    const bpcRange = state.bpcRange || { preset: '30d' };
    const win = resolveInsightWindow(bpcRange, u);
    const inRange = all.filter(c => c.date >= win.startDate && c.date <= win.endDate);
    if (inRange.length < 2) {
      if (all.length < 2) { toast('ต้องมี check-in อย่างน้อย 2 รายการ', true); return; }
      toast(`มี check-in ในช่วงที่เลือก ${inRange.length} รายการ · ลองเลือกช่วงที่กว้างขึ้น`, true);
      return;
    }
    const mode = 'start-latest';
    const defaults = pickCompareDefaults(inRange, mode);
    if (!defaults) { toast('เปรียบเทียบไม่ได้', true); return; }
    const leftCi = inRange.find(c => c.id === defaults.leftId);
    const rightCi = inRange.find(c => c.id === defaults.rightId);
    const comparePhotoUrls = {};
    Object.assign(comparePhotoUrls, await fetchCheckinPhotoUrls(leftCi));
    Object.assign(comparePhotoUrls, await fetchCheckinPhotoUrls(rightCi));
    go('bpc-compare', {
      compareMode: mode,
      leftId: defaults.leftId,
      rightId: defaults.rightId,
      angle: 'front',
      comparePhotoUrls
    });
  },

  // v1.10.34 — T-013c: switch compare mode · re-fetch URLs for new defaults.
  // v1.10.38 — T-013d.3: defaults for start-latest/prev-latest come from in-range
  // check-ins; custom-mode dropdowns still show ALL check-ins (per spec).
  'compare-set-mode': async (e, btn) => {
    const mode = btn?.dataset?.mode;
    if (!['start-latest','prev-latest','custom'].includes(mode)) return;
    const u = currentUser();
    if (!u) return;
    const all = u.checkIns || [];
    const bpcRange = state.bpcRange || { preset: '30d' };
    const win = resolveInsightWindow(bpcRange, u);
    const inRange = all.filter(c => c.date >= win.startDate && c.date <= win.endDate);
    // For start-latest / prev-latest, pick defaults from inRange (≥2 required).
    // For custom, leave current left/right unchanged so user picks freely from full list.
    const poolForDefaults = mode === 'custom' ? all : (inRange.length >= 2 ? inRange : all);
    const defaults = pickCompareDefaults(poolForDefaults, mode);
    if (!defaults) return;
    revokeUrlMap(state.tmp.comparePhotoUrls);
    state.tmp.compareMode = mode;
    state.tmp.leftId = defaults.leftId;
    state.tmp.rightId = defaults.rightId;
    const leftCi = all.find(c => c.id === defaults.leftId);
    const rightCi = all.find(c => c.id === defaults.rightId);
    state.tmp.comparePhotoUrls = {};
    Object.assign(state.tmp.comparePhotoUrls, await fetchCheckinPhotoUrls(leftCi));
    Object.assign(state.tmp.comparePhotoUrls, await fetchCheckinPhotoUrls(rightCi));
    render();
  },

  'compare-set-angle': (e, btn) => {

  // v1.10.38 — T-013d.3: switch the BPC date-range preset (7d / 14d / 30d / 90d / all / custom).
  // Persists via state.bpcRange + persist(); survives reloads and view-navigation.
  'set-bpc-range-preset': (e, btn) => {
    const preset = btn?.dataset?.preset;
    if (!['7d','14d','30d','90d','all','custom'].includes(preset)) return;
    if (!state.bpcRange) state.bpcRange = { preset: '30d' };
    state.bpcRange.preset = preset;
    if (preset !== 'custom') {
      // Clear stale custom dates so re-selecting 'custom' later starts fresh
      delete state.bpcRange.startDate;
      delete state.bpcRange.endDate;
    } else {
      // First-time 'custom' click: pre-fill with last 30 days as starting point
      if (!state.bpcRange.startDate || !state.bpcRange.endDate) {
        const end = todayKey();
        state.bpcRange.startDate = dateToKey(addDays(keyToDate(end), -29));
        state.bpcRange.endDate = end;
      }
    }
    persist();
    render();
  },

  // v1.10.33 — T-013b.1: edit-mode only · clear Back photo from current edit draft.
  // The original blob (if any) is preserved until save; cancel still rolls back.
  'checkin-remove-back': async () => {
    const u = currentUser();
    const checkin = state.tmp.checkin;
    if (!u || !checkin) return;
    if (checkin.mode !== 'edit') return;
    if (!checkin.photoIds.back) return;
    const removedId = checkin.photoIds.back;
    const isOriginal = checkin.originalPhotoIds && Object.values(checkin.originalPhotoIds).includes(removedId);
    if (!isOriginal) {
      // It was a transient upload during this edit session — safe to delete blob now
      try { await deletePhotoBlob(removedId); } catch (err) {}
    }
    // Revoke cached URL
    const oldUrl = state.tmp.checkinPhotoUrls?.[removedId];
    if (oldUrl) { try { URL.revokeObjectURL(oldUrl); } catch (err) {} delete state.tmp.checkinPhotoUrls[removedId]; }
    checkin.photoIds.back = null;
    setCheckinDraft(u.id, checkin);
    render();
  },

    if (!checkin) return;
    if (checkin.step === 'front' && !checkin.photoIds.front) return toast('เลือกรูป Front ก่อน', true);
    if (checkin.step === 'side' && !checkin.photoIds.side) return toast('เลือกรูป Side ก่อน', true);
    const steps = ['front', 'side', 'back', 'review'];
    const idx = steps.indexOf(checkin.step);
    if (idx < steps.length - 1) {
      checkin.step = steps[idx + 1];
      const u = currentUser();
      if (u) setCheckinDraft(u.id, checkin);

  // Final save · validates Front + Side · adds (new) or updates (edit) the check-in.
  // v1.10.33 — T-013b.1: branches on mode. New mode = addCheckIn (T-013b behavior).
  // Edit mode = updateCheckIn + cleanup blobs that were replaced (in originalPhotoIds
  // but not in final photoIds). Snapshot fields (weight_7day_avg etc.) are preserved
  // in edit mode — not recomputed (history should reflect the original window).
  'checkin-save': async () => {
    const u = currentUser();
    const checkin = state.tmp.checkin;
    if (!u || !checkin) return;
    if (!checkin.photoIds.front || !checkin.photoIds.side) {
      return toast('ต้องมีรูป Front + Side ก่อนบันทึก', true);
    }
    const isEdit = checkin.mode === 'edit' && checkin.editingId;
    const finalPhotoIds = {
      front: checkin.photoIds.front,
      side: checkin.photoIds.side
    };
    if (checkin.photoIds.back) finalPhotoIds.back = checkin.photoIds.back;

    if (isEdit) {
      // Build patch — only editable fields. Snapshot fields stay as on the existing entry
      // unless the draft has explicit values (they were copied from existing at edit start).
      const patch = {
        date: checkin.date,
        photoIds: finalPhotoIds,
        weight_kg: checkin.weight_kg,
        waist_cm: checkin.waist_cm,
        note: checkin.note || '',
        // Snapshot fields — preserve (carried from existing into draft at edit start)
        weight_7day_avg: checkin.weight_7day_avg != null ? checkin.weight_7day_avg : null,
        deficit_7day_avg: checkin.deficit_7day_avg != null ? checkin.deficit_7day_avg : null,
        protein_pass_rate: checkin.protein_pass_rate != null ? checkin.protein_pass_rate : null,
        training_count: checkin.training_count || 0,
        strength_count: checkin.strength_count || 0,
        cardio_count: checkin.cardio_count || 0
      };
      const updated = updateCheckIn(u, checkin.editingId, patch);
      if (!updated) {
        toast('ไม่พบ check-in · บันทึกไม่สำเร็จ', true);
        return;
      }
      // Clean up replaced blobs — in originalPhotoIds but not in finalPhotoIds
      const originals = Object.values(checkin.originalPhotoIds || {}).filter(Boolean);
      const finals = new Set(Object.values(finalPhotoIds).filter(Boolean));
      for (const oldPid of originals) {
        if (!finals.has(oldPid)) {
          try { await deletePhotoBlob(oldPid); } catch (err) {}
        }
      }
      clearCheckinDraft(u.id);
      state.tmp.checkin = null;
      revokeCheckinPhotoUrls();
      persist();
      toast('✅ บันทึกการแก้ไขแล้ว');
      go('bpc');
      return;
    }

    // New-mode path (T-013b behavior preserved · snapshot derived at save time)
    const derived = compute7DayCheckinStats(u, checkin.date);
    const final = {
      date: checkin.date,
      photoIds: finalPhotoIds,
      weight_kg: checkin.weight_kg != null ? checkin.weight_kg : (derived ? derived.weight_kg : null),
      weight_7day_avg: derived ? derived.weight_7day_avg : null,
      waist_cm: checkin.waist_cm != null ? checkin.waist_cm : (derived ? derived.waist_cm : null),
      deficit_7day_avg: derived ? derived.deficit_7day_avg : null,
      protein_pass_rate: derived ? derived.protein_pass_rate : null,
      training_count: derived ? derived.training_count : 0,
      strength_count: derived ? derived.strength_count : 0,
      cardio_count: derived ? derived.cardio_count : 0,
      note: checkin.note || ''
    };
    addCheckIn(u, final);
    clearCheckinDraft(u.id);
    state.tmp.checkin = null;
    revokeCheckinPhotoUrls();
    persist();
    toast('✅ บันทึก check-in แล้ว');
    go('bpc');
  },

  // v1.10.18 — confirm 1-day plan: log all loggable meals into today's entries
  // v1.10.19 — respect modifications (size/qty/addons/customizations) made via 📋 modify
  // v1.10.21 — also log the fixed slot (e.g. Vitaday) via snapshot — was being
  // skipped silently because the filter required mealId, which fixed slots lack.
  'confirm-1day-plan': () => {
    const plan = state.tmp.plan;
    if (!plan || !plan.days[0]) return toast('ไม่มีแผน', true);
    const all = plan.days[0].meals.filter(m =>
      (m.slot === 'meal' && m.mealId) || m.slot === 'fixed'
    );
    if (all.length === 0) return toast('ไม่มีเมนูให้บันทึก', true);
    let logged = 0;
    for (const m of all) {
      if (m.slot === 'fixed') {
        // Fixed slot has no DB meal — log via inline snapshot
        addLogEntry({
          mealId: uid('fixed'),
          sizePct: 100,
          quantity: 1,
          addons: [],
          customizations: [],
          snapshot: {
            id: uid('fixedsnap'),
            name: m.name || 'มื้อประจำ',
            emoji: m.emoji || '🥤',
            baseCalories: m.cal || 0,
            protein_g: m.protein || 0,
            carbs_g: m.carbs || 0,
            fat_g: m.fat || 0,
            sugar_g: m.sugar || 0,
            baseWeight_g: 0
          }
        });
      } else {
        addLogEntry({
          mealId: m.mealId,
          sizePct: m.sizePct || 100,

  // v1.10.19 — open swap drawer instead of instant-swap (user picks from list)
  'swap-plan-meal': (e, btn) => {

    if (!plan) return;

  // v1.10.19 — drawer pick: replace meal slot with chosen alternative
  'swap-drawer-pick': (e, btn) => {
    const altId = btn.dataset.id;
    const sd = state.tmp.swapDrawer;
    const plan = state.tmp.plan;
    if (!sd || !plan) return;
    const day = plan.days.find(d => d.day === sd.day);
    if (!day) return;
    const meal = day.meals[sd.idx];
    if (!meal) return;
    const alt = findMeal(altId);
    if (!alt) return toast('ไม่พบเมนู', true);
    // Subtract old totals (use entry's stored cal/protein which respects size/qty/addons)
    day.totalCal -= meal.cal;
    day.totalProtein -= meal.protein;
    day.totalCarbs -= meal.carbs || 0;
    day.totalFat -= meal.fat || 0;
    day.totalSugar -= meal.sugar || 0;
    // Replace — reset modifications since they're meal-specific
    day.meals[sd.idx] = {
      slot: 'meal',
      mealId: alt.id,
      name: alt.name,
      emoji: alt.emoji || '🍽️',
      cal: alt.baseCalories || 0,
      protein: alt.protein_g || 0,
      carbs: alt.carbs_g || 0,
      fat: alt.fat_g || 0,
      sugar: alt.sugar_g || 0,
      sizePct: 100,
      quantity: 1,
      addons: [],
      customizations: []
    };
    day.totalCal += alt.baseCalories || 0;
    day.totalProtein += alt.protein_g || 0;
    day.totalCarbs += alt.carbs_g || 0;
    day.totalFat += alt.fat_g || 0;
    day.totalSugar += alt.sugar_g || 0;
    // Recompute averages
    plan.avgCal = plan.days.reduce((s, d) => s + d.totalCal, 0) / plan.days.length;
    plan.avgProtein = plan.days.reduce((s, d) => s + d.totalProtein, 0) / plan.days.length;
    state.tmp.swapDrawer = null;
    state.tmp.swapDrawerSearch = '';     // v1.10.20

  // v1.10.19 — modify meal inside plan (size/qty/addons) without logging today.
  // Reuses meal-detail view via state.tmp.planEditing flag — save button changes
  // to "บันทึกกลับเข้าแผน" + handler save-plan-meal mutates the plan in place.
  'goto-plan-meal-edit': (e, btn) => {
    const dayNum = Number(btn.dataset.day);
    const idx = Number(btn.dataset.idx);
    const plan = state.tmp.plan;
    if (!plan) return;
    const day = plan.days.find(d => d.day === dayNum);
    if (!day) return;
    const meal = day.meals[idx];
    if (!meal || !meal.mealId) return;
    // Restore addonCounts from stored addons array
    const addonCounts = {};
    (meal.addons || []).forEach(a => {
      const aid = typeof a === 'string' ? a : a.id;
      const c = typeof a === 'string' ? 1 : (a.count || 0);
      if (c > 0) addonCounts[aid] = c;
    });
    go('meal-detail', {
      mealId: meal.mealId,
      sizePct: meal.sizePct || 100,
      quantity: meal.quantity || 1,

      customizations: (meal.customizations || []).slice(),

    });

  // v1.10.19 — save modifications back into the plan slot (no logging)
  'save-plan-meal': () => {
    const pe = state.tmp.planEditing;
    if (!pe) return toast('ไม่พบบริบทแผน', true);
    const meal = state.tmp.meal || findMeal(state.tmp.mealId);
    if (!meal) return toast('ไม่พบเมนู', true);
    const qty = state.tmp.quantity == null ? 1 : state.tmp.quantity;
    if (qty < 1) return toast('ตั้งจำนวนอย่างน้อย 1', true);
    const sizePct = state.tmp.sizePct || 100;
    const counts = state.tmp.addonCounts || {};
    const addons = Object.keys(counts).filter(k => counts[k] > 0).map(id => ({ id, count: counts[id] }));
    const customizations = (state.tmp.customizations || []).slice();
    // Compute totals respecting size/qty/customizations/addons (mirrors renderMealDetail logic)
    const mult = sizePct / 100;
    const factor = mult * qty;
    let baseCal = meal.baseCalories;
    let baseProt = meal.protein_g;
    let baseCarb = meal.carbs_g;
    let baseFat = meal.fat_g;
    let baseSugar = meal.sugar_g || 0;
    if (customizations.length && Array.isArray(meal.customizations)) {
      customizations.forEach(cid => {
        const c = meal.customizations.find(x => x.id === cid);
        if (!c) return;
        baseCal += c.calChange || 0;
        baseProt += c.proteinChange || 0;
        baseCarb += c.carbChange || 0;
        baseFat += c.fatChange || 0;
        baseSugar += c.sugarChange || 0;
      });
    }
    let cal = baseCal * factor;
    let prot = baseProt * factor;
    let carb = baseCarb * factor;
    let fat = baseFat * factor;
    let sugar = baseSugar * factor;
    ADDONS.forEach(a => {
      const c = counts[a.id] || 0;
      cal += a.calories * c;
      prot += a.protein_g * c;
      carb += a.carbs_g * c;
      fat += a.fat_g * c;
      sugar += (a.sugar_g || 0) * c;
    });
    // Locate target slot and update
    const day = pe.plan.days.find(d => d.day === pe.day);
    if (!day) return toast('ไม่พบวันในแผน', true);
    const old = day.meals[pe.idx];
    if (!old) return toast('ไม่พบมื้อในแผน', true);
    day.totalCal -= old.cal;
    day.totalProtein -= old.protein;
    day.totalCarbs -= old.carbs || 0;
    day.totalFat -= old.fat || 0;
    day.totalSugar -= old.sugar || 0;
    day.meals[pe.idx] = {
      slot: 'meal',
      mealId: meal.id,
      name: meal.name,
      emoji: meal.emoji || '🍽️',
      cal, protein: prot, carbs: carb, fat, sugar,
      sizePct, quantity: qty, addons, customizations
    };
    day.totalCal += cal;
    day.totalProtein += prot;
    day.totalCarbs += carb;
    day.totalFat += fat;
    day.totalSugar += sugar;
    // Recompute averages
    pe.plan.avgCal = pe.plan.days.reduce((s, d) => s + d.totalCal, 0) / pe.plan.days.length;
    pe.plan.avgProtein = pe.plan.days.reduce((s, d) => s + d.totalProtein, 0) / pe.plan.days.length;
    toast('💾 บันทึกในแผนแล้ว');
    // Pop back to plan view (state.stack has it from go() that brought us here)
    back();
  },

  'online-search': async () => {
    const input = document.getElementById('online-q');
    const typed = (input?.value || '').trim();
    const q = typed || state.tmp.query || '';
    if (q.length < 2) { toast('พิมพ์ชื่อเมนูก่อน', true); return; }
    state.tmp.query = q;
    state.tmp.error = '';
    state.tmp.result = null;

    if (!state.tmp.bypassCache) {
      const cached = getCachedEstimate(q);
      if (cached) {
        state.tmp.result = { ...cached, fromCache: true };
        render();
        return;
      }
    }
    state.tmp.bypassCache = false;
    state.tmp.loading = true;
    render();
    try {
      const res = await fetch('/api/estimate-meal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mealName: q })
      });
      const data = await res.json();
      state.tmp.loading = false;
      if (!res.ok) {
        state.tmp.error = data.error || 'ค้นหาไม่สำเร็จ';
      } else {
        cacheEstimate(q, data);
        state.tmp.result = { ...data, fromCache: false };
      }
    } catch (err) {
      state.tmp.loading = false;
      state.tmp.error = 'เชื่อมต่อไม่ได้ ลองใหม่';
    }
    render();
  },

  // v1.10.55 — T-026b: ลบข้อมูลเงินของคนนี้ก่อน (ถ้าไม่สำเร็จ ไม่ลบโปรไฟล์) แล้วจึงลบสุขภาพ
  // สุขภาพบันทึกไม่สำเร็จ → คืนข้อมูลเงินที่ลบไป · ไม่ขึ้น "ลบแล้ว" จนกว่าทั้งสองส่วนสำเร็จจริง
  'delete-user': async () => {
    if (state.users.length <= 1) return toast('ต้องมีอย่างน้อย 1 ผู้ใช้', true);
    const u = state.tmp.user;
    if (!u || state.tmp.deletingUser || !confirm(`ลบ "${u.name}" และประวัติทั้งหมด (รวมข้อมูลเงินของคนนี้)?`)) return;
    state.tmp.deletingUser = true;
    try {
      const mr = await moneyDeleteUserData(u.id);
      if (!mr.ok) return toast(`ลบข้อมูลเงินของ "${u.name}" ไม่สำเร็จ จึงยังไม่ลบโปรไฟล์ — ลองใหม่อีกครั้ง`, true);
      const before = { users: state.users.slice(), logs: state.logs[u.id], targets: state.dailyTargets[u.id], current: state.currentUserId };
      const idx = state.users.findIndex(x => x.id === u.id);
      if (idx >= 0) state.users.splice(idx, 1);
      delete state.logs[u.id];
      delete state.dailyTargets[u.id];
      if (state.currentUserId === u.id) state.currentUserId = state.users[0].id;
      if (!persist()) {
        state.users = before.users;
        if (before.logs !== undefined) state.logs[u.id] = before.logs;
        if (before.targets !== undefined) state.dailyTargets[u.id] = before.targets;
        state.currentUserId = before.current;
        const back = mr.result ? await moneyPutUserData(u.id, mr.result) : { ok: true };
        return toast(back.ok ? 'ลบโปรไฟล์ไม่สำเร็จ — ข้อมูลยังอยู่ครบ' : 'ลบโปรไฟล์ไม่สำเร็จ และคืนข้อมูลเงินของคนนี้ไม่ได้', true);
      }
      toast('ลบแล้ว');
      goHome();
    } finally {
      state.tmp.deletingUser = false;
    }
  },

  'export-data': async () => {
    let backup;
    try { backup = buildBackupObject(await moneyReadRaw()); }
    catch (e) { return toast('อ่านข้อมูลเงินไม่ได้ จึงยังไม่ดาวน์โหลด — ลองใหม่อีกครั้ง', true); }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pracal-backup-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    try { localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); } catch {}
    toast('ดาวน์โหลดแล้ว');
    // ขอให้เบราว์เซอร์เก็บแบบถาวรตอนที่ผู้ใช้เพิ่งกดเอง (บางเบราว์เซอร์ต้องมีการกด)

      reason: r.source === 'undo' ? 'pre-undo' : 'pre-restore', label: r.fileName || ''
    });
  },
  'restore-undo': async () => {
    const meta = state.backupStatus && state.backupStatus.snapshot;
    if (!meta) return;
    let snap;
    try { snap = await getSafetySnapshot(meta.id); } catch (e) { return toast('อ่านสำเนาไม่ได้', true); }
    if (!snap) return toast('ไม่พบสำเนา (อาจหมดอายุแล้ว)', true);
    let hs = null, money = null;
    try {
      hs = snap.health ? JSON.parse(snap.health) : null;
      money = snap.money ? JSON.parse(snap.money) : null;
    } catch { return toast('สำเนาเสียหาย อ่านไม่ได้', true); }
    let curMoneyRaw;
    try { curMoneyRaw = await moneyReadRaw(); } catch { return toast('อ่านข้อมูลเงินในเครื่องไม่ได้', true); }
    go('restore-preview', { restore: {
      source: 'undo', meta: { createdAt: snap.createdAt, reason: snap.reason },
      summary: summarizeData(hs, money), healthRaw: snap.health, moneyRaw: snap.money, curMoneyRaw
    } });
  },
  'dismiss-backup-notice': () => dismissBackupNotice(),
  'restore-recovery-retry': async () => {

    if (!j) return location.reload();

function collectManualDraft() {
  const name = document.getElementById('mf-name')?.value.trim();
  const cal = Number(document.getElementById('mf-cal')?.value);
  const wt = Number(document.getElementById('mf-wt')?.value) || 0;
  const p = Number(document.getElementById('mf-p')?.value) || 0;
  const c = Number(document.getElementById('mf-c')?.value) || 0;
  const f = Number(document.getElementById('mf-f')?.value) || 0;
  const s = Math.min(c, Number(document.getElementById('mf-s')?.value) || 0);
  if (!name) { toast('กรอกชื่อเมนู', true); return null; }
  if (!cal || cal < 0) { toast('กรอกแคลอรี่', true); return null; }
  const emoji = state.tmp.draft?.emoji || '🍽️';
  return { name, emoji, baseCalories: cal, baseWeight_g: wt, protein_g: p, carbs_g: c, fat_g: f, sugar_g: s };
}

// v1.10.32 — T-013b: file input change listener for check-in photo capture
// v1.10.33 — T-013b.1: two source variants (camera + gallery) per angle.
// Pattern: checkin-photo-{front|side|back}-{camera|gallery}
document.addEventListener('change', (e) => {
  if (!e.target || !e.target.id) return;
  // v1.10.56 — T-026c: วันที่ในฟอร์มเงิน · ช่วงกำหนดเองของแท็บเงิน
  if (e.target.id === 'mf-date' && state.tmp.mf) {
    moneyFormSync();
    if (isRealDateKey(e.target.value)) state.tmp.mf.date = e.target.value;
    render();
    return;
  }
  if (e.target.id === 'money-range-start' || e.target.id === 'money-range-end') {
    const st = document.getElementById('money-range-start')?.value, en = document.getElementById('money-range-end')?.value;
    if (!isRealDateKey(st) || !isRealDateKey(en)) { state.tmp.rangeError = 'เลือกวันที่ให้ครบ'; return render(); }
    if (en < st) { state.tmp.rangeError = 'วันสิ้นสุดต้องไม่ก่อนวันเริ่ม'; return render(); }
    state.tmp.rangeError = '';
    moneySetPeriod({ kind: 'custom', start: st, end: en });
    render();
    return;
  }
  // v1.10.54 — T-026a: ไฟล์สำรองที่เลือกเพื่อนำเข้า
  if (e.target.id === 'backup-import-file') {
    const file = e.target.files && e.target.files[0];
    try { e.target.value = ''; } catch (err) {}
    if (file) handleBackupFile(file);
    return;
  }
  const m = String(e.target.id).match(/^checkin-photo-(front|side|back)(?:-(camera|gallery))?$/);
  if (m) {
    const angle = m[1];
    const file = e.target.files && e.target.files[0];
    if (file) handleCheckinPhotoUpload(angle, file);
    // Reset input value so picking the same file twice still fires change
    try { e.target.value = ''; } catch (err) {}
  }
  // v1.10.34 — T-013c: compare custom-mode side selectors
  if (e.target.id === 'compare-left-select' || e.target.id === 'compare-right-select') {
    const u = currentUser();
    if (!u) return;
    const all = u.checkIns || [];
    const newId = e.target.value;
    if (!all.find(c => c.id === newId)) return;
    const side = e.target.id === 'compare-left-select' ? 'leftId' : 'rightId';
    // Revoke + re-fetch URLs for the changed side
    revokeUrlMap(state.tmp.comparePhotoUrls);
    state.tmp[side] = newId;
    state.tmp.comparePhotoUrls = {};
    const leftCi = all.find(c => c.id === state.tmp.leftId);
    const rightCi = all.find(c => c.id === state.tmp.rightId);
    Promise.all([
      fetchCheckinPhotoUrls(leftCi),
      fetchCheckinPhotoUrls(rightCi)
    ]).then(([leftUrls, rightUrls]) => {
      Object.assign(state.tmp.comparePhotoUrls, leftUrls, rightUrls);
      render();
    });
  }
});

/* ========== INIT ========== */
async function loadPreloadedMeals() {
  try {
    const res = await fetch('./meals.json');
    const data = await res.json();
    state.preloadedMeals = data.meals || [];
  } catch (err) {
    console.error('ไม่สามารถโหลด meals.json', err);
    state.preloadedMeals = [];
    toast('โหลดเมนูไม่ได้', true);
  }
}

async function loadBrandedProducts() {
  try {
    const res = await fetch('./branded_products.json');
    const data = await res.json();
    state.brandedProducts = data.products || [];
  } catch (err) {
    console.error('ไม่สามารถโหลด branded_products.json', err);
    state.brandedProducts = [];
  }
}

function migrateData() {
  let changed = false;
  state.users.forEach(u => {
    if (!u.weights) { u.weights = []; changed = true; }
    if (!u.waist) { u.waist = []; changed = true; }   // v1.10.30 — T-012
    if (!u.checkIns) { u.checkIns = []; changed = true; }   // v1.10.31 — T-013a Body Progress
    if (!u.displayMode) { u.displayMode = 'normal'; changed = true; }
    if (!u.defaultActivity) { u.defaultActivity = 'none'; changed = true; }
    if (!u.scannedProducts) { u.scannedProducts = []; changed = true; }
    if (u.onboardingComplete === undefined) { u.onboardingComplete = true; changed = true; }
    if (u.photo === undefined) { u.photo = ''; changed = true; }
    if (typeof u.goalAdjust !== 'number') {
      u.goalAdjust = GOAL_ADJUST[u.goal] ?? 0;
      changed = true;
    }
    if (!u.activities) { u.activities = {}; changed = true; }
    // v1.8.2: legacy activity level keys
    if (u.defaultActivity && !ACTIVITY_LABELS[u.defaultActivity]) {
      u.defaultActivity = ACTIVITY_LEGACY_MAP[u.defaultActivity] || 'sedentary';
      changed = true;
    }
    // v1.8.5: deprecate manual mode (BMR-only is unrealistic, NEAT exists)
    // Manual users get bumped to sedentary baseline (BMR × 1.2 = BMR + NEAT)
    if (u.activityMode === 'manual') {
      u.defaultActivity = 'sedentary';
      delete u.activityMode;
      changed = true;
    } else if (u.activityMode) {
      delete u.activityMode;
      changed = true;
    }
    if (!u.streakState) { u.streakState = defaultStreakState(); changed = true; }
    else { ensureStreakState(u); replenishTokensIfNeeded(u); }
    // v1.10.45 — T-019: seed birthYear so age auto-increments. We can't recover the
    // true birthday; assume the snapshot age was accurate as of now → at migration
    // effectiveAge() returns exactly the old age (zero immediate change), then
    // increments on future calendar-year rollovers.
    if (typeof u.birthYear !== 'number' && typeof u.age === 'number' && u.age > 0) {
      u.birthYear = Number(todayKey().slice(0, 4)) - u.age;
      changed = true;
    }
  });
  for (const userId in state.logs) {
    for (const date in state.logs[userId]) {
      const entries = state.logs[userId][date];
      entries.forEach(e => {
        if (e.quantity === undefined) { e.quantity = 1; changed = true; }
        if (Array.isArray(e.addons) && e.addons.length > 0 && typeof e.addons[0] === 'string') {
          e.addons = e.addons.map(id => ({ id, count: 1 }));
          changed = true;
        }
        if (!Array.isArray(e.customizations)) { e.customizations = []; changed = true; }
      });
    }
  }
  if (changed) persist();
}

function initFromStorage() {
  const s = loadStored();
  if (s) {
    state.users = s.users || [];
    state.currentUserId = s.currentUserId || (state.users[0]?.id ?? null);
    state.customMeals = s.customMeals || [];
    state.favorites = s.favorites || [];
    state.logs = s.logs || {};
    state.dailyTargets = s.dailyTargets || {};
    // v1.10.38 — T-013d.3: restore BPC range UI preference (defensive default)
    state.bpcRange = s.bpcRange || { preset: '30d' };
  }
  migrateData();
}

async function main() {
  // v1.10.54 — T-026a: แท็บอื่นกู้คืนข้อมูล → แท็บนี้ถือข้อมูลเก่า ต้องโหลดใหม่ ห้ามเขียนทับ
  window.addEventListener('storage', (e) => {
    if (e.key === RESTORE_EPOCH_KEY && (e.newValue || '') !== _loadedRestoreEpoch) reloadAfterExternalRestore();
  });
  // v1.10.54 — T-026a: ถ้าเพิ่งกู้คืน ต้องพิสูจน์ว่าข้อมูลใช้ได้จริงก่อนยอมรับ ไม่งั้นคืนสำเนาเดิมอัตโนมัติ
  // v1.10.56: จัดการการนำเข้าที่ค้าง (ปิดหน้าระหว่างเขียน/คืนค่า) ก่อน init — init อาจเขียนผ่าน migrateData
  const guard = await handleRestoreJournalAtBoot();
  if (guard.wait) { state.view = 'restore-wait'; state.tmp = {}; render(); pollRestoreWait(); return; }
  if (guard.stop) { if (guard.recovery) { state.view = 'restore-recovery'; state.tmp = {}; render(); } return; }
  const restoreMarker = guard.verify || null;   // แท็บที่นำเข้า (หรือรับช่วง) ตรวจต่อด้านล่าง · แท็บอื่นเปิดตามปกติ
  let initError = null;
  try { initFromStorage(); } catch (err) { initError = err; }
  await Promise.all([loadPreloadedMeals(), loadBrandedProducts()]);
  if (restoreMarker) {
    if (!initError) { try { smokeTestAllProfiles(); } catch (err) { initError = err; } }
    if (initError) {
      const r = await revertOrRecover(restoreMarker, 'restore-reverted');
      if (r.recovery) { state.view = 'restore-recovery'; state.tmp = {}; render(); }
      return;
    }
    clearRestoreMarker();
    let pending = null;
    try { pending = sessionStorage.getItem(BOOT_NOTICE_KEY); } catch {}
    if (!pending) setBootNotice(restoreMarker.reason === 'pre-undo' ? 'undo-ok' : 'restore-ok', '');
  } else if (initError) {
    throw initError;   // เปิดแอปปกติ: คงพฤติกรรมเดิม
  }
  state.ready = true;
  if (state.users.length === 0) {
    state.view = 'onboarding';
    state.tmp = { step: 1 };
  } else {
    state.view = 'dashboard';
    state.tmp = {};
  }
  render();
  // v1.10.54 — T-026a: ข้อความหลังกู้คืน/ย้อนกลับ + ล้างสำเนาที่เกิน 7 วัน
  showPendingBootNotice();
  moneyBoot();   // v1.10.56 — T-026c: โหลดข้อมูลเงิน (IndexedDB) หลังหน้าแรกขึ้นแล้ว
  pruneSafetySnapshots().catch(() => {});

  // v1.10.0 — show migration notice once if user has prior data
  try {
    const seen = localStorage.getItem('pracal_v1_10_notice_seen');
    // v1.10.54 — T-026a: ไม่ซ้อนกับข้อความหลังกู้คืน (จะแสดงในการเปิดครั้งถัดไป)
    if (!seen && state.users.length > 0 && !document.getElementById('backup-notice')) {
      setTimeout(() => showV110Notice(), 1200);
    }
  } catch {}

  // v1.10.0 — console verification (sanity checks for key meals/drinks)
  if (typeof window !== 'undefined') {
    try { runV110VerificationTests(); } catch (e) { console.warn('[v1.10 verify]', e); }
  }

  // Service worker
  // v1.10.44 — T-018: force update check on registration + visibilitychange.
  // Browser default auto-check is once per 24h; without explicit reg.update(),
  // users opening the app within that window see no update banner even when
  // a new SW is deployed. updateViaCache:'none' bypasses HTTP cache for the
  // SW file itself (belt-and-suspenders alongside netlify.toml no-cache header).
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.register('./service-worker.js', {
        updateViaCache: 'none'
      });
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner();
          }
        });
      });
      if (reg.waiting && navigator.serviceWorker.controller) {
        showUpdateBanner();
      }
      // Force check on this load (don't wait for browser's 24h cycle)
      reg.update().catch(() => {});
      // Re-check whenever the app comes back to foreground
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          reg.update().catch(() => {});
        }
      });
    } catch (err) {
      console.warn('SW registration failed', err);
    }
  }
}

// v1.10.0 — Console verification — sanity checks for new portion/calorie defaults
function runV110VerificationTests() {
  const findById = id => state.preloadedMeals.find(m => m.id === id);
  const test = (name, actual, expected, tol = 30) => {
    const ok = Math.abs(actual - expected) <= tol;
    const log = ok ? console.log : console.warn;
    log(`[v1.10] ${ok ? '✓' : '✗'} ${name}: ${actual} (expected ~${expected}, tol ±${tol})`);
    return ok;
  };
  // Compute total cal from base + customization deltas (simulating calcEntryTotals at sizePct=100)
  const sim = (id, cIds = []) => {
    const m = findById(id);
    if (!m) return null;
    let cal = m.baseCalories || 0;
    (cIds || []).forEach(cid => {
      const c = (m.customizations || []).find(x => x.id === cid);
      if (c) cal += c.calChange || 0;
    });
    return cal;
  };
  console.group('[v1.10] Verification tests');
  // Rice
  test('ข้าวกะเพราไก่ base', sim('r01'), 610);
  test('ข้าวมันไก่ base', sim('r04'), 600);
  test('ข้าวมันไก่ + no_skin_default', sim('r04', ['no_skin_default']), 490);
  test('ข้าวมันไก่ + no_skin_more', sim('r04', ['no_skin_more']), 470);
  test('ข้าวขาหมู base', sim('r07'), 660);
  test('ข้าวขาหมู + no_skin_fat_default', sim('r07', ['no_skin_fat_default']), 440);
  test('ข้าวขาหมู + no_skin_fat_only', sim('r07', ['no_skin_fat_only']), 350);
  test('ข้าวขาหมู + lean_meat_replace', sim('r07', ['lean_meat_replace']), 510);
  test('ข้าวหน้าเป็ด base', sim('r16'), 690);
  test('ข้าวหน้าเป็ด + no_skin_default', sim('r16', ['no_skin_default']), 540);
  test('ข้าวหน้าเป็ด + no_skin_only', sim('r16', ['no_skin_only']), 510);
  test('ข้าวหมูกรอบ base', sim('r06'), 970);
  test('ข้าวหมูกรอบ + no_skin_fat_default', sim('r06', ['no_skin_fat_default']), 790);
  test('ข้าวหมูกรอบ + no_skin_fat_more', sim('r06', ['no_skin_fat_more']), 720);
  test('ข้าวหมูสามชั้น base', sim('r23'), 805);
  test('ข้าวหมูสามชั้น + no_skin_fat_default', sim('r23', ['no_skin_fat_default']), 525);
  test('ข้าวหมูสามชั้น + no_skin_fat_more', sim('r23', ['no_skin_fat_more']), 425);
  test('ข้าวหมูแดง base', sim('r05'), 590);
  test('ข้าวหมูแดง + lean_select_default', sim('r05', ['lean_select_default']), 530);
  test('ข้าวไก่ทอด base', sim('r22'), 650);
  test('ข้าวไก่ทอด + less_skin_batter_some', sim('r22', ['less_skin_batter_some']), 550);
  test('ข้าวไก่ทอด + less_skin_batter_more', sim('r22', ['less_skin_batter_more']), 450);
  // Drinks
  test('ชาไทยเย็น (รถเข็น 22oz)', sim('d21'), 400);
  test('ชาไทยเย็น (คาเฟ่)', sim('d26'), 260);
